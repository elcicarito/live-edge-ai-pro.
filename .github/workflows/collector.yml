name: LIVE EDGE AUTO COLLECTOR

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-v2-football-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore latest Flashscore data
        run: |
          git fetch --depth=1 origin live-data-v2
          git checkout origin/live-data-v2 -- data/
          mkdir -p data
          # Remove the temporary oversized browser export; the app reads the permanent gzip timeline directly.
          rm -f data/flashscore-live-timeline-recent.json

      - name: Checkout pinned Flashscore scraper
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: omkarcloud/flashscore-scraper
          ref: af784a918fc94339fd2c8ff0fadc1da69a6139d8
          path: .flashscore-scraper

      - name: Expose Flashscore current-stage clock metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".flashscore-scraper/flashscore/matches.py")
          if not path.exists():
              raise SystemExit("Pinned Flashscore scraper source is unavailable")
          source = path.read_text()
          start = source.find("def get_details(match):")
          if start < 0:
              raise SystemExit("get_details function not found")
          end = source.find("\ndef ", start + 1)
          if end < 0:
              end = len(source)
          block = source[start:end]
          marker = "    return summary"
          if marker not in block:
              raise SystemExit("get_details return marker not found")
          if "live_clock_metadata" not in block:
              injected = """    summary["live_clock_metadata"] = {
                  "stage_start_epoch": P.to_int(environment.get("eventStageStartTime")),
                  "stage_id": P.to_int(environment.get("eventStageId")),
                  "stage_type_id": P.to_int(environment.get("eventStageTypeId")),
                  "format": P.clean(core.get("DM")) or None,
                  "core_minute": P.to_int(core.get("DI")),
              }
          """
              block = block.replace(marker, injected + marker, 1)
              path.write_text(source[:start] + block + source[end:])
          print("Flashscore clock metadata is available.")

      - name: Build isolated Flashscore API
        run: docker build -t live-edge-flashscore .flashscore-scraper

      - name: Start Flashscore API
        run: |
          docker run -d --rm --name live-edge-flashscore -p 127.0.0.1:8000:8000 live-edge-flashscore
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health -o /tmp/live-edge-flashscore-health.json; then
              cat /tmp/live-edge-flashscore-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Flashscore API did not become healthy."
          exit 1

      - name: Collect Flashscore LIVE matches and permanent timeline
        run: node scripts/flashscore-only-collector.js

      - name: Settle confirmed Flashscore final results
        run: node scripts/flashscore-outcome-settlement.js

      - name: Capture and settle Flashscore BTTS signals
        if: always()
        run: |
          if [ -s data/flashscore-live-current.json ]; then
            node scripts/flashscore-btts-collector.js
          else
            echo "Flashscore current snapshot missing; BTTS capture skipped."
            exit 1
          fi

      - name: Test retrospective BTTS 70+ archive evaluation
        run: node scripts/test-flashscore-btts-archive-evaluation.js
      - name: Build retrospective BTTS 70+ archive evaluation
        run: node scripts/flashscore-btts-archive-evaluation.js
      - name: Normalize Flashscore primary feed
        run: node scripts/flashscore-primary-adapter.js

      - name: Train forward-only AI Edge model from new LIVE captures
        run: |
          node scripts/test-ai-edge-live-online-trainer.js
          node scripts/ai-edge-live-online-trainer.js

      - name: Build permanent AI Edge prediction history
        run: |
          node scripts/test-ai-edge-live-prediction-ledger.js
          node scripts/ai-edge-live-prediction-ledger.js

      - name: Verify permanent Flashscore archive
        continue-on-error: true
        run: node scripts/flashscore-archive-integrity.js

      - name: Test Flashscore archive quality report
        run: node scripts/test-flashscore-archive-quality.js

      - name: Build Flashscore archive quality report
        continue-on-error: true
        run: node scripts/flashscore-archive-quality.js


      - name: Save Flashscore data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin live-data-v2
          git reset --mixed origin/live-data-v2
          git add -A -- data/
          if git diff --cached --quiet; then
            echo "No new Flashscore data changes."
          else
            git commit -m "Update Flashscore LIVE data"
            git push origin HEAD:live-data-v2
          fi

      - name: Stop Flashscore API
        if: always()
        run: docker stop live-edge-flashscore 2>/dev/null || true
