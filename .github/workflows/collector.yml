
name: LIVE EDGE AUTO COLLECTOR

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flashscore-shadow-validation-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore latest isolated validation snapshot
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin flashscore-validation-data >/dev/null 2>&1; then
            git fetch --depth=1 origin flashscore-validation-data
            git checkout origin/flashscore-validation-data -- data/
          else
            echo "Prvý izolovaný Flashscore validačný zber; začíname s prázdnym dátovým priečinkom."
          fi

      - name: Checkout pinned Flashscore scraper source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: omkarcloud/flashscore-scraper
          ref: af784a918fc94339fd2c8ff0fadc1da69a6139d8
          path: .flashscore-scraper

      - name: Build isolated Flashscore API
        continue-on-error: true
        run: |
          if [ -f .flashscore-scraper/Dockerfile ]; then
            docker build -t live-edge-flashscore .flashscore-scraper
          else
            echo "Flashscore scraper checkout unavailable; ESPN collection will continue."
            exit 1
          fi

      - name: Start Flashscore API
        continue-on-error: true
        run: |
          docker run -d --rm --name live-edge-flashscore -p 127.0.0.1:8000:8000 live-edge-flashscore
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health -o /tmp/live-edge-flashscore-health.json; then
              cat /tmp/live-edge-flashscore-health.json
              exit 0
            fi
            sleep 2
          done
          echo "Flashscore API did not become healthy; ESPN collection will continue."
          exit 1

      - name: Collect isolated Flashscore-only archive (shadow validation)
        continue-on-error: true
        run: |
          node scripts/flashscore-only-collector.js

      - name: Keep only Flashscore validation files
        run: |
          mkdir -p data
          find data -maxdepth 1 -type f ! -name 'flashscore-*' -delete

      - name: Save isolated validation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin flashscore-validation-data >/dev/null 2>&1; then
            git fetch --depth=1 origin flashscore-validation-data
            # Keep the validation branch's existing data history, without touching live-data-v2.
            git reset --mixed origin/flashscore-validation-data
          fi
          git add -A -- data/
          if git diff --cached --quiet; then
            echo "Žiadne nové zmeny v izolovanom validačnom archíve."
          else
            git commit -m "Update isolated Flashscore validation data"
            git push origin HEAD:flashscore-validation-data
          fi

      - name: Stop Flashscore API
        if: always()
        run: docker stop live-edge-flashscore 2>/dev/null || true
