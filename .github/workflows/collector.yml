
name: LIVE EDGE AUTO COLLECTOR

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect fresh LIVE football data
        run: |
          mkdir -p data

          node <<'NODE'
          const fs = require("fs");
          const zlib = require("zlib");

          const BASE = "https://sportscore.com/api/v1";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          const ARCHIVE_PATH = "data/live-archive.json";
          const CURRENT_PATH = "data/live-current.json";
          const LATEST_PATH = "data/live-latest.json";
          const HISTORY_PATH = "data/live-history.jsonl.gz";
          const LEGACY_HISTORY_PATH = "data/live-history.jsonl";
          const HISTORY_JSON_PATH = "data/live-history.json";
          const MATCH_TIMELINE_PATH = "data/live-match-timeline.json.gz";
          const LEGACY_MATCH_TIMELINE_PATH = "data/live-match-timeline.json";
          const HISTORY_RETENTION_MS = 7 * 24 * 60 * 60 * 1000;
          const HISTORY_FRONTEND_LIMIT = 288;
          const SIGNAL_ARCHIVE_PATH = "data/signal-archive.json";
          const BTTS_ARCHIVE_PATH = "data/btts-signal-archive.json";

          const REQUIRED_MISSES = 3;
          const DROP_RATIO = 0.5;
          const MIN_BASELINE = 6;

          const collectorMetrics = {
            started_at: new Date().toISOString(),
            request_count: 0,
            success_count: 0,
            failure_count: 0,
            http_429_count: 0,
            http_5xx_count: 0,
            retry_count: 0,
            network_error_count: 0,
            parse_error_count: 0,
            endpoint_counts: {}
          };

          function metricEndpoint(rawUrl) {
            try {
              const pathname = new URL(rawUrl).pathname;
              if (pathname.includes("/fixtures/")) return "fixtures";
              if (pathname.includes("/match/")) return "match_detail";
              return pathname || "other";
            } catch {
              return "other";
            }
          }

          function countMetric(endpoint, key) {
            if (!collectorMetrics.endpoint_counts[endpoint]) {
              collectorMetrics.endpoint_counts[endpoint] = {
                requests: 0, successes: 0, failures: 0
              };
            }
            collectorMetrics.endpoint_counts[endpoint][key]++;
          }

          async function getJSON(url, attempts = 7) {
            let lastError;

            for (let i = 1; i <= attempts; i++) {
              let retryAfterMs = 0;
              let responseReceived = false;

              try {
                const separator = url.includes("?") ? "&" : "?";
                const freshUrl = `${url}${separator}_cache=${Date.now()}_${i}`;
                const endpoint = metricEndpoint(url);
                collectorMetrics.request_count++;
                countMetric(endpoint, "requests");

                const response = await fetch(freshUrl, {
                  headers: {
                    "User-Agent": "LIVE-EDGE-AI-PRO/8.5",
                    "Accept": "application/json",
                    "Cache-Control": "no-cache, no-store, max-age=0",
                    "Pragma": "no-cache"
                  },
                  signal: AbortSignal.timeout(20000),
                  cache: "no-store"
                });
                responseReceived = true;

                if (response.ok) {
                  collectorMetrics.success_count++;
                  countMetric(endpoint, "successes");
                } else {
                  collectorMetrics.failure_count++;
                  countMetric(endpoint, "failures");
                  if (response.status === 429) collectorMetrics.http_429_count++;
                  if (response.status >= 500) collectorMetrics.http_5xx_count++;
                  const error = new Error(`HTTP ${response.status}`);
                  error.status = response.status;
                  const retryAfter = response.headers.get("retry-after");
                  if (retryAfter) {
                    const seconds = Number(retryAfter);
                    retryAfterMs = Number.isFinite(seconds)
                      ? seconds * 1000
                      : Math.max(0, Date.parse(retryAfter) - Date.now());
                  }
                  throw error;
                }

                const data = await response.json();

                if (!data || typeof data !== "object") {
                  throw new Error("Neplatná JSON odpoveď");
                }

                return data;

              } catch (error) {
                lastError = error;
                if (!error.status) {
                  collectorMetrics.failure_count++;
                  countMetric(endpoint, "failures");
                  if (responseReceived) {
                    collectorMetrics.parse_error_count++;
                  } else {
                    collectorMetrics.network_error_count++;
                  }
                }
                console.log(`Pokus ${i}/${attempts}: ${error.message}`);

                const retryable = !error.status ||
                  error.status === 429 ||
                  error.status >= 500;

                if (!retryable || i >= attempts) break;

                collectorMetrics.retry_count++;
                const backoffMs = Math.min(45000, 5000 * (2 ** (i - 1)));
                const delayMs = Math.min(60000, Math.max(backoffMs, retryAfterMs));
                console.log(`Opakujem požiadavku o ${Math.ceil(delayMs / 1000)} s.`);
                await sleep(delayMs);
              }
            }

            throw lastError;
          }

          function readText(path, legacyPath = null) {
            if (fs.existsSync(path)) {
              const bytes = fs.readFileSync(path);
              return path.endsWith(".gz")
                ? zlib.gunzipSync(bytes).toString("utf8")
                : bytes.toString("utf8");
            }
            if (legacyPath && fs.existsSync(legacyPath)) return fs.readFileSync(legacyPath, "utf8");
            return null;
          }

          function readJson(path, fallback, legacyPath = null) {
            const content = readText(path, legacyPath);
            return content === null ? fallback : JSON.parse(content);
          }

          function getStatus(match) {
            const value = match?.status;

            if (typeof value === "string") {
              return value.toLowerCase().trim();
            }

            if (value && typeof value === "object") {
              return String(
                value.type ||
                value.name ||
                value.short ||
                ""
              ).toLowerCase().trim();
            }

            return "";
          }

          function isLive(match) {
            return [
              "live",
              "inplay",
              "in_play"
            ].includes(getStatus(match));
          }

          // Za ukončený považuj iba explicitný konečný stav zo zdroja.
          // Samotné zmiznutie zo LIVE feedu nikdy nestačí.
          function isFinished(match) {
            const status = getStatus(match)
              .replace(/[\s_-]+/g, "")
              .toLowerCase();

            return [
              "finished",
              "fulltime",
              "ft",
              "aet",
              "afterextratime",
              "pen",
              "afterpenalties",
              "completed",
              "ended"
            ].includes(status) ||
              status.includes("finished") ||
              status.includes("fulltime") ||
              status === "complete";
          }

          function getSlug(item) {
            if (item.slug) return item.slug;
            if (!item.url) return null;

            const parts = new URL(
              item.url,
              "https://sportscore.com"
            ).pathname.split("/").filter(Boolean);

            const matchIndex = parts.indexOf("match");

            if (matchIndex >= 0 && parts[matchIndex + 1]) {
              return parts[matchIndex + 1];
            }

            return null;
          }

          function getMatchId(record) {
            const match = record?.match;

            if (match?.tracker?.id) {
              return String(match.tracker.id);
            }

            if (match?.url) {
              const parts = new URL(
                match.url,
                "https://sportscore.com"
              ).pathname.split("/").filter(Boolean);

              return parts[parts.length - 1] || null;
            }

            return null;
          }

          function makeArchiveSnapshot(record, id) {
            return {
              id,
              collected_at: record.collected_at || null,
              match: record.match
            };
          }

          function normalizeArchive(data) {
            if (!data || typeof data !== "object") {
              throw new Error("Neplatný archív");
            }

            if (!Array.isArray(data.archived_matches)) {
              throw new Error("Archív nemá archived_matches");
            }

            if (!Array.isArray(data.pending_matches)) {
              throw new Error("Archív nemá pending_matches");
            }

            return data;
          }

          function readHistoryCounts() {
            const content = readText(HISTORY_PATH, LEGACY_HISTORY_PATH);
            if (content === null) return [];

            return content
              .split("\n")
              .filter(Boolean)
              .slice(-30)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(item =>
                item &&
                item.data_status === "complete" &&
                Number.isFinite(Number(item.fixture_count))
              )
              .map(item => Number(item.fixture_count))
              .filter(count => count >= MIN_BASELINE);
          }

          async function main() {
            const startedAt = new Date().toISOString();

            console.log("================================");
            console.log("LIVE EDGE FRESH COLLECTOR v8.5");
            console.log("Začiatok:", startedAt);
            console.log("Načítavam aktuálny LIVE zoznam...");
            console.log("================================");

            const previousLatest = readJson(LATEST_PATH, null);

            const archive = normalizeArchive(
              readJson(ARCHIVE_PATH, {
                schema_version: 1,
                updated_at: null,
                archived_matches: [],
                pending_matches: []
              })
            );

            const list = await getJSON(
              `${BASE}/fixtures/?sport=football&status=live&limit=200`
            );

            if (!Array.isArray(list.matches)) {
              throw new Error(
                "API nevrátilo platné pole matches. Staré dáta nemením."
              );
            }

            const fixtures = list.matches.filter(isLive);
            const unique = new Map();

            for (const item of fixtures) {
              const slug = getSlug(item);
              if (slug) unique.set(slug, item);
            }

            const uniqueFixtures = [...unique.values()];

            console.log("LIVE zápasy podľa API:", uniqueFixtures.length);

            const records = [];
            const errors = [];
            let verifiedDetailCount = 0;

            async function collectMatch(item) {
              const name = `${item.home || "?"} - ${item.away || "?"}`;

              try {
                const slug = getSlug(item);

                if (!slug) {
                  throw new Error("Chýba slug zápasu");
                }

                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  throw new Error("Chýba detail zápasu");
                }

                const match = detail.match;
                verifiedDetailCount++;

                if (!isLive(match)) {
                  console.log(
                    "VYRADENÝ:",
                    name,
                    "| stav:",
                    getStatus(match) || "neznámy"
                  );
                  return null;
                }

                console.log(
                  "OVERENÝ LIVE:",
                  name,
                  "|",
                  match.live_minute || "?",
                  "min |",
                  match.home_score,
                  ":",
                  match.away_score
                );

                return {
                  collected_at: new Date().toISOString(),
                  match
                };

              } catch (error) {
                const message = `${name}: ${error.message}`;
                errors.push(message);
                console.log("CHYBA:", message);
                return null;
              }
            }

            for (let i = 0; i < uniqueFixtures.length; i += 5) {
              const batch = uniqueFixtures.slice(i, i + 5);

              const results = await Promise.all(
                batch.map(collectMatch)
              );

              records.push(...results.filter(Boolean));
              await sleep(1000);
            }

            const complete = errors.length === 0;

            // =========================================
            // OCHRANA PRED NEÚPLNÝM LIVE ZOZNAMOM
            // =========================================

            const historyCounts = readHistoryCounts();

            const feedGuard = archive.feed_guard || {
              baseline_fixture_count: null,
              suspect_fixture_count: null,
              suspect_runs: 0
            };

            const baselineCandidates = [
              feedGuard.baseline_fixture_count,
              ...historyCounts
            ]
              .map(Number)
              .filter(value =>
                Number.isFinite(value) &&
                value >= MIN_BASELINE
              );

            if (
              previousLatest &&
              previousLatest.data_status === "complete" &&
              Number.isFinite(Number(previousLatest.fixture_count)) &&
              Number(previousLatest.fixture_count) >= MIN_BASELINE
            ) {
              baselineCandidates.push(
                Number(previousLatest.fixture_count)
              );
            }

            let baseline = baselineCandidates.length
              ? Math.max(...baselineCandidates)
              : null;

            let archiveSafe = false;
            let feedDataSafe = false;
            const detailCoverage = uniqueFixtures.length > 0 &&
              verifiedDetailCount === uniqueFixtures.length;

            console.log("Overené detaily:", verifiedDetailCount, "/", uniqueFixtures.length);
            console.log("Aktuálne LIVE zápasy z overených detailov:", records.length);

            if (baseline === null) {
              console.log(
                "VAROVANIE: Chýba dôveryhodná historická základňa."
              );

              if (
                complete &&
                detailCoverage &&
                uniqueFixtures.length >= MIN_BASELINE
              ) {
                feedDataSafe = true;
                feedGuard.baseline_fixture_count =
                  uniqueFixtures.length;

                console.log(
                  "PRVÁ ZÁKLADŇA NASTAVENÁ:",
                  uniqueFixtures.length
                );

                console.log(
                  "Archivácia zostáva pozastavená do ďalšieho zberu."
                );
              }

              feedGuard.suspect_fixture_count = null;
              feedGuard.suspect_runs = 0;

            } else {
              feedGuard.baseline_fixture_count = baseline;

              const minimumExpected = Math.max(
                2,
                Math.ceil(baseline * DROP_RATIO)
              );

              const suspiciousDrop =
                uniqueFixtures.length < minimumExpected;

              console.log("================================");
              console.log("FEED GUARD v8.4");
              console.log("Historická základňa:", baseline);
              console.log("Aktuálny počet:", uniqueFixtures.length);
              console.log("Minimálny očakávaný počet:", minimumExpected);
              console.log("================================");

              if (!complete || !detailCoverage) {
                archiveSafe = false;
                feedDataSafe = false;

                console.log(
                  "NEÚPLNÝ ZBER: Archivácia pozastavená."
                );

              } else if (suspiciousDrop) {
                const previousSuspectCount =
                  Number(feedGuard.suspect_fixture_count);
                const previousSuspectRuns =
                  Number(feedGuard.suspect_runs) || 0;

                // Ak sa nižší počet opakuje aspoň v troch po sebe
                // idúcich kompletných zberoch s overenými detailmi,
                // prijmi ho ako novú základňu. Tým sa zabráni tomu,
                // aby staré historické maximum navždy blokovalo LIVE dáta.
                const stableLowerFeed =
                  previousSuspectRuns >= 2 &&
                  Number.isFinite(previousSuspectCount) &&
                  uniqueFixtures.length >= Math.max(
                    2,
                    Math.floor(previousSuspectCount * 0.7)
                  ) &&
                  uniqueFixtures.length <= Math.ceil(
                    previousSuspectCount * 1.3
                  );

                if (stableLowerFeed) {
                  archiveSafe = true;
                  feedDataSafe = true;
                  baseline = uniqueFixtures.length;
                  feedGuard.baseline_fixture_count = baseline;
                  feedGuard.suspect_fixture_count = null;
                  feedGuard.suspect_runs = 0;

                  console.log("================================");
                  console.log(
                    "STABILNÝ NIŽŠÍ LIVE FEED POTVRDENÝ"
                  );
                  console.log(
                    "Nová základňa:",
                    baseline
                  );
                  console.log(
                    "Všetky detaily boli overené:",
                    detailCoverage
                  );
                  console.log(
                    "Aktualizácia LIVE dát a bezpečná archivácia povolená."
                  );
                  console.log("================================");

                } else {
                  archiveSafe = false;
                  feedDataSafe = false;

                  feedGuard.suspect_fixture_count =
                    uniqueFixtures.length;

                  feedGuard.suspect_runs =
                    previousSuspectRuns + 1;

                  console.log("================================");
                  console.log(
                    "VAROVANIE: PODOZRIVÝ POKLES LIVE ZÁPASOV"
                  );
                  console.log("Historická základňa:", baseline);
                  console.log(
                    "Aktuálny počet:",
                    uniqueFixtures.length
                  );
                  console.log(
                    "Podozrivé zbery:",
                    feedGuard.suspect_runs
                  );
                  console.log("ARCHIVÁCIA POZASTAVENÁ.");
                  console.log("================================");
                }

              } else {
                archiveSafe = true;
                feedDataSafe = true;

                feedGuard.suspect_fixture_count = null;
                feedGuard.suspect_runs = 0;

                // Základňu možno zvýšiť, nikdy automaticky znížiť.
                if (uniqueFixtures.length > baseline) {
                  baseline = uniqueFixtures.length;
                  feedGuard.baseline_fixture_count = baseline;
                }
              }
            }

            archive.feed_guard = feedGuard;

            const output = {
              collected_at: new Date().toISOString(),
              collection_started_at: startedAt,
              source: "SportScore API v1",
              collector_version: "8.5",
              data_status: archiveSafe ? "complete" : "partial",
              collection_complete: complete,
              archive_safe: archiveSafe,
              fixture_count: uniqueFixtures.length,
              live_count: records.length,
              saved_count: records.length,
              errors,
              records
            };

            // =========================================
            // ARCHÍV ZÁPASOV
            // =========================================

            const archived = new Map();
            const pending = new Map();

            for (const item of archive.archived_matches) {
              if (item?.id) {
                archived.set(String(item.id), item);
              }
            }

            for (const item of archive.pending_matches) {
              if (item?.id) {
                pending.set(String(item.id), item);
              }
            }

            const currentById = new Map();

            for (const record of records) {
              const id = getMatchId(record);

              if (id) {
                currentById.set(
                  id,
                  makeArchiveSnapshot(record, id)
                );
              }
            }

            const now = new Date().toISOString();

            // Migruj staršie archívne záznamy, ktoré boli kedysi uzavreté
            // iba podľa zmiznutia z feedu, späť do sledovania konečného detailu.
            for (const [id, item] of [...archived.entries()]) {
              if (item?.status_confirmation === "confirmed_finished") continue;
              if (!item?.last_snapshot?.match || pending.has(id)) continue;

              archived.delete(id);
              pending.set(id, {
                id,
                first_missing_at: item.first_missing_at || item.archived_at || now,
                last_missing_at: now,
                last_seen_at: item.last_seen_at || item.last_snapshot.collected_at || null,
                missing_complete_runs: item.missing_complete_runs || REQUIRED_MISSES,
                last_snapshot: item.last_snapshot,
                final_check_attempts: item.final_check_attempts || 0
              });

              console.log("STARŠÍ NEPOTVRDENÝ ARCHÍV VRÁTENÝ NA KONTROLU KONEČNÉHO VÝSLEDKU:", id);
            }

            // Ak zápas zmizne z LIVE zoznamu, vytvor kandidáta na samostatné
            // sledovanie aj pri aktívnom feed guarde. Pred archiváciou sa vždy
            // overí jeho vlastný detail – samotná neprítomnosť nestačí.
            if (
              complete &&
              previousLatest &&
              previousLatest.data_status === "complete" &&
              Array.isArray(previousLatest.records)
            ) {
              for (const record of previousLatest.records) {
                const id = getMatchId(record);
                if (!id || currentById.has(id) || pending.has(id) || archived.has(id)) continue;

                pending.set(id, {
                  id,
                  first_missing_at: now,
                  last_missing_at: now,
                  last_seen_at: record.collected_at || null,
                  missing_complete_runs: 1,
                  last_snapshot: makeArchiveSnapshot(record, id)
                });

                console.log("NOVÝ KANDIDÁT NA SLEDOVANIE DO KONCA:", id);
              }
            }

            // Pokračuj v kontrole zápasov, ktoré už zmizli z LIVE zoznamu.
            // Konečný archív vytvor až po potvrdenom FINISHED/FT stave a skóre.
            for (const [id, item] of [...pending.entries()]) {
              const slug = getSlug(item?.last_snapshot?.match || {});

              if (!slug) {
                item.final_check_error = "Chýba slug zápasu pre kontrolu konečného výsledku.";
                item.last_final_check_at = now;
                pending.set(id, item);
                console.log("ČAKÁ NA KONEČNÝ VÝSLEDOK – chýba slug:", id);
                continue;
              }

              try {
                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  throw new Error("Detail zápasu neobsahuje match");
                }

                const finalMatch = detail.match;
                const finalStatus = getStatus(finalMatch);
                item.final_check_attempts = (item.final_check_attempts || 0) + 1;
                item.last_final_check_at = now;
                item.last_checked_status = finalStatus || "unknown";

                if (isLive(finalMatch)) {
                  if (currentById.has(id)) {
                    pending.delete(id);
                    console.log("ZÁPAS JE OPÄŤ V LIVE FEED-e:", id);
                  } else {
                    item.last_snapshot = makeArchiveSnapshot({
                      collected_at: now,
                      match: finalMatch
                    }, id);
                    item.last_checked_status = finalStatus || "live";
                    pending.set(id, item);
                    console.log("DETAIL POTVRDZUJE, ŽE ZÁPAS EŠTE PREBIEHA – pokračujem v samostatnom sledovaní:", id);
                  }
                  continue;
                }

                if (isFinished(finalMatch)) {
                  const homeRaw = finalMatch.home_score;
                  const awayRaw = finalMatch.away_score;
                  const scoresValid =
                    homeRaw !== null &&
                    homeRaw !== undefined &&
                    awayRaw !== null &&
                    awayRaw !== undefined &&
                    Number.isFinite(Number(homeRaw)) &&
                    Number.isFinite(Number(awayRaw));

                  if (!scoresValid) {
                    item.final_check_error = "Konečný stav potvrdený, ale skóre zatiaľ nie je platné.";
                    pending.set(id, item);
                    console.log("ČAKÁ NA POTVRDENÉ KONEČNÉ SKÓRE:", id);
                    continue;
                  }

                  archived.set(id, {
                    id,
                    archived_at: now,
                    first_missing_at: item.first_missing_at || null,
                    last_seen_at: item.last_seen_at || null,
                    missing_complete_runs: item.missing_complete_runs || 0,
                    archive_reason: "confirmed_finished_match_detail",
                    status_confirmation: "confirmed_finished",
                    final_status: finalStatus,
                    final_score: `${Number(homeRaw)}:${Number(awayRaw)}`,
                    finished_at: now,
                    last_snapshot: item.last_snapshot,
                    final_match: finalMatch
                  });

                  pending.delete(id);
                  console.log(
                    "KONEČNÝ VÝSLEDOK POTVRDENÝ:",
                    id,
                    "|",
                    finalStatus,
                    "|",
                    Number(homeRaw),
                    ":",
                    Number(awayRaw)
                  );
                  continue;
                }

                item.final_check_error = null;
                pending.set(id, item);
                console.log(
                  "ZÁPAS ZOSTÁVA V SLEDOVANÍ – konečný stav nepotvrdený:",
                  id,
                  "| stav:",
                  finalStatus || "neznámy"
                );

              } catch (error) {
                item.final_check_error = error.message;
                item.last_final_check_at = now;
                pending.set(id, item);
                console.log("KONTROLA KONEČNÉHO VÝSLEDKU ZLYHALA:", id, "|", error.message);
              }
            }

            if (archiveSafe) {
              for (const id of currentById.keys()) {
                if (pending.has(id)) {
                  pending.delete(id);
                  console.log("SPÄŤ V LIVE:", id);
                }
              }

              for (const [id, item] of [...pending.entries()]) {
                if (currentById.has(id)) continue;

                item.missing_complete_runs =
                  (item.missing_complete_runs || 0) + 1;

                item.last_missing_at = now;

                // Tri chýbajúce kompletné zbery potvrdzujú iba neprítomnosť
                // v LIVE feede. Zápas ostáva pending, kým detail nepotvrdí FT.
                pending.set(id, item);

                console.log(
                  item.missing_complete_runs >= REQUIRED_MISSES
                    ? "ZÁPAS STÁLE SLEDOVANÝ – čaká sa na konečný výsledok:"
                    : "ČAKÁ NA POTVRDENIE KONEČNÉHO VÝSLEDKU:",
                  id,
                  "|",
                  item.missing_complete_runs,
                  "kompletných zberov bez LIVE"
                );
              }

              if (
                previousLatest &&
                previousLatest.data_status === "complete" &&
                Array.isArray(previousLatest.records)
              ) {
                for (const record of previousLatest.records) {
                  const id = getMatchId(record);

                  if (!id) continue;
                  if (currentById.has(id)) continue;
                  if (pending.has(id)) continue;
                  if (archived.has(id)) continue;

                  const snapshot = makeArchiveSnapshot(record, id);

                  const item = {
                    id,
                    first_missing_at: now,
                    last_missing_at: now,
                    last_seen_at: record.collected_at || null,
                    missing_complete_runs: 1,
                    last_snapshot: snapshot
                  };

                  pending.set(id, item);

                  console.log("NOVÝ KANDIDÁT ARCHÍVU:", id);
                }
              }

            } else {
              console.log(
                "ARCHÍV BEZ ZMIEN: zber nie je bezpečný na započítanie neprítomnosti."
              );
            }

            archive.updated_at = now;
            archive.archived_matches = [...archived.values()];
            archive.pending_matches = [...pending.values()];

            fs.writeFileSync(
              ARCHIVE_PATH,
              JSON.stringify(archive, null, 2)
            );

            console.log("================================");
            console.log("ARCHIVE RESULT");
            console.log(JSON.stringify({
              archived_matches: archive.archived_matches.length,
              pending_matches: archive.pending_matches.length,
              complete_collection: complete,
              detail_coverage: detailCoverage,
              feed_data_safe: feedDataSafe,
              archive_safe: archiveSafe,
              baseline_fixture_count: feedGuard.baseline_fixture_count,
              suspect_runs: feedGuard.suspect_runs
            }, null, 2));
            console.log("================================");

            // =========================================
            // AKTUÁLNE LIVE DÁTA
            // =========================================

            collectorMetrics.finished_at = new Date().toISOString();
            collectorMetrics.duration_ms =
              Date.parse(collectorMetrics.finished_at) - Date.parse(collectorMetrics.started_at);
            output.collector_metrics = collectorMetrics;
            console.log("FOOTBALL COLLECTOR METRICS:", JSON.stringify(collectorMetrics));

            const metricsPath = "data/football-collector-metrics.jsonl";
            const metricsHistory = fs.existsSync(metricsPath)
              ? fs.readFileSync(metricsPath, "utf8").split("\n").filter(Boolean)
              : [];
            metricsHistory.push(JSON.stringify({
              sport: "football",
              ...collectorMetrics
            }));
            fs.writeFileSync(metricsPath, metricsHistory.slice(-1000).join("\n") + "\n");

            // Aktuálny LIVE zoznam oddeľujeme od bezpečnosti archivácie.
            // Ak API vrátilo platný zoznam a každý vrátený zápas má
            // úspešne overený detail, zobrazíme čerstvé zápasy aj pri
            // podozrivom poklese počtu. V takom prípade však označíme
            // feed ako čiastočný a signály zostanú zablokované.
            const currentFeedVerified =
              complete &&
              (detailCoverage || uniqueFixtures.length === 0);

            if (currentFeedVerified) {
              const currentOutput = {
                ...output,
                data_status: archiveSafe ? "complete" : "partial",
                snapshot_type: archiveSafe
                  ? "current_verified_live"
                  : "current_verified_live_partial",
                archive_safe: archiveSafe,
                feed_guard_warning: !archiveSafe
              };

              fs.writeFileSync(
                CURRENT_PATH,
                JSON.stringify(currentOutput, null, 2)
              );

              console.log(
                archiveSafe
                  ? "AKTUÁLNE LIVE DÁTA AKTUALIZOVANÉ."
                  : "ČIASTOČNÝ LIVE FEED AKTUALIZOVANÝ: overené zápasy sa zobrazia, signály a archivácia zostávajú zablokované."
              );

            } else {
              console.log(
                "LIVE CURRENT ZACHOVANÝ: zoznam alebo detaily zápasov neboli úplne overené."
              );
            }

            // =========================================
            // PÔVODNÝ DÔVERYHODNÝ SNAPSHOT
            // =========================================

            if (archiveSafe) {
              fs.writeFileSync(
                LATEST_PATH,
                JSON.stringify(output, null, 2)
              );

              console.log("LIVE SNAPSHOT AKTUALIZOVANÝ.");

            } else {
              console.log(
                "LIVE SNAPSHOT ZACHOVANÝ: posledné dôveryhodné dáta zostávajú uložené."
              );
            }

            // =========================================
            // HISTÓRIA
            // =========================================

            // Uchovaj surovú históriu posledných 7 dní podľa času merania.
            // Frontendový pracovný buffer ostáva na 288 záznamoch (približne 24 h),
            // aby sa zbytočne nezväčšovalo každé načítanie skenera.
            const historyCutoff = Date.now() - HISTORY_RETENTION_MS;
            const history = (readText(HISTORY_PATH, LEGACY_HISTORY_PATH) || "")
              .split("\n")
              .filter(Boolean)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(batch => {
                if (!batch) return false;
                const stamp = Date.parse(batch.collected_at || "");
                return Number.isFinite(stamp) && stamp >= historyCutoff && stamp <= Date.now() + 5 * 60 * 1000;
              });

            history.push(output);
            history.sort((a, b) =>
              Date.parse(a.collected_at || "") - Date.parse(b.collected_at || "")
            );

            fs.writeFileSync(
              HISTORY_PATH,
              zlib.gzipSync(history.map(batch => JSON.stringify(batch)).join("\n") + "\n")
            );
            if (fs.existsSync(LEGACY_HISTORY_PATH)) fs.unlinkSync(LEGACY_HISTORY_PATH);

            fs.writeFileSync(
              HISTORY_JSON_PATH,
              JSON.stringify(history.slice(-HISTORY_FRONTEND_LIMIT))
            );

            // Samostatná kompaktná časová os každého zápasu za posledných 7 dní.
            // Ukladá iba LIVE merania a štatistiky; nespúšťa ani nemení signály.
            const timelineById = new Map();
            const previousTimeline = readJson(MATCH_TIMELINE_PATH, {
              schema_version: 1,
              retention_days: 7,
              updated_at: null,
              matches: []
            }, LEGACY_MATCH_TIMELINE_PATH);

            for (const item of Array.isArray(previousTimeline.matches) ? previousTimeline.matches : []) {
              if (item?.id) timelineById.set(String(item.id), {
                ...item,
                snapshots: Array.isArray(item.snapshots)
                  ? item.snapshots.filter(snapshot => {
                      const stamp = Date.parse(snapshot.collected_at || "");
                      return Number.isFinite(stamp) && stamp >= historyCutoff;
                    })
                  : []
              });
            }

            for (const batch of history) {
              if (!Array.isArray(batch.records)) continue;

              for (const record of batch.records) {
                const match = record?.match;
                const id = getMatchId(record);
                if (!match || !id || !isLive(match)) continue;

                const collectedAt = record.collected_at || batch.collected_at || null;
                const stamp = Date.parse(collectedAt || "");
                if (!Number.isFinite(stamp) || stamp < historyCutoff) continue;

                const stats = (Array.isArray(match.stats) ? match.stats : [])
                  .filter(stat => stat && typeof stat.label === "string")
                  .map(stat => ({
                    label: stat.label,
                    home: Number.isFinite(Number(stat.home)) ? Number(stat.home) : null,
                    away: Number.isFinite(Number(stat.away)) ? Number(stat.away) : null,
                    suffix: stat.suffix || ""
                  }));

                const item = timelineById.get(id) || {
                  id,
                  home: match.home || "",
                  away: match.away || "",
                  competition: match.competition || "",
                  first_seen_at: collectedAt,
                  last_seen_at: collectedAt,
                  snapshots: []
                };

                item.home = match.home || item.home;
                item.away = match.away || item.away;
                item.competition = match.competition || item.competition;
                item.first_seen_at = !item.first_seen_at || stamp < Date.parse(item.first_seen_at)
                  ? collectedAt
                  : item.first_seen_at;
                item.last_seen_at = !item.last_seen_at || stamp > Date.parse(item.last_seen_at)
                  ? collectedAt
                  : item.last_seen_at;

                const snapshot = {
                  collected_at: collectedAt,
                  minute: Number.isFinite(Number(match.live_minute)) ? Number(match.live_minute) : null,
                  home_score: Number.isFinite(Number(match.home_score)) ? Number(match.home_score) : null,
                  away_score: Number.isFinite(Number(match.away_score)) ? Number(match.away_score) : null,
                  status: getStatus(match),
                  collection_status: batch.data_status || "unknown",
                  stats_count: stats.length,
                  stats,
                  // Úplné dáta z detailu SportScore API bez straty polí.
                  // raw_match obsahuje aj všetky pôvodné štatistiky a ich metadáta.
                  raw_stats: Array.isArray(match.stats) ? match.stats : [],
                  raw_match: match,
                  stats_available: Array.isArray(match.stats) && match.stats.length > 0
                };

                const existingIndex = item.snapshots.findIndex(existing =>
                  existing.collected_at === collectedAt
                );
                if (existingIndex >= 0) item.snapshots[existingIndex] = snapshot;
                else item.snapshots.push(snapshot);

                item.snapshots.sort((a, b) =>
                  Date.parse(a.collected_at || "") - Date.parse(b.collected_at || "")
                );
                timelineById.set(id, item);
              }
            }

            const matchTimeline = {
              schema_version: 2,
              retention_days: 7,
              interval_minutes: 5,
              updated_at: output.collected_at,
              matches: [...timelineById.values()]
                .filter(item => item.snapshots.length > 0)
                .sort((a, b) => Date.parse(b.last_seen_at || 0) - Date.parse(a.last_seen_at || 0))
            };

            fs.writeFileSync(
              MATCH_TIMELINE_PATH,
              zlib.gzipSync(JSON.stringify(matchTimeline))
            );
            if (fs.existsSync(LEGACY_MATCH_TIMELINE_PATH)) fs.unlinkSync(LEGACY_MATCH_TIMELINE_PATH);

            // =========================================
            // TRVALÁ HISTÓRIA UKONČENÝCH ZÁPASOV
            // Sedemdňová LIVE história je iba pracovné okno.
            // Po potvrdení konečného výsledku uložíme zápas a jeho
            // dostupné LIVE snímky do archívu bez automatickej retencie.
            // Zápas sa uloží iba raz podľa stabilného ID.
            // =========================================
            const PERMANENT_MATCH_HISTORY_PATH = "data/live-match-history.jsonl.gz";
            const LEGACY_PERMANENT_MATCH_HISTORY_PATH = "data/live-match-history.jsonl";
            const permanentIds = new Set();
            const existingPermanentText = readText(
              PERMANENT_MATCH_HISTORY_PATH,
              LEGACY_PERMANENT_MATCH_HISTORY_PATH
            ) || "";

            if (existingPermanentText) {
              const existingLines = existingPermanentText.split("\n").filter(Boolean);

              for (const line of existingLines) {
                try {
                  const item = JSON.parse(line);
                  if (item?.match_id) permanentIds.add(String(item.match_id));
                } catch {
                  // Poškodený riadok neblokuje archiváciu ostatných zápasov.
                }
              }
            }

            const permanentRecords = [];
            for (const item of archive.archived_matches || []) {
              if (
                item?.status_confirmation !== "confirmed_finished" ||
                !item.final_match ||
                !item.id
              ) continue;

              const id = String(item.id);
              if (permanentIds.has(id)) continue;

              const timelineItem = timelineById.get(id);
              permanentRecords.push({
                schema_version: 1,
                match_id: id,
                archived_at: item.archived_at || now,
                home: timelineItem?.home || item.final_match.home || "",
                away: timelineItem?.away || item.final_match.away || "",
                competition: timelineItem?.competition || item.final_match.competition || "",
                final_score: item.final_score || null,
                final_status: item.final_status || getStatus(item.final_match),
                final_match: item.final_match,
                // Trvalý archív preberá kompletné surové API snímky z LIVE časovej osi.
                snapshots: Array.isArray(timelineItem?.snapshots)
                  ? timelineItem.snapshots
                  : []
              });
              permanentIds.add(id);
            }

            const permanentAppendText = permanentRecords.map(item => JSON.stringify(item)).join("\n") + (permanentRecords.length ? "\n" : "");
            if (fs.existsSync(PERMANENT_MATCH_HISTORY_PATH)) {
              // Concatenated gzip members allow append-only growth without rewriting the full archive.
              if (permanentAppendText) fs.appendFileSync(PERMANENT_MATCH_HISTORY_PATH, zlib.gzipSync(permanentAppendText));
            } else if (existingPermanentText || permanentAppendText) {
              fs.writeFileSync(PERMANENT_MATCH_HISTORY_PATH, zlib.gzipSync(existingPermanentText + permanentAppendText));
            }
            if (fs.existsSync(LEGACY_PERMANENT_MATCH_HISTORY_PATH)) fs.unlinkSync(LEGACY_PERMANENT_MATCH_HISTORY_PATH);

            console.log("PERMANENT MATCH HISTORY:", JSON.stringify({
              newly_archived: permanentRecords.length,
              total_archived: permanentIds.size,
              retention: "permanent"
            }));

            // =========================================
            // TRVALÝ ARCHÍV LIVE SIGNÁLOV
            // Rovnaké váhy a prahy ako v scanner.js.
            // =========================================

            const signalArchive = readJson(SIGNAL_ARCHIVE_PATH, {
              schema_version: 1,
              updated_at: null,
              signals: []
            });

            if (!Array.isArray(signalArchive.signals)) {
              throw new Error("Archív signálov nemá platné pole signals.");
            }

            function frontendMatchId(match) {
              return String(
                match?.tracker?.id ||
                match?.slug ||
                match?.url ||
                match?.id ||
                ""
              );
            }

            function frontendStatValue(stats, keyword) {
              const item = (stats || []).find(s =>
                String(s.label || "").toLowerCase().includes(keyword)
              );
              if (!item) return null;
              const home = Number(item.home);
              const away = Number(item.away);
              if (!Number.isFinite(home) || !Number.isFinite(away)) return null;
              return { home, away };
            }

            function frontendPressure(stats) {
              const measures = [
                { key: "possession", weight: 0.10 },
                { key: "shots on target", weight: 0.40 },
                { key: "dangerous attacks", weight: 0.50 }
              ];
              let home = 0;
              let away = 0;
              let totalWeight = 0;

              for (const measure of measures) {
                const value = frontendStatValue(stats, measure.key);
                if (!value) continue;
                const total = value.home + value.away;
                const ratio = total > 0 ? value.home / total : 0.5;
                home += ratio * measure.weight;
                away += (1 - ratio) * measure.weight;
                totalWeight += measure.weight;
              }

              if (!totalWeight) return null;
              return {
                home: Math.round(home / totalWeight * 100),
                away: Math.round(away / totalWeight * 100)
              };
            }

            function makeServerSnapshot(match, currentRecord) {
              const id = frontendMatchId(match);
              const currentTime = Date.parse(currentRecord.collected_at || "");
              const currentShots = frontendStatValue(match.stats || [], "shots on target");
              const currentAttacks = frontendStatValue(match.stats || [], "dangerous attacks");

              if (!id || !Number.isFinite(currentTime) || !currentShots || !currentAttacks) {
                return null;
              }

              const previous = [];
              for (const batch of history) {
                const validCollection =
                  batch.collection_complete === true ||
                  batch.data_status === "complete";
                if (!validCollection || !Array.isArray(batch.records)) continue;

                for (const record of batch.records) {
                  if (!record.match || frontendMatchId(record.match) !== id) continue;
                  if (!isLive(record.match)) continue;
                  const time = Date.parse(record.collected_at || batch.collected_at || "");
                  if (Number.isFinite(time) && time < currentTime - 1000) {
                    previous.push({ time, match: record.match });
                  }
                }
              }

              previous.sort((a, b) => a.time - b.time);
              if (!previous.length) return null;

              const old = previous[previous.length - 1];
              const minutes = (currentTime - old.time) / 60000;
              if (!Number.isFinite(minutes) || minutes < 3 || minutes > 15) return null;

              const oldShots = frontendStatValue(old.match.stats || [], "shots on target");
              const oldAttacks = frontendStatValue(old.match.stats || [], "dangerous attacks");
              if (!oldShots || !oldAttacks) return null;

              if (
                currentShots.home < oldShots.home ||
                currentShots.away < oldShots.away ||
                currentAttacks.home < oldAttacks.home ||
                currentAttacks.away < oldAttacks.away
              ) return null;

              const homeShots = currentShots.home - oldShots.home;
              const awayShots = currentShots.away - oldShots.away;
              const homeAttacks = currentAttacks.home - oldAttacks.home;
              const awayAttacks = currentAttacks.away - oldAttacks.away;
              const homeActivity = homeShots * 3 + homeAttacks;
              const awayActivity = awayShots * 3 + awayAttacks;

              return {
                homeActivityRate: homeActivity / minutes * 10,
                awayActivityRate: awayActivity / minutes * 10
              };
            }

            function createServerSignal(match, record) {
              const minute = Number(match.live_minute);
              if (!Number.isFinite(minute) || minute < 10 || minute > 90) return null;

              const collectedTime = Date.parse(record.collected_at || "");
              const age = Date.now() - collectedTime;
              if (!Number.isFinite(age) || age < 0 || age > 7 * 60 * 1000) return null;

              const pressure = frontendPressure(match.stats || []);
              const snapshot = makeServerSnapshot(match, record);
              if (!pressure || !snapshot) return null;

              const threat = {
                home: Math.min(100, Math.round(
                  pressure.home * 0.45 +
                  Math.min(snapshot.homeActivityRate * 3, 40) * 0.55
                )),
                away: Math.min(100, Math.round(
                  pressure.away * 0.45 +
                  Math.min(snapshot.awayActivityRate * 3, 40) * 0.55
                ))
              };

              const candidates = [
                {
                  side: "home",
                  team: match.home,
                  score: threat.home,
                  activity: snapshot.homeActivityRate,
                  difference: threat.home - threat.away
                },
                {
                  side: "away",
                  team: match.away,
                  score: threat.away,
                  activity: snapshot.awayActivityRate,
                  difference: threat.away - threat.home
                }
              ];

              const selected = candidates.find(item =>
                item.score >= 65 &&
                item.activity >= 4 &&
                item.difference >= 3
              );
              if (!selected) return null;

              // AI Quality Score sa počíta iba z meraní dostupných v okamihu vzniku.
              // Pri nedostatočnej vzorke zostáva null; staré signály sa nikdy nedopočítavajú.
              const qualityRecords = [];
              for (const batch of history) {
                const validCollection = batch.collection_complete === true || batch.data_status === "complete";
                if (!validCollection || !Array.isArray(batch.records)) continue;
                for (const historicalRecord of batch.records) {
                  if (!historicalRecord.match || frontendMatchId(historicalRecord.match) !== frontendMatchId(match)) continue;
                  if (!isLive(historicalRecord.match)) continue;
                  const time = Date.parse(historicalRecord.collected_at || batch.collected_at || "");
                  if (Number.isFinite(time)) qualityRecords.push({ time, match: historicalRecord.match });
                }
              }
              if (!qualityRecords.some(item => Math.abs(item.time - collectedTime) < 1000)) {
                qualityRecords.push({ time: collectedTime, match });
              }
              qualityRecords.sort((a, b) => a.time - b.time);
              const uniqueQualityRecords = qualityRecords.filter((item, index) =>
                index === 0 || item.time !== qualityRecords[index - 1].time
              );
              let qualityScore = null;
              let qualityScoreComponents = null;
              if (uniqueQualityRecords.length >= 3) {
                const momentumReadyCount = uniqueQualityRecords.filter(item =>
                  frontendStatValue(item.match.stats || [], "shots on target") &&
                  frontendStatValue(item.match.stats || [], "dangerous attacks")
                ).length;
                const momentumCoverage = Math.round(momentumReadyCount / uniqueQualityRecords.length * 100);
                const sampleDepth = Math.min(100, uniqueQualityRecords.length / 5 * 100);
                const dataQuality = Math.round(momentumCoverage * 0.7 + sampleDepth * 0.3);
                const freshness = age <= 2 * 60000 ? 100 : age <= 4 * 60000 ? 80 : 50;
                const intervals = [];
                for (let i = 1; i < uniqueQualityRecords.length; i++) {
                  const previous = uniqueQualityRecords[i - 1];
                  const current = uniqueQualityRecords[i];
                  const minutes = (current.time - previous.time) / 60000;
                  if (!Number.isFinite(minutes) || minutes < 3 || minutes > 15) continue;
                  const oldShots = frontendStatValue(previous.match.stats || [], "shots on target");
                  const shots = frontendStatValue(current.match.stats || [], "shots on target");
                  const oldAttacks = frontendStatValue(previous.match.stats || [], "dangerous attacks");
                  const attacks = frontendStatValue(current.match.stats || [], "dangerous attacks");
                  if (!oldShots || !shots || !oldAttacks || !attacks) continue;
                  if (shots.home < oldShots.home || shots.away < oldShots.away ||
                      attacks.home < oldAttacks.home || attacks.away < oldAttacks.away) continue;
                  intervals.push({
                    homeRate: ((shots.home - oldShots.home) * 3 + attacks.home - oldAttacks.home) / minutes * 10,
                    awayRate: ((shots.away - oldShots.away) * 3 + attacks.away - oldAttacks.away) / minutes * 10
                  });
                }
                const accelerationReady = intervals.length >= 2;
                const side = selected.side;
                const activityScore = Math.max(0, Math.min(100, selected.activity * 10));
                const components = [
                  { value: dataQuality, weight: 25 },
                  { value: freshness, weight: 20 },
                  { value: threat[side], weight: 20 },
                  { value: activityScore, weight: 20 }
                ];
                if (accelerationReady) {
                  const delta = Number((
                    intervals[intervals.length - 1][side + "Rate"] -
                    intervals[intervals.length - 2][side + "Rate"]
                  ).toFixed(1));
                  components.push({
                    value: Math.max(0, Math.min(100, 50 + delta * 5)),
                    weight: 15
                  });
                }
                const totalWeight = components.reduce((sum, item) => sum + item.weight, 0);
                qualityScore = Math.round(components.reduce((sum, item) => sum + item.value * item.weight, 0) / totalWeight);
                qualityScoreComponents = {
                  dataQuality,
                  freshness,
                  goalThreat: threat[side],
                  activityScore,
                  accelerationIncluded: accelerationReady,
                  sampleCount: uniqueQualityRecords.length
                };
              }

              // Uložený analytický snapshot momenta v okamihu vzniku signálu.
              // Všetky metriky vychádzajú iba z dostupnej histórie do collectedTime; bez spätného dopĺňania.
              const pressureHistory = uniqueQualityRecords.map(item => ({
                time: item.time,
                pressure: frontendPressure(item.match.stats || [])
              })).filter(item => item.pressure &&
                Number.isFinite(item.pressure.home) && Number.isFinite(item.pressure.away));
              const consistencyRows = pressureHistory.slice(-8);
              let consistencyData = null;
              if (consistencyRows.length >= 4) {
                const states = consistencyRows.map(item => {
                  const diff = item.pressure.home - item.pressure.away;
                  return diff >= 10 ? "home" : diff <= -10 ? "away" : "balanced";
                });
                const balanced = states.filter(x => x === "balanced").length;
                const homeLeads = states.filter(x => x === "home").length;
                const awayLeads = states.filter(x => x === "away").length;
                const score = side => Math.round((states.filter(x => x === side).length + balanced * 0.5) / states.length * 100);
                let streak = 0;
                for (let i = states.length - 1; i >= 0 && states[i] === states[states.length - 1]; i--) streak++;
                consistencyData = {
                  count: states.length, balancedSamples: balanced,
                  home: { score: score("home"), leadSamples: homeLeads },
                  away: { score: score("away"), leadSamples: awayLeads },
                  latestState: states[states.length - 1], latestStreak: streak,
                  spanMinutes: Number(((consistencyRows[consistencyRows.length - 1].time - consistencyRows[0].time) / 60000).toFixed(1))
                };
              }

              const weaknessRows = pressureHistory.slice(-5);
              let weaknessData = null;
              if (weaknessRows.length >= 4) {
                const sides = {};
                ["home", "away"].forEach(side => {
                  const opponent = side === "home" ? "away" : "home";
                  const diffs = weaknessRows.map(item => item.pressure[side] - item.pressure[opponent]);
                  const improvement = diffs[diffs.length - 1] - diffs[0];
                  const positiveSteps = diffs.slice(1).filter((value, index) => value - diffs[index] >= 2).length;
                  const leadSamples = diffs.filter(value => value >= 10).length;
                  const score = Math.round(
                    Math.max(0, Math.min(100, 50 + improvement * 2)) * 0.5 +
                    (leadSamples / diffs.length * 100) * 0.3 +
                    (positiveSteps / (diffs.length - 1) * 100) * 0.2
                  );
                  sides[side] = { score, improvement: Math.round(improvement), leadSamples, positiveSteps };
                });
                weaknessData = { count: weaknessRows.length, sides,
                  spanMinutes: Number(((weaknessRows[weaknessRows.length - 1].time - weaknessRows[0].time) / 60000).toFixed(1)) };
              }

              const accelerationIntervals = [];
              for (let i = 1; i < uniqueQualityRecords.length; i++) {
                const previous = uniqueQualityRecords[i - 1], current = uniqueQualityRecords[i];
                const minutes = (current.time - previous.time) / 60000;
                if (!Number.isFinite(minutes) || minutes < 3 || minutes > 15) continue;
                const oldShots = frontendStatValue(previous.match.stats || [], "shots on target");
                const shots = frontendStatValue(current.match.stats || [], "shots on target");
                const oldAttacks = frontendStatValue(previous.match.stats || [], "dangerous attacks");
                const attacks = frontendStatValue(current.match.stats || [], "dangerous attacks");
                if (!oldShots || !shots || !oldAttacks || !attacks ||
                    shots.home < oldShots.home || shots.away < oldShots.away ||
                    attacks.home < oldAttacks.home || attacks.away < oldAttacks.away) continue;
                accelerationIntervals.push({
                  homeRate: ((shots.home - oldShots.home) * 3 + attacks.home - oldAttacks.home) / minutes * 10,
                  awayRate: ((shots.away - oldShots.away) * 3 + attacks.away - oldAttacks.away) / minutes * 10
                });
              }
              let accelerationData = null;
              if (accelerationIntervals.length >= 2) {
                const previous = accelerationIntervals[accelerationIntervals.length - 2];
                const latest = accelerationIntervals[accelerationIntervals.length - 1];
                accelerationData = {
                  homeDelta: Number((latest.homeRate - previous.homeRate).toFixed(1)),
                  awayDelta: Number((latest.awayRate - previous.awayRate).toFixed(1)),
                  homePreviousRate: Number(previous.homeRate.toFixed(1)),
                  homeLatestRate: Number(latest.homeRate.toFixed(1)),
                  awayPreviousRate: Number(previous.awayRate.toFixed(1)),
                  awayLatestRate: Number(latest.awayRate.toFixed(1))
                };
              }

              const powerScore = side => {
                const parts = [{ value: pressure[side], weight: 50 }];
                if (Number.isFinite(snapshot[side + "ActivityRate"])) {
                  parts.push({ value: Math.max(0, Math.min(100, snapshot[side + "ActivityRate"] * 10)), weight: 35 });
                }
                if (accelerationData && Number.isFinite(accelerationData[side + "Delta"])) {
                  parts.push({ value: Math.max(0, Math.min(100, 50 + accelerationData[side + "Delta"] * 5)), weight: 15 });
                }
                const weight = parts.reduce((sum, part) => sum + part.weight, 0);
                return Math.round(parts.reduce((sum, part) => sum + part.value * part.weight, 0) / weight);
              };
              const teamPowerData = { home: powerScore("home"), away: powerScore("away") };
              let dominanceData = null;
              if (consistencyData && weaknessData) {
                const combine = side => Math.round(
                  pressure[side] * 0.4 +
                  consistencyData[side].score * 0.35 +
                  weaknessData.sides[side].score * 0.25
                );
                dominanceData = { home: combine("home"), away: combine("away") };
              }
              const momentumAnalysis = {
                version: "momentum-archive-v1",
                capturedAt: record.collected_at || signalNow,
                pressure: { home: pressure.home, away: pressure.away },
                activityRate: {
                  home: Number(snapshot.homeActivityRate.toFixed(1)),
                  away: Number(snapshot.awayActivityRate.toFixed(1))
                },
                goalThreat: { home: threat.home, away: threat.away },
                qualityScore: Number.isFinite(qualityScore) ? qualityScore : null,
                teamPower: teamPowerData,
                acceleration: accelerationData,
                consistency: consistencyData,
                opponentWeakness: weaknessData,
                matchDominance: dominanceData
              };

              const momentumDiff = Math.abs(threat.home - threat.away);
              return {
                ...selected,
                qualityScore,
                qualityScoreComponents,
                pressureHome: pressure.home,
                pressureAway: pressure.away,
                activityHome: Number(snapshot.homeActivityRate.toFixed(1)),
                activityAway: Number(snapshot.awayActivityRate.toFixed(1)),
                threatHome: threat.home,
                threatAway: threat.away,
                momentumSide: threat.home >= threat.away ? "home" : "away",
                momentumDiff,
                momentumStrength: momentumDiff >= 20 ? "strong" : momentumDiff >= 10 ? "medium" : "slight",
                momentumAnalysis
              };
            }

            const signalNow = new Date().toISOString();
            const liveById = new Map();

            if (archiveSafe) {
              for (const record of records) {
                if (record?.match) {
                  const id = frontendMatchId(record.match);
                  if (id) liveById.set(id, record);
                }
              }

              // Vyhodnotenie otvorených signálov s prísnym 15-minútovým limitom.
              // Ak sa gól prvýkrát objaví až po limite, čas gólu nepoznáme:
              // výsledok preto zostane UNRESOLVED, nie falošná WIN.
              for (const signal of signalArchive.signals) {
                if (signal.status !== "OPEN") continue;
                const record = liveById.get(String(signal.matchId));
                if (!record) continue;

                const match = record.match;
                const rawGoals = signal.side === "home"
                  ? match.home_score
                  : match.away_score;
                const goals = Number(rawGoals);
                const startGoals = Number(signal.startGoals);
                const minute = Number(match.live_minute);
                const homeScore = Number(match.home_score);
                const awayScore = Number(match.away_score);

                if (
                  rawGoals === null ||
                  rawGoals === undefined ||
                  !Number.isFinite(goals) ||
                  !Number.isFinite(startGoals) ||
                  !Number.isFinite(minute) ||
                  !Number.isFinite(homeScore) ||
                  !Number.isFinite(awayScore)
                ) {
                  continue;
                }

                if (goals > startGoals) {
                  signal.status = minute <= Number(signal.deadlineMinute)
                    ? "WIN"
                    : "UNRESOLVED";
                  signal.settledAt = signalNow;
                  signal.settledMinute = minute;
                  signal.settledScore = `${homeScore}:${awayScore}`;
                  if (signal.status === "UNRESOLVED") {
                    signal.settlementNote = "Gól bol prvýkrát zaznamenaný po limite; presný čas gólu nie je potvrdený.";
                  }
                } else if (minute >= Number(signal.deadlineMinute)) {
                  signal.status = "LOSS";
                  signal.settledAt = signalNow;
                  signal.settledMinute = minute;
                  signal.settledScore = `${homeScore}:${awayScore}`;
                }
              }

              // Potom vytvor nové signály podľa rovnakých prahov ako scanner.js.
              for (const record of records) {
                const match = record?.match;
                if (!match || !isLive(match)) continue;

                const candidate = createServerSignal(match, record);
                if (!candidate) continue;

                const id = frontendMatchId(match);
                const alreadyOpen = signalArchive.signals.some(item =>
                  String(item.matchId) === id &&
                  item.side === candidate.side &&
                  item.status === "OPEN"
                );
                if (alreadyOpen) continue;

                const minute = Number(match.live_minute);
                signalArchive.signals.push({
                  signalId: `${id}_${candidate.side}_${record.collected_at}`,
                  matchId: id,
                  home: match.home,
                  away: match.away,
                  side: candidate.side,
                  team: candidate.team,
                  startGoals: candidate.side === "home"
                    ? Number(match.home_score || 0)
                    : Number(match.away_score || 0),
                  startMinute: minute,
                  deadlineMinute: Math.min(90, minute + 15),
                  goalThreat: candidate.score,
                  activityRate: Number(candidate.activity.toFixed(1)),
                  ...(Number.isFinite(candidate.qualityScore) ? {
                    qualityScore: candidate.qualityScore,
                    qualityScoreVersion: "ai-quality-v1",
                    qualityScoreComponents: candidate.qualityScoreComponents
                  } : {}),
                  // Momentum snapshots are stored for later statistical analysis only;
                  // they do not change the green signal trigger conditions.
                  pressureHome: candidate.pressureHome,
                  pressureAway: candidate.pressureAway,
                  competition: match.competition || match.league || null,
                  combinedSot: (() => { const v = frontendStatValue(match.stats || [], "shots on target"); return v ? v.home + v.away : null; })(),
                  combinedShots: (() => { const a = frontendStatValue(match.stats || [], "shots on target"); const b = frontendStatValue(match.stats || [], "shots off target"); return a && b ? a.home + a.away + b.home + b.away : null; })(),
                  activityHome: candidate.activityHome,
                  activityAway: candidate.activityAway,
                  threatHome: candidate.threatHome,
                  threatAway: candidate.threatAway,
                  momentumSide: candidate.momentumSide,
                  momentumDiff: candidate.momentumDiff,
                  momentumStrength: candidate.momentumStrength,
                  momentumAnalysis: candidate.momentumAnalysis,
                  createdAt: record.collected_at || signalNow,
                  status: "OPEN",
                  startScore: `${Number(match.home_score || 0)}:${Number(match.away_score || 0)}`,
                  // Presný stav zápasu a všetky API štatistiky v okamihu signálu.
                  sourceSnapshot: {
                    collected_at: record.collected_at || signalNow,
                    minute: Number.isFinite(minute) ? minute : null,
                    home_score: match.home_score ?? null,
                    away_score: match.away_score ?? null,
                    raw_stats: Array.isArray(match.stats) ? match.stats : [],
                    raw_match: match
                  }
                });
              }
            }

            // Otvorené signály vyhodnoť až po potvrdenom konečnom detaile zápasu.
            // Ak tím do konca nestrelil ďalší gól, je to LOSS.
            // Ak skóroval, ale nemáme potvrdený čas gólu voči 15-minútovému limitu,
            // výsledok zostáva UNRESOLVED – nikdy nehádame čas gólu.
            const confirmedFinals = new Map(
              (archive.archived_matches || [])
                .filter(item => item?.status_confirmation === "confirmed_finished" && item.final_match)
                .map(item => [
                  frontendMatchId(item.final_match) || String(item.id || ""),
                  item
                ])
            );

            for (const signal of signalArchive.signals) {
              if (signal.status !== "OPEN") continue;

              const archivedItem = confirmedFinals.get(String(signal.matchId));
              if (!archivedItem) continue;

              const finalMatch = archivedItem.final_match;
              const rawGoals = signal.side === "home"
                ? finalMatch.home_score
                : finalMatch.away_score;
              const goals = Number(rawGoals);
              const startGoals = Number(signal.startGoals);
              const homeScore = Number(finalMatch.home_score);
              const awayScore = Number(finalMatch.away_score);

              if (
                rawGoals === null ||
                rawGoals === undefined ||
                !Number.isFinite(goals) ||
                !Number.isFinite(startGoals) ||
                !Number.isFinite(homeScore) ||
                !Number.isFinite(awayScore)
              ) continue;

              signal.status = goals > startGoals ? "UNRESOLVED" : "LOSS";
              signal.settledAt = signalNow;
              signal.settledMinute = Number.isFinite(Number(finalMatch.live_minute))
                ? Number(finalMatch.live_minute)
                : null;
              signal.settledScore = `${homeScore}:${awayScore}`;

              if (signal.status === "UNRESOLVED") {
                signal.settlementNote =
                  "Konečné skóre potvrdilo gól tímu, ale presný čas gólu voči 15-minútovému limitu nie je z konečného detailu overiteľný.";
              } else {
                signal.settlementNote =
                  "Konečný výsledok potvrdený; tím do konca zápasu nepridal gól.";
              }
            }

            signalArchive.updated_at = signalNow;
            fs.writeFileSync(
              SIGNAL_ARCHIVE_PATH,
              JSON.stringify(signalArchive, null, 2)
            );

            // =========================================
            // SAMOSTATNÝ BTTS MODEL – 46. až 50. minúta
            // Strely celkom = SOT + strely mimo brány.
            // =========================================
            const bttsArchive = readJson(BTTS_ARCHIVE_PATH, {
              schema_version: 1,
              updated_at: null,
              signals: []
            });
            if (!Array.isArray(bttsArchive.signals)) {
              throw new Error("BTTS archív nemá platné pole signals.");
            }

            function bttsStat(stats, label) {
              const item = (stats || []).find(s =>
                String(s.label || "").toLowerCase() === label
              );
              if (!item) return null;
              const home = Number(item.home);
              const away = Number(item.away);
              if (!Number.isFinite(home) || !Number.isFinite(away) || home < 0 || away < 0) return null;
              return { home, away };
            }

            if (archiveSafe) {
              // Každý prah 1:0 je samostatný testovací variant.
              // Jeden zápas môže patriť do viacerých tierov, ale každý tier
              // sa uloží iba raz. Tak vieme porovnať 8 / 10 / 12 striel.
              for (const record of records) {
                const match = record?.match;
                if (!match || !isLive(match)) continue;
                const id = frontendMatchId(match);
                if (!id) continue;

                const minute = Number(match.live_minute);
                const homeScore = Number(match.home_score);
                const awayScore = Number(match.away_score);
                const age = Date.now() - Date.parse(record.collected_at || "");
                if (!Number.isFinite(minute) || minute < 46 || minute > 50 ||
                    !Number.isFinite(homeScore) || !Number.isFinite(awayScore) ||
                    !Number.isFinite(age) || age < 0 || age > 7 * 60 * 1000) continue;

                const sot = bttsStat(match.stats, "shots on target");
                const off = bttsStat(match.stats, "shots off target");
                if (!sot || !off) continue;
                const combinedSot = sot.home + sot.away;
                const combinedShots = combinedSot + off.home + off.away;

                const candidates = [];
                if (homeScore === 1 && awayScore === 0 && combinedSot >= 5) {
                  if (combinedShots >= 8) candidates.push({
                    tier: "1:0 · SOT ≥5 · strely ≥8",
                    tierKey: "10_sot5_shots8",
                    predictedSide: "away"
                  });
                  if (combinedShots >= 10) candidates.push({
                    tier: "1:0 · SOT ≥5 · strely ≥10",
                    tierKey: "10_sot5_shots10",
                    predictedSide: "away"
                  });
                  if (combinedShots >= 12) candidates.push({
                    tier: "1:0 · SOT ≥5 · strely ≥12",
                    tierKey: "10_sot5_shots12",
                    predictedSide: "away"
                  });
                } else if (homeScore === 0 && awayScore === 1 &&
                           combinedSot >= 6 && combinedShots >= 8) {
                  candidates.push({
                    tier: "0:1 · SOT ≥6 · strely ≥8",
                    tierKey: "01_sot6_shots8",
                    predictedSide: "home"
                  });
                }

                for (const candidate of candidates) {
                  const exists = bttsArchive.signals.some(x =>
                    String(x.matchId) === id && x.tierKey === candidate.tierKey
                  );
                  if (exists) continue;
                  bttsArchive.signals.push({
                    signalId: "btts_" + id + "_" + candidate.tierKey,
                    model: "BTTS",
                    matchId: id,
                    home: match.home,
                    away: match.away,
                    predictedSide: candidate.predictedSide,
                    predictedTeam: candidate.predictedSide === "home" ? match.home : match.away,
                    startMinute: minute,
                    startScore: homeScore + ":" + awayScore,
                    combinedSot,
                    combinedShots,
                    competition: match.competition || match.league || null,
                    tier: candidate.tier,
                    tierKey: candidate.tierKey,
                    createdAt: record.collected_at,
                    status: "OPEN",
                    // Presný stav zápasu a všetky API štatistiky v okamihu signálu.
                    sourceSnapshot: {
                      collected_at: record.collected_at || signalNow,
                      minute,
                      home_score: match.home_score ?? null,
                      away_score: match.away_score ?? null,
                      raw_stats: Array.isArray(match.stats) ? match.stats : [],
                      raw_match: match
                    }
                  });
                }
              }
            }

            // Vyhodnocuj výhradne z potvrdeného konečného výsledku.
            const bttsFinals = new Map(
              (archive.archived_matches || [])
                .filter(item => item?.status_confirmation === "confirmed_finished" && item.final_match)
                .map(item => [frontendMatchId(item.final_match) || String(item.id || ""), item.final_match])
            );
            for (const signal of bttsArchive.signals) {
              if (signal.status !== "OPEN") continue;
              const finalMatch = bttsFinals.get(String(signal.matchId));
              if (!finalMatch) continue;
              const rawScoringSide = signal.predictedSide === "home"
                ? finalMatch.home_score : finalMatch.away_score;
              const rawOtherSide = signal.predictedSide === "home"
                ? finalMatch.away_score : finalMatch.home_score;
              const scoring = Number(rawScoringSide);
              const other = Number(rawOtherSide);
              if (rawScoringSide == null || rawOtherSide == null ||
                  !Number.isFinite(scoring) || !Number.isFinite(other)) continue;
              signal.status = scoring > 0 ? "WIN" : "LOSS";
              signal.settledAt = signalNow;
              signal.settledScore = Number(finalMatch.home_score) + ":" + Number(finalMatch.away_score);

              // Ulož presnú časovú os gólov z potvrdeného finálneho detailu.
              // Čas gólu nikdy neodvodzuj z konečného skóre ani z času archivácie.
              const finalIncidents = Array.isArray(finalMatch.incidents)
                ? finalMatch.incidents
                : null;
              signal.goalEvents = finalIncidents
                ? finalIncidents
                    .filter(event => event && (
                      event.is_goal === true ||
                      String(event.type || "").toLowerCase() === "goal" ||
                      Number(event.type_id) === 1
                    ))
                    .map(event => {
                      const rawMinute = event.time ?? event.minute ?? null;
                      const minuteText = String(rawMinute ?? "");
                      const minuteNumber = /^\\d+(?:\\+\\d+)?$/.test(minuteText)
                        ? Number(minuteText.split("+")[0])
                        : null;
                      return {
                        minute: rawMinute,
                        minuteNumber,
                        side: event.side || null,
                        player: event.player || null,
                        homeScore: event.home_score ?? null,
                        awayScore: event.away_score ?? null
                      };
                    })
                : null;
              signal.goalTimingAvailable = finalIncidents !== null;
              const predictedSideGoals = Array.isArray(signal.goalEvents)
                ? signal.goalEvents.filter(event => event.side === signal.predictedSide)
                : [];
              signal.firstPredictedGoalMinute = predictedSideGoals.length
                ? predictedSideGoals
                    .map(event => event.minuteNumber)
                    .filter(Number.isFinite)
                    .sort((a, b) => a - b)[0] ?? null
                : null;
              signal.predictedSideScoredAt75Plus = finalIncidents === null
                ? null
                : predictedSideGoals.some(event =>
                    Number.isFinite(event.minuteNumber) && event.minuteNumber >= 75
                  );
              signal.settlementNote = scoring > 0
                ? "Predikovaný tím skóroval do potvrdeného konca zápasu."
                : "Predikovaný tím do potvrdeného konca zápasu neskóroval.";
            }
            bttsArchive.updated_at = signalNow;
            fs.writeFileSync(BTTS_ARCHIVE_PATH, JSON.stringify(bttsArchive, null, 2));
            console.log("BTTS ARCHIVE:", JSON.stringify({
              total: bttsArchive.signals.length,
              open: bttsArchive.signals.filter(x => x.status === "OPEN").length,
              wins: bttsArchive.signals.filter(x => x.status === "WIN").length,
              losses: bttsArchive.signals.filter(x => x.status === "LOSS").length
            }));

            console.log("SIGNAL ARCHIVE:", JSON.stringify({
              total: signalArchive.signals.length,
              open: signalArchive.signals.filter(item => item.status === "OPEN").length,
              wins: signalArchive.signals.filter(item => item.status === "WIN").length,
              losses: signalArchive.signals.filter(item => item.status === "LOSS").length,
              updated: complete
            }));

            console.log("================================");
            console.log("COLLECTION RESULT");
            console.log(JSON.stringify({
              data_status: output.data_status,
              collection_complete: complete,
              archive_safe: archiveSafe,
              fixture_count: output.fixture_count,
              verified_live: output.live_count,
              saved_count: output.saved_count,
              errors: errors.length,
              current_updated: feedDataSafe,
              detail_coverage: detailCoverage,
              feed_data_safe: feedDataSafe,
              history_updated: true,
              archive_updated: true,
              latest_updated: archiveSafe,
              collected_at: output.collected_at
            }, null, 2));
            console.log("================================");

            if (!complete || !archiveSafe) {
              console.log(
                "UPOZORNENIE: Zber nie je bezpečný na aktualizáciu dôveryhodného snapshotu a počítanie neprítomnosti."
              );
            }
          }

          main().catch(error => {
            console.error("COLLECTOR FAILED:", error);
            process.exit(1);
          });
          NODE

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/live-current.json data/live-latest.json data/live-history.json data/live-history.jsonl.gz data/live-match-timeline.json.gz data/live-match-history.jsonl.gz data/live-archive.json data/signal-archive.json data/btts-signal-archive.json data/football-collector-metrics.jsonl
          git add -A -- data/

          if git diff --cached --quiet; then
            echo "Žiadne nové zmeny na uloženie."
          else
            git commit -m "Update LIVE football data"
            # The basketball collector may push to main at the same time.
            # Retry fetch/rebase/push so fresh football data is not lost on a ref race.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push conflict, retry ${attempt}/5"
              sleep $((attempt * 2))
            done
            echo "Unable to push football data after five retries."
            exit 1
          fi
