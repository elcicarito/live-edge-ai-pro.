
name: LIVE EDGE AUTO COLLECTOR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect live football data
        run: |
          mkdir -p data

          node <<'NODE'
          const fs = require("fs");
          const BASE = "https://sportscore.com/api/widget";

          async function getJSON(url) {
            const response = await fetch(url, {
              headers: {
                "User-Agent": "LIVE-EDGE-AI-PRO/1.0"
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${url}`);
            }

            return response.json();
          }

          async function main() {
            const list = await getJSON(
              `${BASE}/matches/?sport=football&limit=50`
            );

            const matches = (list.matches || []).filter(
              match => match.status === "live"
            );

            console.log("MATCH DATA SAMPLE:");
            console.log(JSON.stringify(matches[0] || null, null, 2));

            const records = [];
            const errors = [];

            for (const item of matches) {
              try {
              const rawUrl = item.url || "";
              const pathParts = rawUrl
              .split("?")[0]
              .split("/")
             .filter(Boolean);

             const slug = pathParts[pathParts.length - 2];

                if (!slug) {
                  errors.push("Missing URL: " + item.home);
                  continue;
                }

                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  errors.push("Missing match detail: " + slug);
                  continue;
                }

                records.push({
                  collected_at: new Date().toISOString(),
                  match: detail.match
                });

              } catch (error) {
                errors.push(
                  `${item.home || "?"} - ${item.away || "?"}: ${error.message}`
                );
              }
            }

            const output = {
              collected_at: new Date().toISOString(),
              live_count: matches.length,
              saved_count: records.length,
              errors,
              records
            };

            fs.appendFileSync(
              "data/live-history.jsonl",
              JSON.stringify(output) + "\n"
            );

            console.log("COLLECTION RESULT:");
            console.log(JSON.stringify({
              live_count: matches.length,
              saved_count: records.length,
              errors
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save collected history
        run: |
          git config user.name "LIVE EDGE AUTO COLLECTOR"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-history.jsonl
          git diff --cached --quiet || (
            git commit -m "Automatic LIVE football data collection"
            git push
          )
          
