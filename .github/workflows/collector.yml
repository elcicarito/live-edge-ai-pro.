
name: LIVE EDGE AUTO COLLECTOR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect live football data
        run: |
          mkdir -p data

          node <<'NODE'
          const fs = require("fs");
          const BASE = "https://sportscore.com/api/widget";

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          async function getJSON(url, attempts = 3) {
            let lastError;

            for (let i = 1; i <= attempts; i++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    "User-Agent": "LIVE-EDGE-AI-PRO/2.0"
                  },
                  signal: AbortSignal.timeout(12000)
                });

                if (!response.ok) {
                  throw new Error(`HTTP ${response.status}: ${url}`);
                }

                return await response.json();

              } catch (error) {
                lastError = error;
                console.log(`Pokus ${i}/${attempts}: ${error.message}`);

                if (i < attempts) {
                  await sleep(i * 1500);
                }
              }
            }

            throw lastError;
          }

          async function main() {
            const list = await getJSON(
              `${BASE}/matches/?sport=football&limit=50`
            );

            const matches = (list.matches || []).filter(
              match =>
                String(match.status).toLowerCase() === "live"
            );

            const records = [];
            const errors = [];

            async function collectMatch(item) {
              try {
                let slug = item.tracker?.id;

                if (!slug) {
                  const parts = (item.url || "")
                    .split("?")[0]
                    .split("/")
                    .filter(Boolean);

                  slug = parts[parts.length - 2];
                }

                if (!slug) {
                  throw new Error("Missing match ID");
                }

                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  throw new Error("Missing match detail");
                }

                return {
                  collected_at: new Date().toISOString(),
                  match: detail.match
                };

              } catch (error) {
                errors.push(
                  `${item.home || "?"} - ${item.away || "?"}: ${error.message}`
                );

                return null;
              }
            }

            // Najviac 10 súčasných požiadaviek
            for (let i = 0; i < matches.length; i += 10) {
              const batch = matches.slice(i, i + 10);
              const results = await Promise.all(
                batch.map(collectMatch)
              );

              records.push(...results.filter(Boolean));
            }

            const output = {
              collected_at: new Date().toISOString(),
              live_count: matches.length,
              saved_count: records.length,
              errors,
              records
            };

            const jsonlPath = "data/live-history.jsonl";

            fs.appendFileSync(
              jsonlPath,
              JSON.stringify(output) + "\n"
            );

            // Posledné LIVE dáta zachováme,
            // ak všetky detail požiadavky zlyhali.
            if (records.length > 0 || matches.length === 0) {
              fs.writeFileSync(
                "data/live-latest.json",
                JSON.stringify(output, null, 2)
              );
            } else {
              console.log(
                "Všetky detaily zlyhali. Posledné úspešné LIVE dáta zostávajú zachované."
              );
            }

            const history = fs.readFileSync(jsonlPath, "utf8")
              .split("\n")
              .filter(Boolean)
              .slice(-288)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(Boolean);

            fs.writeFileSync(
              "data/live-history.json",
              JSON.stringify(history)
            );

            console.log("COLLECTION RESULT:");
            console.log(JSON.stringify({
              live_count: matches.length,
              saved_count: records.length,
              errors,
              history_snapshots: history.length
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save collected history
        run: |
          git config user.name "LIVE EDGE AUTO COLLECTOR"
          git config user.email "actions@users.noreply.github.com"

          git add data/live-history.jsonl data/live-latest.json data/live-history.json

          git diff --cached --quiet || (
            git commit -m "Update automatic LIVE football data"
            git push
          )
          
