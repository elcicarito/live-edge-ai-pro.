
name: LIVE EDGE AUTO COLLECTOR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect live football data
        run: |
          mkdir -p data

          node <<'NODE'
          const fs = require("fs");
          const BASE = "https://sportscore.com/api/widget";

          async function getJSON(url) {
            const response = await fetch(url, {
              headers: {
                "User-Agent": "LIVE-EDGE-AI-PRO/1.0"
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${url}`);
            }

            return response.json();
          }

          async function main() {
            const list = await getJSON(
              `${BASE}/matches/?sport=football&limit=50`
            );

            const matches = (list.matches || []).filter(
              match => String(match.status).toLowerCase() === "live"
            );

            const records = [];
            const errors = [];

            for (const item of matches) {
              try {
                const parts = (item.url || "")
                  .split("?")[0]
                  .split("/")
                  .filter(Boolean);

                const slug = parts[parts.length - 2];

                if (!slug) {
                  errors.push("Missing URL: " + item.home);
                  continue;
                }

                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  errors.push("Missing detail: " + slug);
                  continue;
                }

                records.push({
                  collected_at: new Date().toISOString(),
                  match: detail.match
                });

              } catch (error) {
                errors.push(
                  `${item.home || "?"} - ${item.away || "?"}: ${error.message}`
                );
              }
            }

            const output = {
              collected_at: new Date().toISOString(),
              live_count: matches.length,
              saved_count: records.length,
              errors,
              records
            };

            const jsonlPath = "data/live-history.jsonl";

            fs.appendFileSync(
              jsonlPath,
              JSON.stringify(output) + "\n"
            );

            // Súbor s aktuálnymi LIVE zápasmi
            fs.writeFileSync(
              "data/live-latest.json",
              JSON.stringify(output, null, 2)
            );

            // Posledných 288 zberov = približne 24 hodín
            const history = fs.readFileSync(jsonlPath, "utf8")
              .split("\n")
              .filter(Boolean)
              .slice(-288)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(Boolean);

            fs.writeFileSync(
              "data/live-history.json",
              JSON.stringify(history)
            );

            console.log("COLLECTION RESULT:");
            console.log(JSON.stringify({
              live_count: matches.length,
              saved_count: records.length,
              errors,
              history_snapshots: history.length
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save collected history
        run: |
          git config user.name "LIVE EDGE AUTO COLLECTOR"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-history.jsonl data/live-latest.json data/live-history.json
          git diff --cached --quiet || (
            git commit -m "Update automatic LIVE football data"
            git push
          )
          
