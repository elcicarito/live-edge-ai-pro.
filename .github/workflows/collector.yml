
name: LIVE EDGE AUTO COLLECTOR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect fresh LIVE football data
        run: |
          mkdir -p data

          node <<'NODE'
          const fs = require("fs");

          const BASE = "https://sportscore.com/api/v1";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          const ARCHIVE_PATH = "data/live-archive.json";
          const CURRENT_PATH = "data/live-current.json";
          const LATEST_PATH = "data/live-latest.json";
          const HISTORY_PATH = "data/live-history.jsonl";
          const HISTORY_JSON_PATH = "data/live-history.json";
          const SIGNAL_ARCHIVE_PATH = "data/signal-archive.json";

          const REQUIRED_MISSES = 3;
          const DROP_RATIO = 0.5;
          const MIN_BASELINE = 6;

          async function getJSON(url, attempts = 3) {
            let lastError;

            for (let i = 1; i <= attempts; i++) {
              try {
                const separator = url.includes("?") ? "&" : "?";
                const freshUrl = `${url}${separator}_cache=${Date.now()}_${i}`;

                const response = await fetch(freshUrl, {
                  headers: {
                    "User-Agent": "LIVE-EDGE-AI-PRO/8.4",
                    "Accept": "application/json",
                    "Cache-Control": "no-cache, no-store, max-age=0",
                    "Pragma": "no-cache"
                  },
                  signal: AbortSignal.timeout(20000),
                  cache: "no-store"
                });

                if (!response.ok) {
                  throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (!data || typeof data !== "object") {
                  throw new Error("Neplatná JSON odpoveď");
                }

                return data;

              } catch (error) {
                lastError = error;
                console.log(`Pokus ${i}/${attempts}: ${error.message}`);

                if (i < attempts) {
                  await sleep(i * 2000);
                }
              }
            }

            throw lastError;
          }

          function readJson(path, fallback) {
            if (!fs.existsSync(path)) return fallback;
            return JSON.parse(fs.readFileSync(path, "utf8"));
          }

          function getStatus(match) {
            const value = match?.status;

            if (typeof value === "string") {
              return value.toLowerCase().trim();
            }

            if (value && typeof value === "object") {
              return String(
                value.type ||
                value.name ||
                value.short ||
                ""
              ).toLowerCase().trim();
            }

            return "";
          }

          function isLive(match) {
            return [
              "live",
              "inplay",
              "in_play"
            ].includes(getStatus(match));
          }

          function getSlug(item) {
            if (item.slug) return item.slug;
            if (!item.url) return null;

            const parts = new URL(
              item.url,
              "https://sportscore.com"
            ).pathname.split("/").filter(Boolean);

            const matchIndex = parts.indexOf("match");

            if (matchIndex >= 0 && parts[matchIndex + 1]) {
              return parts[matchIndex + 1];
            }

            return null;
          }

          function getMatchId(record) {
            const match = record?.match;

            if (match?.tracker?.id) {
              return String(match.tracker.id);
            }

            if (match?.url) {
              const parts = new URL(
                match.url,
                "https://sportscore.com"
              ).pathname.split("/").filter(Boolean);

              return parts[parts.length - 1] || null;
            }

            return null;
          }

          function makeArchiveSnapshot(record, id) {
            return {
              id,
              collected_at: record.collected_at || null,
              match: record.match
            };
          }

          function normalizeArchive(data) {
            if (!data || typeof data !== "object") {
              throw new Error("Neplatný archív");
            }

            if (!Array.isArray(data.archived_matches)) {
              throw new Error("Archív nemá archived_matches");
            }

            if (!Array.isArray(data.pending_matches)) {
              throw new Error("Archív nemá pending_matches");
            }

            return data;
          }

          function readHistoryCounts() {
            if (!fs.existsSync(HISTORY_PATH)) return [];

            return fs.readFileSync(HISTORY_PATH, "utf8")
              .split("\n")
              .filter(Boolean)
              .slice(-30)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(item =>
                item &&
                item.data_status === "complete" &&
                Number.isFinite(Number(item.fixture_count))
              )
              .map(item => Number(item.fixture_count))
              .filter(count => count >= MIN_BASELINE);
          }

          async function main() {
            const startedAt = new Date().toISOString();

            console.log("================================");
            console.log("LIVE EDGE FRESH COLLECTOR v8.4");
            console.log("Začiatok:", startedAt);
            console.log("Načítavam aktuálny LIVE zoznam...");
            console.log("================================");

            const previousLatest = readJson(LATEST_PATH, null);

            const archive = normalizeArchive(
              readJson(ARCHIVE_PATH, {
                schema_version: 1,
                updated_at: null,
                archived_matches: [],
                pending_matches: []
              })
            );

            const list = await getJSON(
              `${BASE}/fixtures/?sport=football&status=live&limit=200`
            );

            if (!Array.isArray(list.matches)) {
              throw new Error(
                "API nevrátilo platné pole matches. Staré dáta nemením."
              );
            }

            const fixtures = list.matches.filter(isLive);
            const unique = new Map();

            for (const item of fixtures) {
              const slug = getSlug(item);
              if (slug) unique.set(slug, item);
            }

            const uniqueFixtures = [...unique.values()];

            console.log("LIVE zápasy podľa API:", uniqueFixtures.length);

            const records = [];
            const errors = [];

            async function collectMatch(item) {
              const name = `${item.home || "?"} - ${item.away || "?"}`;

              try {
                const slug = getSlug(item);

                if (!slug) {
                  throw new Error("Chýba slug zápasu");
                }

                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  throw new Error("Chýba detail zápasu");
                }

                const match = detail.match;

                if (!isLive(match)) {
                  console.log(
                    "VYRADENÝ:",
                    name,
                    "| stav:",
                    getStatus(match) || "neznámy"
                  );
                  return null;
                }

                console.log(
                  "OVERENÝ LIVE:",
                  name,
                  "|",
                  match.live_minute || "?",
                  "min |",
                  match.home_score,
                  ":",
                  match.away_score
                );

                return {
                  collected_at: new Date().toISOString(),
                  match
                };

              } catch (error) {
                const message = `${name}: ${error.message}`;
                errors.push(message);
                console.log("CHYBA:", message);
                return null;
              }
            }

            for (let i = 0; i < uniqueFixtures.length; i += 5) {
              const batch = uniqueFixtures.slice(i, i + 5);

              const results = await Promise.all(
                batch.map(collectMatch)
              );

              records.push(...results.filter(Boolean));
              await sleep(1000);
            }

            const complete = errors.length === 0;

            // =========================================
            // OCHRANA PRED NEÚPLNÝM LIVE ZOZNAMOM
            // =========================================

            const historyCounts = readHistoryCounts();

            const feedGuard = archive.feed_guard || {
              baseline_fixture_count: null,
              suspect_fixture_count: null,
              suspect_runs: 0
            };

            const baselineCandidates = [
              feedGuard.baseline_fixture_count,
              ...historyCounts
            ]
              .map(Number)
              .filter(value =>
                Number.isFinite(value) &&
                value >= MIN_BASELINE
              );

            if (
              previousLatest &&
              previousLatest.data_status === "complete" &&
              Number.isFinite(Number(previousLatest.fixture_count)) &&
              Number(previousLatest.fixture_count) >= MIN_BASELINE
            ) {
              baselineCandidates.push(
                Number(previousLatest.fixture_count)
              );
            }

            let baseline = baselineCandidates.length
              ? Math.max(...baselineCandidates)
              : null;

            let archiveSafe = false;
            let feedDataSafe = false;
            const detailCoverage = uniqueFixtures.length > 0 &&
              records.length >= Math.max(1, Math.ceil(uniqueFixtures.length * 0.8));

            console.log("Overené LIVE detaily:", records.length, "/", uniqueFixtures.length);
            console.log("Pokrytie detailmi:", Math.round(
              (records.length / Math.max(1, uniqueFixtures.length)) * 100
            ), "%");

            if (baseline === null) {
              console.log(
                "VAROVANIE: Chýba dôveryhodná historická základňa."
              );

              if (
                complete &&
                detailCoverage &&
                uniqueFixtures.length >= MIN_BASELINE
              ) {
                feedDataSafe = true;
                feedGuard.baseline_fixture_count =
                  uniqueFixtures.length;

                console.log(
                  "PRVÁ ZÁKLADŇA NASTAVENÁ:",
                  uniqueFixtures.length
                );

                console.log(
                  "Archivácia zostáva pozastavená do ďalšieho zberu."
                );
              }

              feedGuard.suspect_fixture_count = null;
              feedGuard.suspect_runs = 0;

            } else {
              feedGuard.baseline_fixture_count = baseline;

              const minimumExpected = Math.max(
                2,
                Math.ceil(baseline * DROP_RATIO)
              );

              const suspiciousDrop =
                uniqueFixtures.length < minimumExpected;

              console.log("================================");
              console.log("FEED GUARD v8.4");
              console.log("Historická základňa:", baseline);
              console.log("Aktuálny počet:", uniqueFixtures.length);
              console.log("Minimálny očakávaný počet:", minimumExpected);
              console.log("================================");

              if (!complete || !detailCoverage) {
                archiveSafe = false;
                feedDataSafe = false;

                console.log(
                  "NEÚPLNÝ ZBER: Archivácia pozastavená."
                );

              } else if (suspiciousDrop) {
                archiveSafe = false;
                feedDataSafe = false;

                feedGuard.suspect_fixture_count =
                  uniqueFixtures.length;

                feedGuard.suspect_runs =
                  (Number(feedGuard.suspect_runs) || 0) + 1;

                console.log("================================");
                console.log(
                  "VAROVANIE: PODOZRIVÝ POKLES LIVE ZÁPASOV"
                );
                console.log("Historická základňa:", baseline);
                console.log(
                  "Aktuálny počet:",
                  uniqueFixtures.length
                );
                console.log(
                  "Podozrivé zbery:",
                  feedGuard.suspect_runs
                );
                console.log("ARCHIVÁCIA POZASTAVENÁ.");
                console.log("================================");

              } else {
                archiveSafe = true;
                feedDataSafe = true;

                feedGuard.suspect_fixture_count = null;
                feedGuard.suspect_runs = 0;

                // Základňu možno zvýšiť, nikdy automaticky znížiť.
                if (uniqueFixtures.length > baseline) {
                  baseline = uniqueFixtures.length;
                  feedGuard.baseline_fixture_count = baseline;
                }
              }
            }

            archive.feed_guard = feedGuard;

            const output = {
              collected_at: new Date().toISOString(),
              collection_started_at: startedAt,
              source: "SportScore API v1",
              collector_version: "8.4",
              data_status: archiveSafe ? "complete" : "partial",
              collection_complete: complete,
              archive_safe: archiveSafe,
              fixture_count: uniqueFixtures.length,
              live_count: records.length,
              saved_count: records.length,
              errors,
              records
            };

            // =========================================
            // ARCHÍV ZÁPASOV
            // =========================================

            const archived = new Map();
            const pending = new Map();

            for (const item of archive.archived_matches) {
              if (item?.id) {
                archived.set(String(item.id), item);
              }
            }

            for (const item of archive.pending_matches) {
              if (item?.id) {
                pending.set(String(item.id), item);
              }
            }

            const currentById = new Map();

            for (const record of records) {
              const id = getMatchId(record);

              if (id) {
                currentById.set(
                  id,
                  makeArchiveSnapshot(record, id)
                );
              }
            }

            const now = new Date().toISOString();

            if (archiveSafe) {
              for (const id of currentById.keys()) {
                if (pending.has(id)) {
                  pending.delete(id);
                  console.log("SPÄŤ V LIVE:", id);
                }
              }

              for (const [id, item] of [...pending.entries()]) {
                if (currentById.has(id)) continue;

                item.missing_complete_runs =
                  (item.missing_complete_runs || 0) + 1;

                item.last_missing_at = now;

                if (item.missing_complete_runs >= REQUIRED_MISSES) {
                  archived.set(id, {
                    id,
                    archived_at: now,
                    first_missing_at: item.first_missing_at,
                    last_seen_at: item.last_seen_at,
                    missing_complete_runs: item.missing_complete_runs,
                    archive_reason:
                      "absent_from_live_feed_after_3_complete_collections",
                    status_confirmation: "not_confirmed_finished",
                    last_snapshot: item.last_snapshot
                  });

                  pending.delete(id);

                  console.log("ARCHIVOVANÝ ZÁPAS:", id);

                } else {
                  pending.set(id, item);

                  console.log(
                    "ČAKÁ NA POTVRDENIE:",
                    id,
                    "|",
                    item.missing_complete_runs,
                    "/",
                    REQUIRED_MISSES
                  );
                }
              }

              if (
                previousLatest &&
                previousLatest.data_status === "complete" &&
                Array.isArray(previousLatest.records)
              ) {
                for (const record of previousLatest.records) {
                  const id = getMatchId(record);

                  if (!id) continue;
                  if (currentById.has(id)) continue;
                  if (pending.has(id)) continue;
                  if (archived.has(id)) continue;

                  const snapshot = makeArchiveSnapshot(record, id);

                  const item = {
                    id,
                    first_missing_at: now,
                    last_missing_at: now,
                    last_seen_at: record.collected_at || null,
                    missing_complete_runs: 1,
                    last_snapshot: snapshot
                  };

                  pending.set(id, item);

                  console.log("NOVÝ KANDIDÁT ARCHÍVU:", id);
                }
              }

            } else {
              console.log(
                "ARCHÍV BEZ ZMIEN: zber nie je bezpečný na započítanie neprítomnosti."
              );
            }

            archive.updated_at = now;
            archive.archived_matches = [...archived.values()];
            archive.pending_matches = [...pending.values()];

            fs.writeFileSync(
              ARCHIVE_PATH,
              JSON.stringify(archive, null, 2)
            );

            console.log("================================");
            console.log("ARCHIVE RESULT");
            console.log(JSON.stringify({
              archived_matches: archive.archived_matches.length,
              pending_matches: archive.pending_matches.length,
              complete_collection: complete,
              detail_coverage: detailCoverage,
              feed_data_safe: feedDataSafe,
              archive_safe: archiveSafe,
              baseline_fixture_count: feedGuard.baseline_fixture_count,
              suspect_runs: feedGuard.suspect_runs
            }, null, 2));
            console.log("================================");

            // =========================================
            // AKTUÁLNE LIVE DÁTA
            // =========================================

            if (feedDataSafe) {
              const currentOutput = {
                ...output,
                data_status: "complete",
                snapshot_type: "current_verified_live",
                archive_safe: archiveSafe,
                feed_guard_warning: false
              };

              fs.writeFileSync(
                CURRENT_PATH,
                JSON.stringify(currentOutput, null, 2)
              );

              console.log(
                "AKTUÁLNE LIVE DÁTA AKTUALIZOVANÉ."
              );

            } else {
              console.log(
                "LIVE CURRENT ZACHOVANÝ: zber obsahuje chyby."
              );
            }

            // =========================================
            // PÔVODNÝ DÔVERYHODNÝ SNAPSHOT
            // =========================================

            if (archiveSafe) {
              fs.writeFileSync(
                LATEST_PATH,
                JSON.stringify(output, null, 2)
              );

              console.log("LIVE SNAPSHOT AKTUALIZOVANÝ.");

            } else {
              console.log(
                "LIVE SNAPSHOT ZACHOVANÝ: posledné dôveryhodné dáta zostávajú uložené."
              );
            }

            // =========================================
            // HISTÓRIA
            // =========================================

            fs.appendFileSync(
              HISTORY_PATH,
              JSON.stringify(output) + "\n"
            );

            const history = fs.readFileSync(HISTORY_PATH, "utf8")
              .split("\n")
              .filter(Boolean)
              .slice(-288)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(Boolean);

            fs.writeFileSync(
              HISTORY_JSON_PATH,
              JSON.stringify(history)
            );

            // =========================================
            // TRVALÝ ARCHÍV LIVE SIGNÁLOV
            // Rovnaké váhy a prahy ako v scanner.js.
            // =========================================

            const signalArchive = readJson(SIGNAL_ARCHIVE_PATH, {
              schema_version: 1,
              updated_at: null,
              signals: []
            });

            if (!Array.isArray(signalArchive.signals)) {
              throw new Error("Archív signálov nemá platné pole signals.");
            }

            function frontendMatchId(match) {
              return String(
                match?.tracker?.id ||
                match?.slug ||
                match?.url ||
                match?.id ||
                ""
              );
            }

            function frontendStatValue(stats, keyword) {
              const item = (stats || []).find(s =>
                String(s.label || "").toLowerCase().includes(keyword)
              );
              if (!item) return null;
              const home = Number(item.home);
              const away = Number(item.away);
              if (!Number.isFinite(home) || !Number.isFinite(away)) return null;
              return { home, away };
            }

            function frontendPressure(stats) {
              const measures = [
                { key: "possession", weight: 0.10 },
                { key: "shots on target", weight: 0.40 },
                { key: "dangerous attacks", weight: 0.50 }
              ];
              let home = 0;
              let away = 0;
              let totalWeight = 0;

              for (const measure of measures) {
                const value = frontendStatValue(stats, measure.key);
                if (!value) continue;
                const total = value.home + value.away;
                const ratio = total > 0 ? value.home / total : 0.5;
                home += ratio * measure.weight;
                away += (1 - ratio) * measure.weight;
                totalWeight += measure.weight;
              }

              if (!totalWeight) return null;
              return {
                home: Math.round(home / totalWeight * 100),
                away: Math.round(away / totalWeight * 100)
              };
            }

            function makeServerSnapshot(match, currentRecord) {
              const id = frontendMatchId(match);
              const currentTime = Date.parse(currentRecord.collected_at || "");
              const currentShots = frontendStatValue(match.stats || [], "shots on target");
              const currentAttacks = frontendStatValue(match.stats || [], "dangerous attacks");

              if (!id || !Number.isFinite(currentTime) || !currentShots || !currentAttacks) {
                return null;
              }

              const previous = [];
              for (const batch of history) {
                const validCollection =
                  batch.collection_complete === true ||
                  batch.data_status === "complete";
                if (!validCollection || !Array.isArray(batch.records)) continue;

                for (const record of batch.records) {
                  if (!record.match || frontendMatchId(record.match) !== id) continue;
                  if (!isLive(record.match)) continue;
                  const time = Date.parse(record.collected_at || batch.collected_at || "");
                  if (Number.isFinite(time) && time < currentTime - 1000) {
                    previous.push({ time, match: record.match });
                  }
                }
              }

              previous.sort((a, b) => a.time - b.time);
              if (!previous.length) return null;

              const old = previous[previous.length - 1];
              const minutes = (currentTime - old.time) / 60000;
              if (!Number.isFinite(minutes) || minutes < 3 || minutes > 15) return null;

              const oldShots = frontendStatValue(old.match.stats || [], "shots on target");
              const oldAttacks = frontendStatValue(old.match.stats || [], "dangerous attacks");
              if (!oldShots || !oldAttacks) return null;

              if (
                currentShots.home < oldShots.home ||
                currentShots.away < oldShots.away ||
                currentAttacks.home < oldAttacks.home ||
                currentAttacks.away < oldAttacks.away
              ) return null;

              const homeShots = currentShots.home - oldShots.home;
              const awayShots = currentShots.away - oldShots.away;
              const homeAttacks = currentAttacks.home - oldAttacks.home;
              const awayAttacks = currentAttacks.away - oldAttacks.away;
              const homeActivity = homeShots * 3 + homeAttacks;
              const awayActivity = awayShots * 3 + awayAttacks;

              return {
                homeActivityRate: homeActivity / minutes * 10,
                awayActivityRate: awayActivity / minutes * 10
              };
            }

            function createServerSignal(match, record) {
              const minute = Number(match.live_minute);
              if (!Number.isFinite(minute) || minute < 10 || minute > 90) return null;

              const collectedTime = Date.parse(record.collected_at || "");
              const age = Date.now() - collectedTime;
              if (!Number.isFinite(age) || age < 0 || age > 7 * 60 * 1000) return null;

              const pressure = frontendPressure(match.stats || []);
              const snapshot = makeServerSnapshot(match, record);
              if (!pressure || !snapshot) return null;

              const threat = {
                home: Math.min(100, Math.round(
                  pressure.home * 0.45 +
                  Math.min(snapshot.homeActivityRate * 3, 40) * 0.55
                )),
                away: Math.min(100, Math.round(
                  pressure.away * 0.45 +
                  Math.min(snapshot.awayActivityRate * 3, 40) * 0.55
                ))
              };

              const candidates = [
                {
                  side: "home",
                  team: match.home,
                  score: threat.home,
                  activity: snapshot.homeActivityRate,
                  difference: threat.home - threat.away
                },
                {
                  side: "away",
                  team: match.away,
                  score: threat.away,
                  activity: snapshot.awayActivityRate,
                  difference: threat.away - threat.home
                }
              ];

              return candidates.find(item =>
                item.score >= 65 &&
                item.activity >= 4 &&
                item.difference >= 3
              ) || null;
            }

            const signalNow = new Date().toISOString();
            const liveById = new Map();

            if (archiveSafe) {
              for (const record of records) {
                if (record?.match) {
                  const id = frontendMatchId(record.match);
                  if (id) liveById.set(id, record);
                }
              }

              // Najprv bezpečne vyhodnoť už otvorené signály.
              for (const signal of signalArchive.signals) {
                if (signal.status !== "OPEN") continue;
                const record = liveById.get(String(signal.matchId));
                if (!record) continue;

                const match = record.match;
                const goals = signal.side === "home"
                  ? Number(match.home_score || 0)
                  : Number(match.away_score || 0);
                const minute = Number(match.live_minute);

                if (Number.isFinite(goals) && goals > Number(signal.startGoals)) {
                  signal.status = "WIN";
                  signal.settledAt = signalNow;
                  signal.settledMinute = Number.isFinite(minute) ? minute : null;
                  signal.settledScore = `${Number(match.home_score || 0)}:${Number(match.away_score || 0)}`;
                } else if (
                  Number.isFinite(minute) &&
                  minute >= Number(signal.deadlineMinute)
                ) {
                  signal.status = "LOSS";
                  signal.settledAt = signalNow;
                  signal.settledMinute = minute;
                  signal.settledScore = `${Number(match.home_score || 0)}:${Number(match.away_score || 0)}`;
                }
              }

              // Ak zápas zmizol z LIVE feedu po bezpečnej archivácii,
              // označ signál ako NEOVERENÝ – nikdy ho automaticky nepočítaj ako LOSS.
              const archivedMatchIds = new Set(
                (archive.archived_matches || []).map(item =>
                  frontendMatchId(item?.last_snapshot?.match) || String(item?.id || "")
                )
              );

              for (const signal of signalArchive.signals) {
                if (
                  signal.status === "OPEN" &&
                  archivedMatchIds.has(String(signal.matchId))
                ) {
                  signal.status = "UNRESOLVED";
                  signal.unresolvedAt = signalNow;
                  signal.statusReason =
                    "Match absent from LIVE feed; final score not confirmed.";
                }
              }

              // Potom vytvor nové signály podľa rovnakých prahov ako scanner.js.
              for (const record of records) {
                const match = record?.match;
                if (!match || !isLive(match)) continue;

                const candidate = createServerSignal(match, record);
                if (!candidate) continue;

                const id = frontendMatchId(match);
                const alreadyOpen = signalArchive.signals.some(item =>
                  String(item.matchId) === id &&
                  item.side === candidate.side &&
                  item.status === "OPEN"
                );
                if (alreadyOpen) continue;

                const minute = Number(match.live_minute);
                signalArchive.signals.push({
                  signalId: `${id}_${candidate.side}_${record.collected_at}`,
                  matchId: id,
                  home: match.home,
                  away: match.away,
                  side: candidate.side,
                  team: candidate.team,
                  startGoals: candidate.side === "home"
                    ? Number(match.home_score || 0)
                    : Number(match.away_score || 0),
                  startMinute: minute,
                  deadlineMinute: Math.min(90, minute + 15),
                  goalThreat: candidate.score,
                  activityRate: Number(candidate.activity.toFixed(1)),
                  createdAt: record.collected_at || signalNow,
                  status: "OPEN",
                  startScore: `${Number(match.home_score || 0)}:${Number(match.away_score || 0)}`
                });
              }
            }

            signalArchive.updated_at = signalNow;
            fs.writeFileSync(
              SIGNAL_ARCHIVE_PATH,
              JSON.stringify(signalArchive, null, 2)
            );

            console.log("SIGNAL ARCHIVE:", JSON.stringify({
              total: signalArchive.signals.length,
              open: signalArchive.signals.filter(item => item.status === "OPEN").length,
              wins: signalArchive.signals.filter(item => item.status === "WIN").length,
              losses: signalArchive.signals.filter(item => item.status === "LOSS").length,
              updated: complete
            }));

            console.log("================================");
            console.log("COLLECTION RESULT");
            console.log(JSON.stringify({
              data_status: output.data_status,
              collection_complete: complete,
              archive_safe: archiveSafe,
              fixture_count: output.fixture_count,
              verified_live: output.live_count,
              saved_count: output.saved_count,
              errors: errors.length,
              current_updated: feedDataSafe,
              detail_coverage: detailCoverage,
              feed_data_safe: feedDataSafe,
              history_updated: true,
              archive_updated: true,
              latest_updated: archiveSafe,
              collected_at: output.collected_at
            }, null, 2));
            console.log("================================");

            if (!complete || !archiveSafe) {
              console.log(
                "UPOZORNENIE: Zber nie je bezpečný na aktualizáciu dôveryhodného snapshotu a počítanie neprítomnosti."
              );
            }
          }

          main().catch(error => {
            console.error("COLLECTOR FAILED:", error);
            process.exit(1);
          });
          NODE

