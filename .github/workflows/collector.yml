
name: LIVE EDGE AUTO COLLECTOR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect verified LIVE football data
        run: |
          mkdir -p data

          node <<'NODE'
          const fs = require("fs");

          const BASE = "https://sportscore.com/api/v1";

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          async function getJSON(url, attempts = 3) {
            let lastError;

            for (let i = 1; i <= attempts; i++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    "User-Agent": "LIVE-EDGE-AI-PRO/5.0",
                    "Accept": "application/json"
                  },
                  signal: AbortSignal.timeout(20000)
                });

                if (!response.ok) {
                  throw new Error(`HTTP ${response.status}`);
                }

                return await response.json();

              } catch (error) {
                lastError = error;
                console.log(
                  `Pokus ${i}/${attempts}: ${error.message}`
                );

                if (i < attempts) {
                  await sleep(i * 2000);
                }
              }
            }

            throw lastError;
          }

          function getSlug(item) {
            if (item.slug) return item.slug;
            if (!item.url) return null;

            const parts = new URL(
              item.url,
              "https://sportscore.com"
            ).pathname.split("/").filter(Boolean);

            const index = parts.indexOf("match");

            return index !== -1
              ? parts[index + 1] || null
              : null;
          }

          function getStatus(match) {
            const value = match?.status;

            if (typeof value === "string") {
              return value.toLowerCase();
            }

            if (value && typeof value === "object") {
              return String(
                value.type || value.name || value.short || ""
              ).toLowerCase();
            }

            return "";
          }

          function isLive(match) {
            return getStatus(match) === "live";
          }

          async function main() {
            console.log("Načítavam SportScore API v1...");

            const list = await getJSON(
              `${BASE}/fixtures/?sport=football&status=live&limit=200`
            );

            const fixtures = (list.matches || []).filter(
              item => getStatus(item) === "live"
            );

            const records = [];
            const errors = [];

            console.log(
              `Zoznam LIVE zápasov: ${fixtures.length}`
            );

            async function collectMatch(item) {
              const name =
                `${item.home || "?"} - ${item.away || "?"}`;

              try {
                const slug = getSlug(item);

                if (!slug) {
                  throw new Error("Chýba slug zápasu");
                }

                const detail = await getJSON(
                  `${BASE}/match/?sport=football&slug=${encodeURIComponent(slug)}`
                );

                if (!detail.match) {
                  throw new Error("Detail zápasu neexistuje");
                }

                const match = detail.match;

                if (!isLive(match)) {
                  console.log(
                    `VYNECHANÝ ZÁPAS: ${name} | stav: ${getStatus(match) || "neznámy"}`
                  );
                  return null;
                }

                return {
                  collected_at: new Date().toISOString(),
                  match
                };

              } catch (error) {
                errors.push(`${name}: ${error.message}`);
                return null;
              }
            }

            for (let i = 0; i < fixtures.length; i += 5) {
              const batch = fixtures.slice(i, i + 5);

              const results = await Promise.all(
                batch.map(collectMatch)
              );

              records.push(...results.filter(Boolean));

              await sleep(1000);
            }

            const output = {
              collected_at: new Date().toISOString(),
              source: "SportScore API v1",
              fixture_count: fixtures.length,
              live_count: records.length,
              saved_count: records.length,
              errors,
              records
            };

            fs.writeFileSync(
              "data/live-latest.json",
              JSON.stringify(output, null, 2)
            );

            const jsonlPath = "data/live-history.jsonl";

            fs.appendFileSync(
              jsonlPath,
              JSON.stringify(output) + "\n"
            );

            const history = fs.readFileSync(jsonlPath, "utf8")
              .split("\n")
              .filter(Boolean)
              .slice(-288)
              .map(line => {
                try {
                  return JSON.parse(line);
                } catch {
                  return null;
                }
              })
              .filter(Boolean);

            fs.writeFileSync(
              "data/live-history.json",
              JSON.stringify(history)
            );

            console.log("COLLECTION RESULT:");
            console.log(JSON.stringify({
              fixture_count: fixtures.length,
              verified_live: records.length,
              saved_count: records.length,
              errors,
              history_snapshots: history.length
            }, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save collected history
        run: |
          git config user.name "LIVE EDGE AUTO COLLECTOR"
          git config user.email "actions@users.noreply.github.com"

          git add data/live-history.jsonl data/live-latest.json data/live-history.json

          git diff --cached --quiet || (
            git commit -m "Restore SportScore API v1 LIVE collector"
            git push
          )
