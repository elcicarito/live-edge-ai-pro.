name: Flashscore clock diagnostics (isolated)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/flashscore-clock-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: flashscore-clock-diagnostics-isolated
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Test isolated Flashscore live-clock collector
        run: node scripts/test-flashscore-only-collector.js

      - name: Checkout pinned Flashscore scraper
        uses: actions/checkout@v4
        with:
          repository: omkarcloud/flashscore-scraper
          ref: af784a918fc94339fd2c8ff0fadc1da69a6139d8
          path: .flashscore-scraper

      - name: Add read-only page clock diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".flashscore-scraper/flashscore/matches.py")
          source = p.read_text()
          start = source.find("def get_details(match):")
          if start < 0:
              raise SystemExit("get_details function not found")
          end = source.find("\ndef ", start + 1)
          if end < 0:
              end = len(source)
          block = source[start:end]
          marker = "    return summary"
          if marker not in block:
              raise SystemExit("get_details return marker not found")
          if "diagnostic_clock_elements" not in block:
              injected = """    summary["diagnostic_environment_keys"] = sorted(environment.keys())
              summary["diagnostic_environment_values"] = {k: environment.get(k) for k in ("eventStageStartTime", "event_stage_time", "eventStageTypeId", "eventStageId", "lastEventInfo", "final_stage")}
              summary["diagnostic_event_info"] = info
              summary["diagnostic_core_DI"] = P.to_int(core.get("DI"))
              import re
              summary["diagnostic_html_clock_markers"] = [html[max(0, m.start()-160):m.end()+240] for m in list(re.finditer(r"displayClock|clock|minute|timer|timeElapsed|matchTime|elapsed|eventStageStartTime|event_stage_time", html, re.I))[:20]]
              summary["diagnostic_clock_elements"] = [html[max(0, m.start()-400):m.end()+700] for m in list(re.finditer(r'class="[^"]*(?:event__stage|event__time|detailScore__status|matchTime|clock|timer|stage__time)[^"]*"|data-testid="[^"]*(?:time|clock|stage)[^"]*"', html, re.I))[:20]]
              summary["diagnostic_minute_text"] = [html[max(0, m.start()-120):m.end()+180] for m in list(re.finditer(r'>\\s*(?:\\d{1,3}(?:\\+\\d{1,2})?|HT|Half Time|Break Time|FT)\\s*(?:&#39;|′)?\\s*<', html, re.I))[:25]]
          """
              block = block.replace(marker, injected + "\n    return summary", 1)
              source = source[:start] + block + source[end:]
              p.write_text(source)
          p = Path(".flashscore-scraper/flashscore/matches.py")
          source = p.read_text()
          marker = '            stage_id = P.to_int(record.get("AC"))'
          injected = marker + '\n            bx = P.to_int(record.get("BX"))\n            if bx is not None:\n                entry["diagnostic_bx"] = bx'
          if marker not in source:
              raise SystemExit("live update parse marker not found; refusing unsafe patch")
          if 'entry["diagnostic_bx"]' not in source:
              source = source.replace(marker, injected, 1)
              p.write_text(source)
          print("Read-only HTML and live-feed BX diagnostics patched into temporary scraper checkout.")
          PY

      - name: Instrument raw live-feed records (temporary only)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path(".flashscore-scraper/flashscore/fetch.py")
          source = p.read_text()
          marker = '    text = (text or "").strip()\n    return "" if text in EMPTY_BODIES else text'
          injected = '''    text = (text or "").strip()
              if name in ("r_1_1", "u_1_1") or name.startswith(("dc_1_", "df_lc_1_", "df_sui_1_")):
                  import json
                  rows = []
                  for chunk in text.split("~")[:30]:
                      row = {}
                      for pair in chunk.split("¬"):
                          key, sep, value = pair.partition("÷")
                          if sep and key not in row:
                              row[key] = value
                      if row:
                          rows.append(row)
                  print("RAW_CLOCK_FEED:", json.dumps({"feed": name, "bytes": len(text), "records": rows}, ensure_ascii=False), flush=True)
              return "" if text in EMPTY_BODIES else text'''
          if marker not in source:
              raise SystemExit("get_feed normalization marker not found; refusing unsafe patch")
          if "RAW_CLOCK_FEED:" not in source:
              source = source.replace(marker, injected, 1)
              p.write_text(source)
          print("Temporary raw-feed instrumentation installed; repository source remains unchanged.")
          PY
      - name: Build and start isolated Flashscore API
        run: |
          docker build -t flashscore-clock-diagnostic .flashscore-scraper
          docker run -d --name flashscore-clock-diagnostic -p 127.0.0.1:8000:8000 flashscore-clock-diagnostic
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Flashscore API did not become healthy"
          echo "Container status:"
          docker ps -a --filter name=flashscore-clock-diagnostic
          echo "Container logs:"
          docker logs flashscore-clock-diagnostic 2>&1 || true
          echo "Container inspect:"
          docker inspect flashscore-clock-diagnostic 2>&1 || true
          exit 1

      - name: Inspect current live fixtures and page clocks
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          base = "http://127.0.0.1:8000"
          with urllib.request.urlopen(base + "/matches/live?sport=football", timeout=30) as response:
              live = json.loads(response.read().decode("utf-8"))
          ids = []
          for competition in live.get("competitions") or []:
              for match in competition.get("matches") or []:
                  match_id = match.get("id")
                  if match_id and str(match_id) not in ids:
                      ids.append(str(match_id))
          print("CURRENT LIVE FIXTURES:", json.dumps({
              "match_count": len(ids),
              "competition_count": live.get("competition_count"),
              "sample_ids": ids[:12]
          }, ensure_ascii=False))
          if not ids:
              print("NO CURRENT LIVE FIXTURES AVAILABLE")
          for match_id in ids[:12]:
              try:
                  query = urllib.parse.urlencode({"match": match_id})
                  with urllib.request.urlopen(base + "/matches/details?" + query, timeout=25) as response:
                      detail = json.loads(response.read().decode("utf-8"))
                  print("MATCH CLOCK DIAGNOSTIC:", json.dumps({
                      "id": match_id,
                      "stage": detail.get("stage"),
                      "status": detail.get("status"),
                      "environment_keys": detail.get("diagnostic_environment_keys"),
                      "environment_values": detail.get("diagnostic_environment_values"),
                      "event_info": detail.get("diagnostic_event_info"),
                      "clock_elements": detail.get("diagnostic_clock_elements"),
                      "minute_text": detail.get("diagnostic_minute_text"),
                      "html_markers": detail.get("diagnostic_html_clock_markers")
                  }, ensure_ascii=False))
              except Exception as exc:
                  print("MATCH DETAIL ERROR:", match_id, repr(exc))
          with urllib.request.urlopen(base + "/matches/live-updates?sport=football", timeout=30) as response:
              updates = json.loads(response.read().decode("utf-8"))
          print("PARSED LIVE UPDATES:", json.dumps(updates, ensure_ascii=False))
          import time
          for poll in range(1, 4):
              if poll > 1:
                  time.sleep(60)
              with urllib.request.urlopen(base + "/matches/live-updates?sport=football", timeout=30) as response:
                  sample = json.loads(response.read().decode("utf-8"))
              print("REPEATED LIVE POLL:", json.dumps({
                  "poll": poll,
                  "count": sample.get("count"),
                  "updates": sample.get("updates")
              }, ensure_ascii=False))
          for match_id in ids[:12]:
              for endpoint in ("matches/details", "matches/commentary", "matches/summary"):
                  try:
                      query = urllib.parse.urlencode({"match": match_id})
                      with urllib.request.urlopen(base + "/" + endpoint + "?" + query, timeout=25) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      if endpoint.endswith("commentary"):
                          payload = {k: payload.get(k) for k in ("id", "stage", "count", "comments")}
                      elif endpoint.endswith("summary"):
                          payload = {k: payload.get(k) for k in ("id", "stage", "period_count", "incident_count", "periods")}
                      print("CLOCK RELATED ENDPOINT:", endpoint, match_id, json.dumps(payload, ensure_ascii=False))
                  except Exception as exc:
                      print("CLOCK ENDPOINT ERROR:", endpoint, match_id, repr(exc))
          PY

      - name: Install browser for rendered Flashscore clock check
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: Compare raw BX with rendered Flashscore match clocks
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from playwright.sync_api import sync_playwright

          with urllib.request.urlopen("http://127.0.0.1:8000/matches/live?sport=football", timeout=30) as response:
              live = json.loads(response.read().decode("utf-8"))
          matches = []
          for competition in live.get("competitions") or []:
              for match in competition.get("matches") or []:
                  if match.get("id") and match["id"] not in [x["id"] for x in matches]:
                      matches.append({"id": str(match["id"]), "link": match.get("link")})
          print("RENDERED_CLOCK_MATCH_CANDIDATES:", json.dumps(matches[:6]), flush=True)
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              for match in matches[:6]:
                  url = match.get("link") or ("https://www.flashscore.com/match/" + match["id"] + "/")
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      page.wait_for_timeout(5000)
                      selectors = [
                          ".event__stage--block", ".detailScore__status",
                          ".event__time", "[data-testid*='clock']",
                          "[class*='clock']", "[class*='timer']",
                          "[class*='stage']"
                      ]
                      found = {}
                      for selector in selectors:
                          values = page.locator(selector).all_inner_texts()
                          values = [v.strip() for v in values if v and v.strip()]
                          if values:
                              found[selector] = values[:8]
                      body = page.locator("body").inner_text(timeout=10000)
                      import time
                      page_capture_epoch = time.time()
                      with urllib.request.urlopen("http://127.0.0.1:8000/matches/live-updates?sport=football", timeout=30) as response:
                          live_updates = json.loads(response.read().decode("utf-8"))
                      match_update = next((item for item in live_updates.get("updates", []) if item.get("id") == match["id"]), {})
                      with urllib.request.urlopen("http://127.0.0.1:8000/matches/details?match=" + match["id"], timeout=25) as response:
                          detail = json.loads(response.read().decode("utf-8"))
                      lines = [line.strip() for line in body.splitlines() if line.strip()]
                      time_like = [line for line in lines if __import__("re").search(r"^\\d{1,3}(?:\\+\\d{1,2})?['′]?$|^(?:HT|Half Time|Break Time|FT)$", line, __import__("re").I)]
                      stage_values = detail.get("diagnostic_environment_values") or {}
                      stage_start = stage_values.get("eventStageStartTime")
                      stage_id = detail.get("stage_id")
                      from datetime import datetime, timezone
                      capture_epoch = page_capture_epoch
                      derived_clock = None
                      if stage_start:
                          elapsed = max(0, int(capture_epoch - float(stage_start)))
                          if str(detail.get("stage") or "").lower() in ("2nd half", "second half"):
                              elapsed += 45 * 60
                          elif str(detail.get("stage") or "").lower() in ("extra time", "extra time 1st half"):
                              elapsed += 90 * 60
                          elif str(detail.get("stage") or "").lower() in ("extra time 2nd half",):
                              elapsed += 105 * 60
                          derived_clock = str(elapsed // 60) + ":" + str(elapsed % 60).zfill(2)
                      print("RENDERED_FLASHscore_CLOCK:", json.dumps({
                          "id": match["id"], "url": url, "title": page.title(),
                          "selectors": found, "time_like_text": time_like[:20],
                          "same_window_live_feed_BX": match_update.get("diagnostic_bx"),
                          "same_window_detail_DI": detail.get("diagnostic_core_DI"),
                          "stage": detail.get("stage"), "stage_id": stage_id,
                          "eventStageStartTime": stage_start,
                          "capture_utc": datetime.fromtimestamp(capture_epoch, timezone.utc).isoformat(),
                          "derived_clock_from_stage_start": derived_clock
                      }, ensure_ascii=False), flush=True)
                  except Exception as exc:
                      print("RENDERED_CLOCK_ERROR:", match["id"], repr(exc), flush=True)
              browser.close()
          PY

      - name: Print raw live-feed diagnostics
        if: always()
        run: |
          docker logs flashscore-clock-diagnostic 2>&1 | grep -E 'RAW_CLOCK_FEED|PARSED LIVE UPDATES|CLOCK RELATED ENDPOINT|CLOCK ENDPOINT ERROR' | tail -c 50000 || true
      - name: Stop isolated Flashscore API
        if: always()
        run: docker stop flashscore-clock-diagnostic 2>/dev/null || true
