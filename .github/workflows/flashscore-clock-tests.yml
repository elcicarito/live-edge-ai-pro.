name: Flashscore clock collector tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - flashscore-primary-integration
      - flashscore-permanent-archive
      - flashscore-archive-integrity
      - flashscore-ai-data-quality
      - flashscore-dashboard-primary-feed
      - flashscore-training-observations
      - flashscore-only-collector-pipeline
      - flashscore-confirmed-outcome-archive
      - flashscore-outcome-dashboard
      - flashscore-archive-dashboard-migration
    paths:
      - .github/workflows/flashscore-clock-tests.yml
      - .github/workflows/collector.yml
      - scripts/flashscore-archive-quality.js
      - scripts/test-flashscore-archive-quality.js
      - scripts/flashscore-only-collector.js
      - scripts/flashscore-primary-adapter.js
      - scripts/test-flashscore-primary-adapter.js
      - scripts/test-flashscore-only-collector.js
      - scripts/flashscore-btts-collector.js
      - scripts/test-flashscore-btts-collector.js
      - scripts/flashscore-btts-archive-evaluation.js
      - scripts/test-flashscore-btts-archive-evaluation.js
      - scripts/flashscore-archive-integrity.js
      - scripts/test-flashscore-archive-integrity.js
      - scanner.js
      - scripts/test-flashscore-dashboard-source.js
      - scripts/flashscore-live-observations.js
      - scripts/flashscore-outcome-settlement.js
      - scripts/test-flashscore-outcome-settlement.js
      - scripts/test-flashscore-live-observations.js
      - scripts/flashscore-timeline-browser-export.js
      - scripts/test-flashscore-timeline-browser-export.js
      - scripts/test-flashscore-match-minute.js

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check scripts/flashscore-only-collector.js
          node --check scripts/flashscore-primary-adapter.js
          node --check scripts/test-flashscore-primary-adapter.js
          node --check scripts/test-flashscore-only-collector.js
          node --check scripts/flashscore-btts-collector.js
          node --check scripts/test-flashscore-btts-collector.js
          node --check scripts/flashscore-btts-archive-evaluation.js
          node --check scripts/test-flashscore-btts-archive-evaluation.js
          node --check scripts/flashscore-archive-integrity.js
          node --check scripts/test-flashscore-archive-integrity.js
          node --check scripts/flashscore-archive-quality.js
          node --check scripts/test-flashscore-archive-quality.js
          node --check scanner.js
          node --check scripts/test-flashscore-dashboard-source.js
          node --check scripts/flashscore-live-observations.js
          node --check scripts/test-flashscore-live-observations.js
          node --check scripts/flashscore-timeline-browser-export.js
          node --check scripts/test-flashscore-timeline-browser-export.js
          node --check scripts/test-flashscore-match-minute.js
          node --check scripts/flashscore-outcome-settlement.js
          node --check scripts/test-flashscore-outcome-settlement.js

      - name: Run Flashscore live-clock integration tests
        run: |
          node scripts/test-flashscore-only-collector.js
          node scripts/test-flashscore-primary-adapter.js
          node scripts/test-flashscore-btts-collector.js
          node scripts/test-flashscore-btts-archive-evaluation.js
          node scripts/test-flashscore-archive-integrity.js
          node scripts/test-flashscore-archive-quality.js
          node scripts/test-flashscore-dashboard-source.js
          node scripts/test-flashscore-live-observations.js
          node scripts/test-flashscore-outcome-settlement.js
          node scripts/test-flashscore-timeline-browser-export.js
          node scripts/test-flashscore-match-minute.js
