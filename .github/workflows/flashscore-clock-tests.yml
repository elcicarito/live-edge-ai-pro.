name: Flashscore clock collector tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - flashscore-primary-integration
      - flashscore-permanent-archive
      - flashscore-archive-integrity
    paths:
      - .github/workflows/flashscore-clock-tests.yml
      - scripts/flashscore-archive-quality.js
      - scripts/test-flashscore-archive-quality.js
      - scripts/flashscore-only-collector.js
      - scripts/flashscore-primary-adapter.js
      - scripts/test-flashscore-primary-adapter.js
      - scripts/test-flashscore-only-collector.js
      - scripts/flashscore-btts-collector.js
      - scripts/test-flashscore-btts-collector.js
      - scripts/flashscore-archive-integrity.js
      - scripts/test-flashscore-archive-integrity.js
      - scanner.js

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check scripts/flashscore-only-collector.js
          node --check scripts/flashscore-primary-adapter.js
          node --check scripts/test-flashscore-primary-adapter.js
          node --check scripts/test-flashscore-only-collector.js
          node --check scripts/flashscore-btts-collector.js
          node --check scripts/test-flashscore-btts-collector.js
          node --check scripts/flashscore-archive-integrity.js
          node --check scripts/test-flashscore-archive-integrity.js
          node --check scripts/flashscore-archive-quality.js
          node --check scripts/test-flashscore-archive-quality.js
          node --check scanner.js

      - name: Run Flashscore live-clock integration tests
        run: |
          node scripts/test-flashscore-only-collector.js
          node scripts/test-flashscore-primary-adapter.js
          node scripts/test-flashscore-btts-collector.js
          node scripts/test-flashscore-archive-integrity.js
          node scripts/test-flashscore-archive-quality.js
