name: ESPN FOOTBALL ENRICHMENT ENDPOINT PROBE (ISOLATED)

on:
  push:
    paths:
      - '.github/workflows/espn-football-enrichment-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe soccer summary, CDN game package, situation and plays
        shell: bash
        run: |
          mkdir -p espn-enrichment-probe
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const samples = [
            ["bel.1", "401878945", "KV Kortrijk at KAA Gent"],
            ["aut.1", "401881755", "RB Salzburg at SK Sturm Graz"],
            ["chi.1", "401850690", "Coquimbo Unido at Audax Italiano"],
            ["eng.1", "401879240", "Aston Villa at Manchester United"],
            ["den.1", "401874562", "FC Nordsjælland at Randers FC"],
            ["esp.1", "401882810", "Rayo Vallecano at Real Sociedad"],
            ["fra.1", "401876412", "Nice at Angers"],
            ["ita.1", "401876000", "Italian Serie A sample"]
          ];

          const report = {
            started_at: new Date().toISOString(),
            purpose: "Find whether ESPN exposes dangerous attacks or equivalent pressure metrics outside scoreboard competitor statistics.",
            production_changed: false,
            samples: [],
            requests: []
          };

          function scan(value, path = "$", out = [], depth = 0) {
            if (depth > 12 || value == null) return out;
            if (Array.isArray(value)) {
              value.slice(0, 300).forEach((v, i) => scan(v, path + "[" + i + "]", out, depth + 1));
            } else if (typeof value === "object") {
              for (const [k, v] of Object.entries(value)) {
                if (/danger|attack|pressure|shot|possession|corner|statistic|situation|play/i.test(k)) {
                  out.push({ path: path + "." + k, value: JSON.stringify(v).slice(0, 1800) });
                }
                scan(v, path + "." + k, out, depth + 1);
              }
            }
            return out;
          }

          async function request(label, url) {
            const row = { label, url, status: null, bytes: 0, content_type: null, keys: [], matches: [], error: null };
            try {
              const response = await fetch(url, {
                headers: { accept: "application/json", "user-agent": "LIVE-EDGE-ESPN-ENRICHMENT-PROBE/1.0" },
                signal: AbortSignal.timeout(12000)
              });
              row.status = response.status;
              row.content_type = response.headers.get("content-type");
              const raw = await response.text();
              row.bytes = raw.length;
              if (!response.ok) throw new Error("HTTP " + response.status + ": " + raw.slice(0, 250));
              const data = JSON.parse(raw);
              row.keys = Object.keys(data);
              row.matches = scan(data).slice(0, 120);
              row.sample_structure = JSON.stringify(data).slice(0, 6500);
            } catch (error) {
              row.error = String(error?.message || error);
            }
            report.requests.push(row);
            return row;
          }

          for (const [league, eventId, match] of samples) {
            const item = { league, event_id: eventId, match, endpoints: [] };
            const urls = [
              ["summary", `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/summary?event=${eventId}`],
              ["cdn_game", `https://cdn.espn.com/core/soccer/game?xhr=1&gameId=${eventId}&league=${league}`],
              ["cdn_boxscore", `https://cdn.espn.com/core/soccer/boxscore?xhr=1&gameId=${eventId}&league=${league}`],
              ["core_situation", `https://sports.core.api.espn.com/v2/sports/soccer/leagues/${league}/events/${eventId}/competitions/${eventId}/situation`],
              ["core_plays", `https://sports.core.api.espn.com/v2/sports/soccer/leagues/${league}/events/${eventId}/competitions/${eventId}/plays?limit=300`]
            ];
            for (const [label, url] of urls) {
              const row = await request(label, url);
              item.endpoints.push({
                label, status: row.status, bytes: row.bytes, error: row.error,
                keys: row.keys, matches: row.matches,
                sample_structure: row.sample_structure
              });
            }
            report.samples.push(item);
          }

          report.finished_at = new Date().toISOString();
          report.summary = {
            sample_matches: samples.length,
            requests: report.requests.length,
            http_200: report.requests.filter(x => x.status === 200).length,
            errors: report.requests.filter(x => x.error).length,
            responses_with_attack_terms: report.requests.filter(x => x.matches.some(m => /danger|attack|pressure/i.test(m.path + m.value))).length,
            responses_with_statistics: report.requests.filter(x => x.matches.some(m => /statistic|shots|possession|corner/i.test(m.path + m.value))).length
          };
          fs.writeFileSync("espn-enrichment-probe/report.json", JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report.summary, null, 2));
          NODE
      - name: Upload enrichment probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-football-enrichment-probe
          path: espn-enrichment-probe/
          retention-days: 14
