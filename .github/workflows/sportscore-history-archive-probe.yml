name: SportScore historical archive probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe historical fixtures and match details
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime, os, collections
          BASE = "https://sportscore.com/api/v1"
          HEADERS = {"User-Agent":"LIVE-EDGE-AI-PRO-history-probe/1.0","Accept":"application/json"}
          DATES = ["2026-11-06","2025-11-07","2024-11-07","2023-11-07","2022-11-07"]
          def get(path, params):
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.headers.get("content-type"), json.loads(r.read().decode("utf-8"))
          report = {"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"source":"SportScore public API v1","dates":{},"errors":[]}
          for date in DATES:
              row = {"date":date,"fixture_http":None,"fixture_count":0,"fixture_statuses":{},"sample_fixtures":[],"detail_probes":[]}
              try:
                  status, ctype, payload = get("/fixtures/", {"sport":"football","date":date,"status":"finished","limit":200})
                  matches = payload.get("matches") or payload.get("fixtures") or payload.get("data") or []
                  if isinstance(matches, dict): matches = list(matches.values())
                  if not isinstance(matches,list): matches=[]
                  row.update({"fixture_http":status,"content_type":ctype,"payload_keys":list(payload.keys()) if isinstance(payload,dict) else [],"provider_count":payload.get("count") if isinstance(payload,dict) else None,"fixture_count":len(matches)})
                  counts=collections.Counter()
                  for m in matches:
                      if isinstance(m,dict):
                          st=m.get("status")
                          if isinstance(st,dict): st=st.get("type") or st.get("name") or st.get("short")
                          counts[str(st or "missing")]+=1
                  row["fixture_statuses"]=dict(counts)
                  row["sample_fixtures"]=matches[:3]
                  # Probe details for first three fixtures with usable slug or match URL.
                  for m in matches[:3]:
                      if not isinstance(m,dict): continue
                      slug=m.get("slug")
                      if not slug and m.get("url"):
                          parts=urllib.parse.urlparse(m["url"]).path.strip("/").split("/")
                          if "match" in parts:
                              i=parts.index("match")
                              if i+1<len(parts): slug=parts[i+1]
                      if not slug: 
                          row["detail_probes"].append({"fixture":m,"detail":"NO_SLUG"})
                          continue
                      try:
                          ds, dt, detail=get("/match/",{"sport":"football","slug":slug})
                          match=detail.get("match") if isinstance(detail,dict) else None
                          row["detail_probes"].append({
                              "slug":slug,"http_status":ds,"content_type":dt,
                              "envelope_keys":list(detail.keys()) if isinstance(detail,dict) else [],
                              "match_keys":list(match.keys()) if isinstance(match,dict) else [],
                              "match_sample":match,
                              "stats_present":bool(match and (match.get("stats") or match.get("statistics"))),
                              "stats_type":type(match.get("stats")).__name__ if isinstance(match,dict) else None,
                              "timeline_count":len(match.get("timeline") or match.get("events") or []) if isinstance(match,dict) and isinstance(match.get("timeline") or match.get("events") or [],list) else None,
                              "lineups_present":bool(match and match.get("lineups"))
                          })
                      except Exception as e:
                          row["detail_probes"].append({"slug":slug,"error":repr(e)})
              except Exception as e:
                  row["error"]=repr(e)
                  report["errors"].append({"date":date,"error":repr(e)})
              report["dates"][date]=row
              print(json.dumps({"date":date,"fixture_http":row.get("fixture_http"),"fixture_count":row.get("fixture_count"),"statuses":row.get("fixture_statuses"),"detail_summaries":[{"slug":x.get("slug"),"http_status":x.get("http_status"),"match_keys":x.get("match_keys"),"stats_present":x.get("stats_present"),"timeline_count":x.get("timeline_count"),"lineups_present":x.get("lineups_present"),"error":x.get("error")} for x in row.get("detail_probes",[])]},ensure_ascii=False))
          os.makedirs("sportscore-history-probe",exist_ok=True)
          with open("sportscore-history-probe/report.json","w",encoding="utf-8") as f: json.dump(report,f,ensure_ascii=False,indent=2)
          PY
      - name: Upload historical probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportscore-historical-archive-probe
          path: sportscore-history-probe/report.json
          if-no-files-found: warn
          retention-days: 14
