name: eSoccer FC27 archive collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: esoccer-fc27-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Import archive and update results
        run: python scripts/esoccer-fc27-collector.py
      - name: Commit archive
        run: |
          if git diff --quiet -- live-data-v2/esoccer-fc27; then
            echo "No eSoccer archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data-v2/esoccer-fc27
          git commit -m "Update eSoccer FC27 results archive"
          git push
