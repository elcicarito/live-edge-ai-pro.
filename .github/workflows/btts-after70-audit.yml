name: BTTS AFTER 70 ANALYSIS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btts-after70-audit.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Analyze BTTS goal timing (read-only)
        shell: bash
        run: |
          mkdir -p btts-output
          node <<'NODE'
          const fs = require("fs");
          const archive = JSON.parse(fs.readFileSync("data/btts-signal-archive.json", "utf8"));
          const signals = Array.isArray(archive.signals) ? archive.signals : [];
          const settled = signals.filter(s => ["WIN","LOSS"].includes(s.status));
          const minute = s => s.firstPredictedGoalMinute == null ? null : Number(s.firstPredictedGoalMinute);
          const rows = settled.map(s => {
            const m = minute(s);
            let classification = m == null ? (s.status === "WIN" ? "WIN_TIME_UNKNOWN" : "NO_GOAL") : m > 70 ? "AFTER_70" : "BY_70";
            return {
              signalId:s.signalId,matchId:String(s.matchId),home:s.home,away:s.away,competition:s.competition||"",
              tier:s.tier||"",tierKey:s.tierKey||"",startMinute:s.startMinute,startScore:s.startScore,
              predictedSide:s.predictedSide,predictedTeam:s.predictedTeam,status:s.status,settledScore:s.settledScore,
              firstPredictedGoalMinute:m,classification,createdAt:s.createdAt
            };
          });
          const pct=(n,d)=>d?Number((100*n/d).toFixed(1)):null;
          const tierMap={};
          for(const r of rows){
            const k=r.tier||r.tierKey||"unknown";
            tierMap[k]??={signals:0,wins:0,losses:0,after70:0,by70:0,noGoal:0,winTimeUnknown:0};
            const t=tierMap[k];t.signals++;
            if(r.status==="WIN")t.wins++;else t.losses++;
            if(r.classification==="AFTER_70")t.after70++;
            else if(r.classification==="BY_70")t.by70++;
            else if(r.classification==="NO_GOAL")t.noGoal++;
            else t.winTimeUnknown++;
          }
          for(const t of Object.values(tierMap)){t.winPct=pct(t.wins,t.signals);t.after70Pct=pct(t.after70,t.signals);}
          const byMatch=new Map();
          for(const r of rows){if(!byMatch.has(r.matchId))byMatch.set(r.matchId,[]);byMatch.get(r.matchId).push(r);}
          const matchRows=[...byMatch.entries()].map(([matchId,rs])=>{
            const first=rs.filter(r=>r.firstPredictedGoalMinute!=null).map(r=>r.firstPredictedGoalMinute);
            const rep=rs[0];
            return {matchId,home:rep.home,away:rep.away,competition:rep.competition,startScore:rep.startScore,
              predictedTeam:rep.predictedTeam,signalCount:rs.length,classification:
                rs.some(r=>r.classification==="AFTER_70")?"AFTER_70":
                rs.some(r=>r.classification==="BY_70")?"BY_70":
                rs.some(r=>r.classification==="WIN_TIME_UNKNOWN")?"WIN_TIME_UNKNOWN":"NO_GOAL",
              firstPredictedGoalMinute:first.length?Math.min(...first):null};
          });
          const after=rows.filter(r=>r.classification==="AFTER_70");
          const wins=rows.filter(r=>r.status==="WIN");
          const band={};
          for(const r of after){const m=r.firstPredictedGoalMinute,k=m<=75?"71-75":m<=80?"76-80":m<=85?"81-85":m<=90?"86-90":"90+";band[k]=(band[k]||0)+1;}
          const uniqueAfter=matchRows.filter(r=>r.classification==="AFTER_70").length;
          const summary={
            generatedAt:new Date().toISOString(),archiveUpdatedAt:archive.updated_at||null,
            totalSignals:signals.length,settledSignals:rows.length,wins:wins.length,losses:rows.length-wins.length,
            overallWinPct:pct(wins.length,rows.length),after70Signals:after.length,
            after70PctOfSignals:pct(after.length,rows.length),after70PctOfWins:pct(after.length,wins.length),
            by70Signals:rows.filter(r=>r.classification==="BY_70").length,
            noGoalSignals:rows.filter(r=>r.classification==="NO_GOAL").length,
            winTimeUnknown:rows.filter(r=>r.classification==="WIN_TIME_UNKNOWN").length,
            uniqueMatches:matchRows.length,uniqueMatchesAfter70:uniqueAfter,uniqueAfter70Pct:pct(uniqueAfter,matchRows.length),
            after70MinuteBands:band,byTier:tierMap,
            note:"After 70 means the first goal by the previously scoreless predicted team was after minute 70. Signal-level counts include repeated tiers; unique match counts deduplicate by matchId. Two WIN records can lack a goal event minute and are shown separately."
          };
          fs.writeFileSync("btts-output/btts-after70-summary.json",JSON.stringify(summary,null,2)+"\\n");
          const csv=(data,keys)=>[keys.join(","),...data.map(r=>keys.map(k=>'"'+String(r[k]??"").replace(/"/g,'""')+'"').join(","))].join("\\n")+"\\n";
          const cols=Object.keys(rows[0]||{});
          fs.writeFileSync("btts-output/btts-after70-signals.csv",csv(rows,cols));
          const mcols=Object.keys(matchRows[0]||{});
          fs.writeFileSync("btts-output/btts-after70-unique-matches.csv",csv(matchRows,mcols));
          console.log("BTTS AFTER 70 SUMMARY",JSON.stringify(summary,null,2));
          NODE
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: btts-after70-analysis
          path: btts-output/
          if-no-files-found: error
          retention-days: 14
