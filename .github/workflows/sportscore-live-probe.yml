name: SportScore LIVE data probe

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/sportscore-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe SportScore football feed
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, datetime, os, re
          base = "https://sportscore.com/api/widget"
          headers = {"User-Agent": "LIVE-EDGE-AI-PRO-SportScore-Probe/1.0", "Accept": "application/json"}
          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  raw = response.read()
                  return response.status, response.headers.get("content-type"), json.loads(raw.decode("utf-8"))
          report = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "SportScore public developer API",
              "feed": {}, "live_candidates": [], "detail_probes": [], "errors": []
          }
          try:
              status, ctype, payload = get("/matches/?sport=football&limit=50")
              matches = payload.get("matches") or payload.get("data") or []
              if isinstance(matches, dict):
                  matches = list(matches.values())
              if not isinstance(matches, list):
                  matches = []
              report["feed"] = {
                  "http_status": status, "content_type": ctype,
                  "top_level_keys": list(payload.keys()) if isinstance(payload, dict) else [],
                  "count_reported": payload.get("count") if isinstance(payload, dict) else None,
                  "records_received": len(matches),
                  "sample_record_keys": list(matches[0].keys()) if matches and isinstance(matches[0], dict) else [],
                  "sample_records": matches[:3]
              }
              live_words = {"live", "in_play", "in-play", "in progress", "in_progress", "1h", "2h", "ht", "half time", "halftime", "extra time", "penalties"}
              for m in matches:
                  if not isinstance(m, dict):
                      continue
                  st = str(m.get("status") or m.get("state") or m.get("match_status") or "").strip().lower()
                  if st in live_words or any(w in st for w in ("live", "in progress", "in_play", "in-play")):
                      report["live_candidates"].append({
                          "home": m.get("home") or m.get("home_team"),
                          "away": m.get("away") or m.get("away_team"),
                          "status": st, "score": [m.get("home_score"), m.get("away_score")],
                          "slug": m.get("slug") or m.get("match_slug"),
                          "id": m.get("id") or m.get("match_id")
                      })
              # Probe up to 3 match-detail records, prioritising live candidates.
              candidates = []
              for m in matches:
                  if isinstance(m, dict):
                      slug = m.get("slug") or m.get("match_slug")
                      if slug and slug not in candidates:
                          candidates.append(slug)
              for slug in candidates[:3]:
                  try:
                      ds, dt, detail = get("/match/?sport=football&slug=" + urllib.parse.quote(str(slug), safe=""))
                      report["detail_probes"].append({
                          "slug": slug, "http_status": ds, "content_type": dt,
                          "top_level_keys": list(detail.keys()) if isinstance(detail, dict) else [],
                          "detail_sample": detail
                      })
                  except Exception as e:
                      report["errors"].append({"detail_slug": slug, "error": repr(e)})
          except Exception as e:
              report["errors"].append({"feed_error": repr(e)})
          os.makedirs("sportscore-probe", exist_ok=True)
          with open("sportscore-probe/report.json", "w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print(json.dumps({
              "checked_at_utc": report["checked_at_utc"],
              "feed": report["feed"],
              "live_candidates": report["live_candidates"],
              "detail_probe_summaries": [
                  {"slug": x["slug"], "http_status": x["http_status"], "keys": x["top_level_keys"]}
                  for x in report["detail_probes"]
              ],
              "errors": report["errors"]
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportscore-live-probe
          path: sportscore-probe/report.json
          retention-days: 7
