name: API corners diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current LIVE tracker and extract data routes
        run: |
          mkdir -p diagnostic
          node <<'NODE'
          const fs = require('fs');
          const mainUrl = 'https://widgets-v2.thesports01.com/assets/index.021b287c.js';
          const repoData = 'https://raw.githubusercontent.com/elcicarito/live-edge-ai-pro./main/data/live-current.json';
          const report = { checked_at: new Date().toISOString(), fixtures: [], probes: {}, bundle: {} };
          const get = async (url, accept='*/*') => {
            const r = await fetch(url, {headers:{accept, 'user-agent':'Mozilla/5.0 LIVE-EDGE-DIAGNOSTIC'}});
            const body = await r.text(); let json=null; try { json=JSON.parse(body); } catch {}
            return {status:r.status, content_type:r.headers.get('content-type'), body:json ?? body, text:body};
          };
          (async()=>{
            const live = await get(repoData, 'application/json');
            if (live.status===200 && live.body?.records) report.fixtures = live.body.records.filter(x=>x.match?.status==='live').map(x=>({
              home:x.match.home, away:x.match.away, minute:x.match.live_minute,
              slug:(x.match.url||'').split('/').filter(Boolean).pop(), tracker:x.match.tracker
            }));
            for (const fx of report.fixtures.slice(0,8)) {
              const id=fx.tracker?.id || fx.slug;
              const urls = {
                tracker_widget:'https://sportscore.com/api/widget/tracker/?sport=football&id='+encodeURIComponent(id),
                tracker_api:'https://api.thesports01.com/api/widget/tracker/?sport=football&id='+encodeURIComponent(id),
                match_api:'https://api.thesports01.com/en/match/'+encodeURIComponent(id),
                match_api2:'https://api.thesports01.com/en/match-'+encodeURIComponent(id)
              };
              const key=fx.home+' vs '+fx.away; report.probes[key]={fixture:fx,results:{}};
              for (const [name,url] of Object.entries(urls)) {
                try {
                  const x=await get(url);
                  report.probes[key].results[name]={url,status:x.status,content_type:x.content_type,body:x.text.slice(0,12000)};
                  if(name==='tracker_widget' && x.status===200) {
                    const m=x.text.match(/iframe[^>]+src=["']([^"']+)/i);
                    if(m) {
                      const iframe=new URL(m[1].replace(/&amp;/g,'&'),url).href;
                      const page=await get(iframe,'text/html');
                      report.probes[key].results.tracker_iframe={url:iframe,status:page.status,body:page.text.slice(0,5000)};
                    }
                  }
                } catch(e) { report.probes[key].results[name]={url,error:String(e)}; }
              }
            }
            const b=await get(mainUrl,'application/javascript'); const src=b.text;
            report.bundle={url:mainUrl,status:b.status,bytes:src.length};
            fs.writeFileSync('diagnostic/tracker-main.js',src);
            const terms=['.subscribe(', 'subscribe(', 'mqttInstance', 'MQTT_API', 'HTTP_API', 'connect(', 'subscribeId', 'matchDetailData', 'homeScores', 'FBT_CORNER_KICK'];
            report.bundle.contexts={};
            for(const term of terms) {
              let pos=0,arr=[];
              while((pos=src.indexOf(term,pos))!==-1 && arr.length<35) {
                arr.push(src.slice(Math.max(0,pos-450),Math.min(src.length,pos+900))); pos+=term.length;
              }
              report.bundle.contexts[term]=arr;
            }
            report.bundle.routes=[...new Set((src.match(/["'`](?:\/[^"'` ]{2,}|https?:\/\/[^"'` ]+)["'`]/g)||[]).map(x=>x.slice(1,-1)).filter(x=>/api|match|tracker|live|event|stat|score|config|profile/i.test(x)))].slice(0,500);
            fs.writeFileSync('diagnostic/report.json',JSON.stringify(report,null,2));
            const summary=['# LIVE corners diagnostic','', 'LIVE fixtures probed: '+report.fixtures.length,
              ...Object.entries(report.probes).map(([n,v])=>'- '+n+': '+Object.entries(v.results).map(([k,r])=>k+'='+(r.status??'ERR')).join(', ')),
              '', 'Bundle HTTP '+b.status+', '+src.length+' bytes. MQTT/HTTP route contexts saved in artifact.'].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n'); console.log(summary);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload diagnostic bundle and report
        uses: actions/upload-artifact@v4
        with:
          name: sportscore-live-corners-diagnostic
          path: diagnostic/
          if-no-files-found: error
