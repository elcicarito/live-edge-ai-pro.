name: API corners diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Trace tracker page API calls and corner fields
        run: |
          mkdir -p diagnostic
          node <<'NODE'
          const fs=require('fs');
          const base='https://widgets-v2.thesports01.com';
          const repoData='https://raw.githubusercontent.com/elcicarito/live-edge-ai-pro./main/data/live-current.json';
          const get=async(url)=>{try{const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept':'*/*','referer':base+'/'}});
            return {status:r.status,type:r.headers.get('content-type'),text:await r.text()};}catch(e){return {error:String(e),text:''}}};
          (async()=>{
            const live=await get(repoData);let j={};try{j=JSON.parse(live.text)}catch{}
            const fx=(j.records||[]).find(x=>x.match?.tracker?.id)?.match;
            if(!fx)throw new Error('No live fixture with tracker id');
            const slug=(fx.url||'').split('/').filter(Boolean)[2],id=fx.tracker.id,profile=fx.tracker.profile;
            const page=await get(base+'/en/pro/football?profile='+encodeURIComponent(profile)+'&uuid='+encodeURIComponent(id));
            fs.writeFileSync('diagnostic/tracker-page.html',page.text);
            const assets=[...new Set([...page.text.matchAll(/(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']/g)].map(m=>new URL(m[1],base).href))];
            const bundles=[];
            const scan=async(url,label)=>{
              const x=await get(url);const name=(label||new URL(url).pathname.split('/').pop()||'asset.js').replace(/[^a-zA-Z0-9._-]/g,'_');
              fs.writeFileSync('diagnostic/'+name,x.text);
              const body=x.text;const terms=['mqtt','MQTT_API','subscribe','homeScores','corner','matchDetailData','api/widget','api/v1','/match/','tracker','profile','subscribeId','WebSocket','connectSocket','getMatch'];
              const contexts={};for(const t of terms){let p=0,a=[];while((p=body.toLowerCase().indexOf(t.toLowerCase(),p))>=0&&a.length<20){a.push(body.slice(Math.max(0,p-500),Math.min(body.length,p+1400)));p+=t.length;}contexts[t]=a;}
              bundles.push({url,status:x.status,bytes:body.length,contexts,jsImports:[...body.matchAll(/import\\(["']([^"']+\\.js)["']\\)/g)].map(m=>m[1])});
              return body;
            };
            let mainBody='';
            for(const url of assets){const body=await scan(url);if(url.includes('/assets/index.'))mainBody=body;}
            const seen=new Set(assets);
            const queue=[...new Set([...mainBody.matchAll(/import\\(["']([^"']+)["']\\)/g)].map(m=>m[1]))];
            let depth=0;
            while(queue.length&&depth<4){
              const batch=queue.splice(0,queue.length);depth++;
              for(const chunk of batch){
                if(!chunk||chunk.startsWith('data:')||chunk.endsWith('.css'))continue;
                const url=new URL(chunk,base+'/assets/').href;if(seen.has(url))continue;seen.add(url);
                const body=await scan(url,'chunk-'+chunk.split('/').pop());
                for(const m of body.matchAll(/import\\(["']([^"']+)["']\\)/g))if(!seen.has(new URL(m[1],url).href))queue.push(new URL(m[1],url).href);
              }
            }
            const result={fixture:{home:fx.home,away:fx.away,slug,id,profile},page_status:page.status,assets,bundles};
            fs.writeFileSync('diagnostic/tracker-runtime.json',JSON.stringify(result,null,2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,['# Tracker runtime source trace','Fixture: '+fx.home+' - '+fx.away,'Tracker page HTTP: '+page.status,'JS assets: '+assets.length,...bundles.map(x=>x.url+' '+x.status+' '+x.bytes+' bytes'),'Search contexts saved in artifact.'].join('\n')+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload runtime trace
        uses: actions/upload-artifact@v4
        with:
          name: sportscore-tracker-runtime-trace
          path: diagnostic/
          if-no-files-found: error
