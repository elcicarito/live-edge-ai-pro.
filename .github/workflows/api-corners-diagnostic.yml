name: API corners diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Compare match and tracker endpoints
        run: |
          mkdir -p diagnostic
          node <<'NODE'
          const fs = require('fs');
          const urls = {
            v1_match: 'https://sportscore.com/api/v1/match/?sport=football&slug=cs-herediano-vs-deportivo-saprissa',
            widget_match: 'https://sportscore.com/api/widget/match/?sport=football&slug=cs-herediano-vs-deportivo-saprissa',
            widget_tracker: 'https://sportscore.com/api/widget/tracker/?sport=football&id=n54qllhnyzd6qvy'
          };
          (async () => {
            const report = {};
            for (const [name, url] of Object.entries(urls)) {
              try {
                const response = await fetch(url, { headers: { accept: 'application/json' } });
                const body = await response.text();
                let parsed;
                try { parsed = JSON.parse(body); } catch { parsed = null; }
                report[name] = {
                  url,
                  status: response.status,
                  content_type: response.headers.get('content-type'),
                  body: parsed ?? body.slice(0, 20000)
                };
              } catch (error) {
                report[name] = { url, error: String(error) };
              }
            }
            const trackerHtml = String(report.widget_tracker?.body ?? '');
            const iframeMatch = trackerHtml.match(/<iframe[^>]+src=["']([^"']+)/i);
            if (iframeMatch) {
              const iframeUrl = iframeMatch[1].replace(/&amp;/g, '&');
              try {
                const response = await fetch(iframeUrl, { headers: { accept: 'text/html,application/xhtml+xml' } });
                const html = await response.text();
                report.tracker_iframe = { url: iframeUrl, status: response.status, content_type: response.headers.get('content-type'), body: html.slice(0, 50000) };
                const assetRefs = [...html.matchAll(/<(?:script|link)[^>]+(?:src|href)=["']([^"']+\.js[^"']*)["']/gi)].map(m => new URL(m[1], iframeUrl).href);
              const scriptUrls = [...new Set(assetRefs)].slice(0, 20);
                report.tracker_scripts = [];
                for (const scriptUrl of scriptUrls) {
                  try {
                    const scriptResponse = await fetch(scriptUrl);
                    const scriptBody = await scriptResponse.text();
                    const hits = [...scriptBody.matchAll(/.{0,160}(?:corner|corners|corner.?kick).{0,240}/gi)].slice(0, 25).map(m => m[0]);
                    const apiRefs = [...new Set(scriptBody.match(/["'`](?:\/[^"'` ]{2,}|https?:\/\/[^"'` ]+)["'`]/gi) || [])].map(x => x.slice(1, -1)).filter(x => /api|tracker|match|live|event|stat|score|socket|mqtt/i.test(x)).slice(0, 80);
                    const transportHits = [...scriptBody.matchAll(/.{0,220}(?:axios|XMLHttpRequest|WebSocket|mqtt|subscribe|baseURL|matchDetailData|homeScores|fetch\s*\().{0,300}/gi)].slice(0, 80).map(m => m[0]);
                    report.tracker_scripts.push({ url: scriptUrl, status: scriptResponse.status, bytes: scriptBody.length, corner_hits: hits, api_refs: apiRefs, transport_hits: transportHits });
                  } catch (error) {
                    report.tracker_scripts.push({ url: scriptUrl, error: String(error) });
                  }
                }
              } catch (error) {
                report.tracker_iframe = { url: iframeUrl, error: String(error) };
              }
            }
            fs.writeFileSync('diagnostic/endpoints.json', JSON.stringify(report, null, 2));
            const matches = [];
            function scan(value, path, depth = 0) {
              if (depth > 12 || value == null) return;
              if (Array.isArray(value)) {
                value.forEach((item, i) => scan(item, path + '[' + i + ']', depth + 1));
                return;
              }
              if (typeof value === 'object') {
                for (const [key, item] of Object.entries(value)) {
                  const next = path ? path + '.' + key : key;
                  if (/corner|corners|corner.?kick/i.test(key)) {
                    matches.push(next + ': ' + JSON.stringify(item).slice(0, 500));
                  }
                  scan(item, next, depth + 1);
                }
              }
            }
            for (const [name, result] of Object.entries(report)) scan(result.body, name);
            const scriptFindings = (report.tracker_scripts || []).flatMap(s => [
              ...(s.corner_hits || []).map(hit => ' - **' + s.url + '** corner: `' + hit.slice(0, 500) + '`'),
              ...(s.api_refs || []).map(hit => ' - **' + s.url + '** API ref: `' + hit.slice(0, 300) + '`'),
              ...(s.transport_hits || []).map(hit => ' - **' + s.url + '** transport: `' + hit.slice(0, 500) + '`'),
            ]);
            const summary = [
              '# SportScore API – diagnostika rohov',
              '',
              ...Object.entries(report).map(([name, result]) => '- **' + name + '**: HTTP ' + (result.status ?? 'ERROR') + (result.error ? ' – ' + result.error : '')),
              '',
              '## Nájdené polia súvisiace s rohmi',
              ...(matches.length ? matches.map(x => '- `' + x + '`') : ['- Nenašli sa žiadne polia s názvom obsahujúcim corner/corners/corner kick v JSON odpovediach.']),
              '',
              '## Nálezy v JavaScript bundle',
              ...(scriptFindings.length ? scriptFindings : ['- Bez zachytených corner výrazov alebo API referencií.']),
              '',
              'Kompletné odpovede sú uložené aj v artefakte `sportscore-api-diagnostic`.'
            ].join('\\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\\n');
            console.log(summary);
            for (const [name, result] of Object.entries(report)) {
              console.log(name, 'status=', result.status ?? 'ERROR');
              const text = JSON.stringify(result.body ?? result.error ?? '');
              console.log('body preview:', text.slice(0, 1800));
            }
          })();
          NODE
      - name: Upload raw diagnostic responses
        uses: actions/upload-artifact@v4
        with:
          name: sportscore-api-diagnostic
          path: diagnostic/endpoints.json
          if-no-files-found: error
