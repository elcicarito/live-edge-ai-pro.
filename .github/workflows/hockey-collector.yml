name: ESPN HOCKEY LIVE COLLECTOR

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-v2-hockey-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore latest live data snapshot
        run: |
          git fetch --depth=1 origin hockey-data-v2
          git checkout origin/hockey-data-v2 -- data/
      - name: Collect ESPN hockey competitions
        run: node scripts/hockey-collector.mjs
      - name: Commit hockey data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hockey-current.json data/hockey-archive.json data/hockey-collector-status.json
          if git diff --cached --quiet; then
            echo "No hockey data changes."
            exit 0
          fi
          git commit -m "Update ESPN hockey live data"
          git fetch --depth=1 origin hockey-data-v2
          git rebase --onto origin/hockey-data-v2 HEAD~1
          git push origin HEAD:hockey-data-v2
