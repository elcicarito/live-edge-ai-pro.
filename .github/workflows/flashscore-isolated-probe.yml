name: Flashscore isolated source probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashscore-isolated-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Live Edge test branch
        uses: actions/checkout@v4

      - name: Checkout pinned Flashscore scraper source
        uses: actions/checkout@v4
        with:
          repository: omkarcloud/flashscore-scraper
          ref: af784a918fc94339fd2c8ff0fadc1da69a6139d8
          path: .flashscore-scraper

      - name: Build isolated API image
        run: docker build -t live-edge-flashscore-probe .flashscore-scraper

      - name: Start local Flashscore API
        run: |
          docker run -d --rm --name flashscore-probe -p 127.0.0.1:8000:8000 live-edge-flashscore-probe
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health -o /tmp/flashscore-health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/flashscore-health.json
          python -m json.tool /tmp/flashscore-health.json

      - name: Probe football LIVE feed and one match statistics
        run: |
          python <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "http://127.0.0.1:8000"

          def get_json(path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = BASE + path + (("?" + query) if query else "")
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "LiveEdge-Flashscore-Probe/1.0"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")), len(raw), response.status

          health, health_bytes, health_status = get_json("/health")
          live, live_bytes, live_status = get_json("/matches/live", {"sport": "football"})
          today, today_bytes, today_status = get_json("/matches", {"sport": "football"})

          def collect_matches(payload):
              found = []
              if isinstance(payload, dict):
                  if isinstance(payload.get("matches"), list):
                      found.extend(x for x in payload["matches"] if isinstance(x, dict))
                  for competition in payload.get("competitions", []) or []:
                      if isinstance(competition, dict):
                          found.extend(x for x in (competition.get("matches") or []) if isinstance(x, dict))
              return found

          live_matches = collect_matches(live)
          today_matches = collect_matches(today)

          report = {
              "tested_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "api_health": health.get("status"),
              "health_http": health_status,
              "live_http": live_status,
              "today_http": today_status,
              "live_match_count_reported": live.get("match_count", live.get("count")),
              "live_match_count_parsed": len(live_matches),
              "today_match_count_reported": today.get("match_count", today.get("count")),
              "today_match_count_parsed": len(today_matches),
              "live_response_bytes": live_bytes,
              "today_response_bytes": today_bytes,
              "sample_live_match": None,
              "sample_statistics": None,
              "errors": []
          }

          inspected = []
          statistics_success = None
          for match in [m for m in live_matches if m.get("id")][:8]:
              item = {
                  "id": match.get("id"),
                  "home": (match.get("home") or {}).get("name") if isinstance(match.get("home"), dict) else match.get("home"),
                  "away": (match.get("away") or {}).get("name") if isinstance(match.get("away"), dict) else match.get("away"),
                  "home_score": match.get("home_score"),
                  "away_score": match.get("away_score"),
                  "status": match.get("status")
              }
              try:
                  details, details_bytes, details_status = get_json("/matches/details", {"match": match["id"]})
                  available_tabs = details.get("available_tabs", []) if isinstance(details, dict) else []
                  item["details_http"] = details_status
                  item["details_bytes"] = details_bytes
                  item["available_tabs"] = available_tabs
                  if "statistics" in available_tabs:
                      try:
                          stats, stats_bytes, stats_status = get_json("/matches/statistics", {"match": match["id"]})
                          stats_info = {
                              "http": stats_status,
                              "bytes": stats_bytes,
                              "top_level_keys": list(stats.keys())[:25] if isinstance(stats, dict) else [],
                              "has_data": bool(stats)
                          }
                          item["statistics"] = stats_info
                          if stats_status == 200 and bool(stats):
                              statistics_success = {"match_id": match["id"], **stats_info}
                      except Exception as exc:
                          item["statistics_error"] = type(exc).__name__ + ": " + str(exc)[:300]
                          report["errors"].append("statistics " + str(match.get("id")) + ": " + item["statistics_error"])
              except Exception as exc:
                  item["details_error"] = type(exc).__name__ + ": " + str(exc)[:300]
                  report["errors"].append("details " + str(match.get("id")) + ": " + item["details_error"])
              inspected.append(item)
              if statistics_success:
                  break

          report["inspected_live_matches"] = inspected
          report["statistics_match_found"] = statistics_success
          if not live_matches:
              report["sample_statistics"] = {"skipped": "no live football match at probe time"}
          elif not statistics_success:
              report["sample_statistics"] = {"skipped": "none of the inspected live matches advertised usable statistics"}
          else:
              report["sample_statistics"] = statistics_success

          print("FLASHSCORE_PROBE_REPORT=" + json.dumps(report, ensure_ascii=False))
          if health_status != 200 or live_status != 200 or today_status != 200:
              raise SystemExit("One or more core Flashscore endpoints did not return HTTP 200")
          PY

      - name: Stop isolated API
        if: always()
        run: docker logs flashscore-probe 2>&1 | tail -n 120 || true
