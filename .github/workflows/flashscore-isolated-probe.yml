name: Flashscore isolated source probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashscore-isolated-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Live Edge test branch
        uses: actions/checkout@v4

      - name: Checkout pinned Flashscore scraper source
        uses: actions/checkout@v4
        with:
          repository: omkarcloud/flashscore-scraper
          ref: af784a918fc94339fd2c8ff0fadc1da69a6139d8
          path: .flashscore-scraper

      - name: Build isolated API image
        run: docker build -t live-edge-flashscore-probe .flashscore-scraper

      - name: Start local Flashscore API
        run: |
          docker run -d --rm --name flashscore-probe -p 127.0.0.1:8000:8000 live-edge-flashscore-probe
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health -o /tmp/flashscore-health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/flashscore-health.json
          python -m json.tool /tmp/flashscore-health.json

      - name: Probe football LIVE feed and one match statistics
        run: |
          python <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "http://127.0.0.1:8000"

          def get_json(path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = BASE + path + (("?" + query) if query else "")
              request = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "LiveEdge-Flashscore-Probe/1.0"}
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")), len(raw), response.status

          health, health_bytes, health_status = get_json("/health")
          live, live_bytes, live_status = get_json("/matches/live", {"sport": "football"})
          today, today_bytes, today_status = get_json("/matches", {"sport": "football"})

          def collect_matches(payload):
              found = []
              if isinstance(payload, dict):
                  if isinstance(payload.get("matches"), list):
                      found.extend(x for x in payload["matches"] if isinstance(x, dict))
                  for competition in payload.get("competitions", []) or []:
                      if isinstance(competition, dict):
                          found.extend(x for x in (competition.get("matches") or []) if isinstance(x, dict))
              return found

          live_matches = collect_matches(live)
          today_matches = collect_matches(today)

          report = {
              "tested_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "api_health": health.get("status"),
              "health_http": health_status,
              "live_http": live_status,
              "today_http": today_status,
              "live_match_count_reported": live.get("match_count", live.get("count")),
              "live_match_count_parsed": len(live_matches),
              "today_match_count_reported": today.get("match_count", today.get("count")),
              "today_match_count_parsed": len(today_matches),
              "live_response_bytes": live_bytes,
              "today_response_bytes": today_bytes,
              "sample_live_match": None,
              "sample_statistics": None,
              "errors": []
          }

          inspected = []
          usable_statistics = None
          statistics_matches = []
          for match in [m for m in live_matches if m.get("id")][:8]:
              item = {
                  "id": match.get("id"),
                  "home": (match.get("home") or {}).get("name") if isinstance(match.get("home"), dict) else match.get("home"),
                  "away": (match.get("away") or {}).get("name") if isinstance(match.get("away"), dict) else match.get("away"),
                  "home_score": match.get("home_score"),
                  "away_score": match.get("away_score"),
                  "status": match.get("status")
              }
              try:
                  details, details_bytes, details_status = get_json("/matches/details", {"match": match["id"]})
                  available_tabs = details.get("available_tabs", []) if isinstance(details, dict) else []
                  item["details_http"] = details_status
                  item["details_bytes"] = details_bytes
                  item["available_tabs"] = available_tabs
                  item["has_statistics"] = details.get("has_statistics") if isinstance(details, dict) else None
                  item["has_player_statistics"] = details.get("has_player_statistics") if isinstance(details, dict) else None

                  # Try the match-level endpoint even if the tab list omits it:
                  # the page exposes a separate has_statistics flag.
                  try:
                      stats, stats_bytes, stats_status = get_json("/matches/statistics", {"match": match["id"]})
                      stat_periods = stats.get("periods", []) if isinstance(stats, dict) else []
                      stat_rows = [
                          {"period": period.get("period"), "category": group.get("category"),
                           "name": row.get("name"), "home": row.get("home"), "away": row.get("away")}
                          for period in stat_periods if isinstance(period, dict)
                          for group in period.get("groups", []) if isinstance(group, dict)
                          for row in group.get("statistics", []) if isinstance(row, dict)
                      ]
                      stat_count = len(stat_rows)
                      item["match_statistics"] = {
                          "http": stats_status,
                          "bytes": stats_bytes,
                          "period_count": stats.get("period_count") if isinstance(stats, dict) else None,
                          "statistic_count": stat_count,
                          "has_data": stat_count > 0,
                          "sample_rows": stat_rows[:20]
                      }
                      if stats_status == 200 and stat_count > 0:
                          candidate = {"match_id": match["id"], "kind": "match", **item["match_statistics"]}
                          statistics_matches.append(candidate)
                          if usable_statistics is None:
                              usable_statistics = candidate
                  except Exception as exc:
                      item["match_statistics_error"] = type(exc).__name__ + ": " + str(exc)[:250]
                      report["errors"].append("match statistics " + str(match.get("id")) + ": " + item["match_statistics_error"])

                  if details.get("has_player_statistics") or "player_statistics" in available_tabs:
                      try:
                          player_stats, player_bytes, player_status = get_json("/matches/player-statistics", {"match": match["id"]})
                          player_count = player_stats.get("player_count", 0) if isinstance(player_stats, dict) else 0
                          item["player_statistics"] = {
                              "http": player_status,
                              "bytes": player_bytes,
                              "player_count": player_count,
                              "has_data": player_count > 0
                          }
                          if player_status == 200 and player_count > 0 and not usable_statistics:
                              usable_statistics = {"match_id": match["id"], "kind": "player", **item["player_statistics"]}
                      except Exception as exc:
                          item["player_statistics_error"] = type(exc).__name__ + ": " + str(exc)[:250]
                          report["errors"].append("player statistics " + str(match.get("id")) + ": " + item["player_statistics_error"])
              except Exception as exc:
                  item["details_error"] = type(exc).__name__ + ": " + str(exc)[:250]
                  report["errors"].append("details " + str(match.get("id")) + ": " + item["details_error"])
              inspected.append(item)

          report["inspected_live_matches"] = inspected
          report["matches_with_statistics"] = len(statistics_matches)
          report["statistics_coverage_checked"] = len(inspected)
          report["usable_statistics_found"] = usable_statistics

          # Re-fetch the first match with statistics after 30 seconds to verify
          # that values are refreshed rather than being a static snapshot.
          if usable_statistics:
              time.sleep(30)
              try:
                  refreshed, refreshed_bytes, refreshed_status = get_json(
                      "/matches/statistics", {"match": usable_statistics["match_id"]}
                  )
                  refreshed_periods = refreshed.get("periods", []) if isinstance(refreshed, dict) else []
                  refreshed_rows = [
                      {"period": period.get("period"), "category": group.get("category"),
                       "name": row.get("name"), "home": row.get("home"), "away": row.get("away")}
                      for period in refreshed_periods if isinstance(period, dict)
                      for group in period.get("groups", []) if isinstance(group, dict)
                      for row in group.get("statistics", []) if isinstance(row, dict)
                  ]
                  report["live_refresh_check"] = {
                      "match_id": usable_statistics["match_id"],
                      "http": refreshed_status,
                      "bytes": refreshed_bytes,
                      "statistic_count": len(refreshed_rows),
                      "sample_rows": refreshed_rows[:20],
                      "values_changed": refreshed_rows != usable_statistics.get("sample_rows", [])
                  }
              except Exception as exc:
                  report["live_refresh_check"] = {"error": type(exc).__name__ + ": " + str(exc)[:250]}
          if not live_matches:
              report["sample_statistics"] = {"skipped": "no live football match at probe time"}
          elif not usable_statistics:
              report["sample_statistics"] = {"skipped": "no non-empty team or player statistics found in inspected live matches"}
          else:
              report["sample_statistics"] = usable_statistics

          # Compare Flashscore LIVE fixtures with the latest committed ESPN snapshot.
          try:
              with open("data/live-current.json", "r", encoding="utf-8") as handle:
                  espn_snapshot = json.load(handle)
              import re
              import unicodedata
              from datetime import datetime, timezone

              def norm_team(value):
                  if isinstance(value, dict):
                      value = value.get("name") or value.get("displayName") or ""
                  value = unicodedata.normalize("NFKD", str(value or ""))
                  value = "".join(ch for ch in value if not unicodedata.combining(ch))
                  return re.sub(r"[^a-z0-9]+", "", value.lower())

              def key_for(home, away):
                  h, a = norm_team(home), norm_team(away)
                  return (h, a) if h and a else None

              espn_fixtures = []
              for record in (espn_snapshot.get("records", []) or []):
                  match = record.get("match", record) if isinstance(record, dict) else {}
                  if not isinstance(match, dict) or str(match.get("status") or "").lower() not in ("live", "inplay", "in_play"):
                      continue
                  key = key_for(match.get("home"), match.get("away"))
                  if key:
                      espn_fixtures.append({"key": key, "home": match.get("home"), "away": match.get("away")})

              flash_fixtures = []
              for match in live_matches:
                  home = match.get("home", {})
                  away = match.get("away", {})
                  home = home.get("name") if isinstance(home, dict) else home
                  away = away.get("name") if isinstance(away, dict) else away
                  key = key_for(home, away)
                  if key:
                      flash_fixtures.append({"key": key, "home": home, "away": away})

              espn_keys = {fixture["key"] for fixture in espn_fixtures}
              flash_keys = {fixture["key"] for fixture in flash_fixtures}
              snapshot_time = espn_snapshot.get("collected_at")
              snapshot_age_seconds = None
              if snapshot_time:
                  parsed_time = datetime.fromisoformat(snapshot_time.replace("Z", "+00:00"))
                  snapshot_age_seconds = round((datetime.now(timezone.utc) - parsed_time).total_seconds())

              report["provider_comparison"] = {
                  "comparison_basis": "committed ESPN snapshot vs current Flashscore LIVE feed",
                  "espn_snapshot_collected_at": snapshot_time,
                  "espn_snapshot_age_seconds": snapshot_age_seconds,
                  "espn_live_count": len(espn_fixtures),
                  "flashscore_live_count": len(flash_fixtures),
                  "matched_count": len(espn_keys & flash_keys),
                  "flashscore_only_count": len(flash_keys - espn_keys),
                  "espn_only_count": len(espn_keys - flash_keys),
                  "flashscore_only": [{"home": f["home"], "away": f["away"]} for f in flash_fixtures if f["key"] not in espn_keys],
                  "espn_only": [{"home": f["home"], "away": f["away"]} for f in espn_fixtures if f["key"] not in flash_keys]
              }
          except Exception as exc:
              report["provider_comparison"] = {"error": type(exc).__name__ + ": " + str(exc)[:250]}

          print("FLASHSCORE_PROBE_REPORT=" + json.dumps(report, ensure_ascii=False))
          if health_status != 200 or live_status != 200 or today_status != 200:
              raise SystemExit("One or more core Flashscore endpoints did not return HTTP 200")
          PY

      - name: Stop isolated API
        if: always()
        run: docker logs flashscore-probe 2>&1 | tail -n 120 || true
