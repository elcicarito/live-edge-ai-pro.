name: eSoccer Flashscore live probe

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: esoccer-flashscore-live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout LIVE EDGE AI PRO
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout pinned Flashscore scraper
        run: |
          git clone https://github.com/omkarcloud/flashscore-scraper.git /tmp/flashscore-scraper
          git -C /tmp/flashscore-scraper checkout 6b8a517381576b7a7a0f45ad4a23a9780fa26b72
      - name: Install scraper dependencies
        run: python -m pip install -r /tmp/flashscore-scraper/requirements.txt
      - name: Probe Flashscore eSports live feed
        env:
          FLASHSCORE_SCRAPER_PATH: /tmp/flashscore-scraper
        run: python scripts/esoccer-flashscore-probe.py
      - name: Publish diagnostic data
        run: |
          if git diff --quiet -- live-data-v2/esoccer-fc27/flashscore-live.json live-data-v2/esoccer-fc27/flashscore-status.json; then
            echo "No Flashscore eSports changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data-v2/esoccer-fc27/flashscore-live.json live-data-v2/esoccer-fc27/flashscore-status.json
          git commit -m "Update eSoccer Flashscore live probe"
          git push
