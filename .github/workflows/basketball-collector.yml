name: LIVE EDGE BASKETBALL COLLECTOR

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-basketball-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect LIVE basketball data
        run: |
          mkdir -p data
          node <<'NODE'
          const fs = require("fs");
          const BASE = "https://sportscore.com/api/widget";
          const CURRENT = "data/basketball-current.json";
          const HISTORY = "data/basketball-history.jsonl";
          const ARCHIVE = "data/basketball-archive.json";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function getJSON(url, attempts = 5) {
            let lastError;
            for (let i = 1; i <= attempts; i++) {
              try {
                const response = await fetch(url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now(), {
                  headers: {
                    "User-Agent": "LIVE-EDGE-AI-PRO-BASKETBALL/1.0",
                    "Accept": "application/json",
                    "Cache-Control": "no-cache, no-store"
                  },
                  cache: "no-store",
                  signal: AbortSignal.timeout(20000)
                });
                if (!response.ok) throw new Error("HTTP " + response.status);
                return await response.json();
              } catch (error) {
                lastError = error;
                console.log("Pokus " + i + "/" + attempts + ": " + error.message);
                if (i < attempts) await sleep(i * 2000);
              }
            }
            throw lastError;
          }

          function statusOf(match) {
            const s = match?.status;
            if (typeof s === "string") return s.toLowerCase().trim();
            if (s && typeof s === "object") {
              return String(s.type || s.name || s.short || s.description || "").toLowerCase().trim();
            }
            return String(match?.status_text || match?.statusText || "").toLowerCase().trim();
          }

          function isLive(match) {
            const s = statusOf(match).replace(/[\s_-]+/g, "");
            return [
              "live", "inplay", "inprogress", "playing",
              "q1", "q2", "q3", "q4", "ot", "overtime",
              "halftime", "break", "period1", "period2", "period3", "period4"
            ].includes(s) || s.includes("inprogress") || s.includes("live");
          }

          async function main() {
            const started = new Date().toISOString();
            console.log("LIVE EDGE BASKETBALL COLLECTOR");
            // Primárny zdroj: aktuálne LIVE zápasy pre dnešný UTC dátum.
            // Widget endpoint ponechávame ako záložný zdroj, ak fixtures API zlyhá.
            const todayUTC = new Date().toISOString().slice(0, 10);
            const liveUrl = "https://sportscore.com/api/v1/fixtures/?sport=basketball&date=" + todayUTC + "&status=live&limit=50";
            let payload;
            let source;
            try {
              payload = await getJSON(liveUrl);
              if (!payload || !Array.isArray(payload.matches)) {
                throw new Error("Fixtures API nevrátilo platné pole matches");
              }
              source = "SportScore API fixtures (today, live)";
              console.log("Primárny LIVE fixtures API: HTTP 200");
              console.log("Zápasy z LIVE fixtures API:", payload.matches.length);
              console.log("Stavy z LIVE fixtures API:", [...new Set(payload.matches.map(statusOf).filter(Boolean))].join(", ") || "none");
              console.log("Kľúče prvého LIVE záznamu:", payload.matches[0] ? Object.keys(payload.matches[0]).join(", ") : "žiadne");
            } catch (primaryError) {
              console.log("LIVE fixtures API zlyhalo, skúšam záložný widget zdroj:", primaryError.message);
              payload = await getJSON(BASE + "/matches/?sport=basketball&limit=50");
              if (!payload || !Array.isArray(payload.matches)) {
                throw new Error("Basketball API nevrátilo platné pole matches; staré dáta zostávajú zachované.");
              }
              source = "SportScore API widget (fallback)";
            }

            const matches = payload.matches;
            const liveMatches = matches.filter(isLive);
            // SportScore match pages contain quarter-by-quarter points even when the JSON API omits them.
            // Parse only explicit Q1-Q4 stat blocks; never infer missing scores.
            async function getQuarterScores(match) {
              const rawUrl = String(match?.url || "");
              if (!rawUrl) return null;
              const pageUrl = rawUrl.startsWith("http") ? rawUrl : "https://sportscore.com" + (rawUrl.startsWith("/") ? rawUrl : "/" + rawUrl);
              const response = await fetch(pageUrl, {
                headers: { "User-Agent": "Mozilla/5.0 LIVE-EDGE-AI-PRO", "Accept": "text/html" },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw new Error("Match page HTTP " + response.status);
              const html = await response.text();
              const home = [];
              const away = [];
              for (let q = 1; q <= 4; q++) {
                const marker = "Q" + q + " Points";
                const at = html.indexOf(marker);
                if (at < 0) continue;
                const block = html.slice(at, at + 1400);
                const homeMatch = block.match(/class=["']home-val["'][^>]*>\s*(\d+)/i);
                const awayMatch = block.match(/class=["']away-val["'][^>]*>\s*(\d+)/i);
                if (homeMatch && awayMatch) {
                  home[q - 1] = Number(homeMatch[1]);
                  away[q - 1] = Number(awayMatch[1]);
                }
              }
              if (!home.some(Number.isFinite) && !away.some(Number.isFinite)) return null;
              return {
                home: home.map(v => Number.isFinite(v) ? v : null),
                away: away.map(v => Number.isFinite(v) ? v : null)
              };
            }

            async function enrichQuarterScores(list, concurrency = 4) {
              const output = list.slice();
              let next = 0;
              async function worker() {
                while (next < output.length) {
                  const index = next++;
                  const match = output[index];
                  try {
                    const quarters = await getQuarterScores(match);
                    if (quarters) {
                      output[index] = {
                        ...match,
                        period_scores: quarters,
                        quarter_scores_source: "SportScore match page",
                        quarter_scores_checked_at: new Date().toISOString()
                      };
                      console.log("QUARTER SCORES OK:", match.home || match.home_name, "-", match.away || match.away_name, JSON.stringify(quarters));
                    } else {
                      output[index] = { ...match, quarter_scores_checked_at: new Date().toISOString() };
                      console.log("QUARTER SCORES not present:", match.url || match.id);
                    }
                  } catch (error) {
                    console.log("QUARTER SCORES failed:", match.url || match.id, error.message);
                  }
                }
              }
              await Promise.all(Array.from({ length: Math.min(concurrency, output.length) }, () => worker()));
              return output;
            }

            const enrichedLiveMatches = await enrichQuarterScores(liveMatches, 4);
            const liveById = new Map(enrichedLiveMatches.map(m => [String(m.id || m.slug || m.url || ""), m]));
            const enrichedMatches = matches.map(m => liveById.get(String(m.id || m.slug || m.url || "")) || m);
            console.log("LIVE zápasy s dostupným rozpisom štvrtín:", enrichedLiveMatches.filter(m => m.period_scores).length, "/", enrichedLiveMatches.length);
            const now = new Date().toISOString();

            // Finished games are collected separately so they remain available after leaving LIVE.
            let finishedMatches = [];
            try {
              const finishedUrl = "https://sportscore.com/api/v1/fixtures/?sport=basketball&date=" + todayUTC + "&status=finished&limit=200";
              const finishedPayload = await getJSON(finishedUrl);
              if (finishedPayload && Array.isArray(finishedPayload.matches)) {
                finishedMatches = finishedPayload.matches;
                console.log("Ukončené zápasy načítané:", finishedMatches.length);
              }
            } catch (archiveError) {
              console.log("Upozornenie: archívne výsledky sa nepodarilo načítať:", archiveError.message);
            }

            let archive = [];
            try {
              const oldArchive = JSON.parse(fs.readFileSync(ARCHIVE, "utf8"));
              if (Array.isArray(oldArchive.matches)) archive = oldArchive.matches;
            } catch (_) {}
            const archiveById = new Map(archive.map(m => [String(m.id || m.slug || m.url || ""), m]));
            // Enrich a small batch of finished games missing quarter data on each run.
            // Failed/empty pages are retried after six hours to avoid hammering the provider.
            const finishedNeedingQuarters = finishedMatches.filter(match => {
              const id = String(match.id || match.slug || match.url || "");
              const existing = archiveById.get(id) || {};
              if (existing.period_scores?.home || existing.period_scores?.away) return false;
              const checked = Date.parse(existing.quarter_scores_checked_at || "");
              return !Number.isFinite(checked) || Date.now() - checked > 6 * 60 * 60 * 1000;
            }).slice(0, 8);
            const enrichedFinishedBatch = await enrichQuarterScores(finishedNeedingQuarters, 4);
            const enrichedFinishedById = new Map(enrichedFinishedBatch.map(m => [String(m.id || m.slug || m.url || ""), m]));
            for (const match of finishedMatches) {
              const id = String(match.id || match.slug || match.url || "");
              if (!id) continue;
              const existing = archiveById.get(id) || {};
              const enriched = enrichedFinishedById.get(id);
              archiveById.set(id, {
                ...existing,
                ...match,
                ...(enriched?.period_scores ? {
                  period_scores: enriched.period_scores,
                  quarter_scores_source: enriched.quarter_scores_source,
                  quarter_scores_checked_at: enriched.quarter_scores_checked_at
                } : {}),
                ...(enriched && !enriched.period_scores ? { quarter_scores_checked_at: enriched.quarter_scores_checked_at } : {}),
                status: "finished",
                archived_at: existing.archived_at || now
              });
            }
            archive = [...archiveById.values()]
              .sort((a, b) => String(b.archived_at || b.time || "").localeCompare(String(a.archived_at || a.time || "")))
              .slice(0, 1000);
            fs.writeFileSync(ARCHIVE, JSON.stringify({
              sport: "basketball",
              updated_at: now,
              count: archive.length,
              matches: archive
            }, null, 2) + "\n");
            const output = {
              schema_version: 1,
              sport: "basketball",
              source,
              collected_at: now,
              collection_started_at: started,
              data_status: "complete",
              collection_complete: true,
              fixture_count: matches.length,
              live_count: liveMatches.length,
              matches: enrichedMatches,
              live_matches: enrichedLiveMatches
            };

            fs.writeFileSync(CURRENT, JSON.stringify(output, null, 2) + "\n");

            const line = JSON.stringify({
              collected_at: now,
              fixture_count: matches.length,
              live_count: liveMatches.length,
              match_ids: liveMatches.map(m => String(m.id || m.slug || m.url || "")).filter(Boolean)
            });
            fs.appendFileSync(HISTORY, line + "\n");

            const lines = fs.readFileSync(HISTORY, "utf8").trim().split("\n").filter(Boolean);
            fs.writeFileSync(HISTORY, lines.slice(-2016).join("\n") + "\n");

            console.log("Zápasy v odpovedi API:", matches.length);
            console.log("Rozpoznané LIVE zápasy:", liveMatches.length);
            console.log("Kľúče prvého záznamu:", matches[0] ? Object.keys(matches[0]).join(", ") : "žiadne");
            console.log("Basketbalové dáta uložené:", CURRENT);
          }

          main().catch(error => {
            console.error("BASKETBALL COLLECTOR ERROR:", error);
            process.exit(1);
          });
          NODE

      - name: Commit basketball data
        run: |
          if git diff --quiet -- data/basketball-current.json data/basketball-history.jsonl data/basketball-archive.json; then
            echo "Basketball data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/basketball-current.json data/basketball-history.jsonl data/basketball-archive.json
          git commit -m "Update LIVE basketball data"
          # Football and basketball collectors can commit near-simultaneously.
          # Rebase our basketball-only commit onto the latest main before pushing.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict, retry ${attempt}/3"
            sleep 2
          done
          echo "Unable to push basketball data after three retries."
          exit 1
