name: LIVE EDGE BASKETBALL COLLECTOR

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-edge-basketball-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect LIVE basketball data
        run: |
          mkdir -p data
          node <<'NODE'
          const fs = require("fs");
          const BASE = "https://sportscore.com/api/widget";
          const CURRENT = "data/basketball-current.json";
          const HISTORY = "data/basketball-history.jsonl";
          const ARCHIVE = "data/basketball-archive.json";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const collectorMetrics = {
            started_at: new Date().toISOString(),
            request_count: 0,
            success_count: 0,
            failure_count: 0,
            http_429_count: 0,
            http_5xx_count: 0,
            retry_count: 0,
            network_error_count: 0,
            parse_error_count: 0,
            endpoint_counts: {}
          };

          function metricEndpoint(rawUrl) {
            try {
              const pathname = new URL(rawUrl).pathname;
              if (pathname.includes("/fixtures/")) return "fixtures";
              if (pathname.includes("/matches/")) return "widget_matches";
              return pathname || "other";
            } catch {
              return "other";
            }
          }

          function countMetric(endpoint, key) {
            if (!collectorMetrics.endpoint_counts[endpoint]) {
              collectorMetrics.endpoint_counts[endpoint] = {
                requests: 0, successes: 0, failures: 0
              };
            }
            collectorMetrics.endpoint_counts[endpoint][key]++;
          }

          async function getJSON(url, attempts = 5) {
            let lastError;
            for (let i = 1; i <= attempts; i++) {
              const endpoint = metricEndpoint(url);
              collectorMetrics.request_count++;
              countMetric(endpoint, "requests");
              let responseReceived = false;
              try {
                const response = await fetch(url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now(), {
                  headers: {
                    "User-Agent": "LIVE-EDGE-AI-PRO-BASKETBALL/1.0",
                    "Accept": "application/json",
                    "Cache-Control": "no-cache, no-store"
                  },
                  cache: "no-store",
                  signal: AbortSignal.timeout(20000)
                });
                responseReceived = true;
                if (!response.ok) {
                  collectorMetrics.failure_count++;
                  countMetric(endpoint, "failures");
                  if (response.status === 429) collectorMetrics.http_429_count++;
                  if (response.status >= 500) collectorMetrics.http_5xx_count++;
                  const error = new Error("HTTP " + response.status);
                  error.status = response.status;
                  throw error;
                }
                collectorMetrics.success_count++;
                countMetric(endpoint, "successes");
                return await response.json();
              } catch (error) {
                lastError = error;
                if (!error.status) {
                  collectorMetrics.failure_count++;
                  countMetric(endpoint, "failures");
                  if (responseReceived) {
                    collectorMetrics.parse_error_count++;
                  } else {
                    collectorMetrics.network_error_count++;
                  }
                }
                console.log("Pokus " + i + "/" + attempts + ": " + error.message);
                if (i < attempts) {
                  collectorMetrics.retry_count++;
                  await sleep(i * 2000);
                }
              }
            }
            throw lastError;
          }

          function statusOf(match) {
            const s = match?.status;
            if (typeof s === "string") return s.toLowerCase().trim();
            if (s && typeof s === "object") {
              return String(s.type || s.name || s.short || s.description || "").toLowerCase().trim();
            }
            return String(match?.status_text || match?.statusText || "").toLowerCase().trim();
          }
 
          function formatOf(match) {
            const league = String(match?.competition?.name || match?.league?.name || match?.competition || match?.league || "").toLowerCase();
            const teams = [match?.home || match?.home_name || "", match?.away || match?.away_name || ""].join(" ").toLowerCase();
            const ncaa = /ncaa|national collegiate athletic association/.test(league);
            const women = /women|woman|ladies|lady|female|wbb/.test(league) || /women|lady|ladies/.test(teams);
            return ncaa && !women ? "halves" : "quarters";
          }
          const periodCount = match => formatOf(match) === "halves" ? 2 : 4;

          function isLive(match) {
            const s = statusOf(match).replace(/[\s_-]+/g, "");
            return [
              "live", "inplay", "inprogress", "playing",
              "q1", "q2", "q3", "q4", "ot", "overtime",
              "halftime", "break", "period1", "period2", "period3", "period4"
            ].includes(s) || s.includes("inprogress") || s.includes("live");
          }

          async function main() {
            const started = new Date().toISOString();
            console.log("LIVE EDGE BASKETBALL COLLECTOR");
            // Primárny zdroj: aktuálne LIVE zápasy pre dnešný UTC dátum.
            // Widget endpoint ponechávame ako záložný zdroj, ak fixtures API zlyhá.
            const todayUTC = new Date().toISOString().slice(0, 10);
            const liveUrl = "https://sportscore.com/api/v1/fixtures/?sport=basketball&date=" + todayUTC + "&status=live&limit=50";
            let payload;
            let source;
            try {
              payload = await getJSON(liveUrl);
              if (!payload || !Array.isArray(payload.matches)) {
                throw new Error("Fixtures API nevrátilo platné pole matches");
              }
              source = "SportScore API fixtures (today, live)";
              console.log("Primárny LIVE fixtures API: HTTP 200");
              console.log("Zápasy z LIVE fixtures API:", payload.matches.length);
              console.log("Stavy z LIVE fixtures API:", [...new Set(payload.matches.map(statusOf).filter(Boolean))].join(", ") || "none");
              console.log("Kľúče prvého LIVE záznamu:", payload.matches[0] ? Object.keys(payload.matches[0]).join(", ") : "žiadne");
            } catch (primaryError) {
              console.log("LIVE fixtures API zlyhalo, skúšam záložný widget zdroj:", primaryError.message);
              payload = await getJSON(BASE + "/matches/?sport=basketball&limit=50");
              if (!payload || !Array.isArray(payload.matches)) {
                throw new Error("Basketball API nevrátilo platné pole matches; staré dáta zostávajú zachované.");
              }
              source = "SportScore API widget (fallback)";
            }

            const matches = payload.matches;
            const liveMatches = matches.filter(isLive);
            // SportScore match pages contain quarter-by-quarter points even when the JSON API omits them.
            // Parse only explicit Q1-Q4 stat blocks; never infer missing scores.
            async function getQuarterScores(match) {
              const rawUrl = String(match?.url || "");
              if (!rawUrl) return null;
              const pageUrl = rawUrl.startsWith("http") ? rawUrl : "https://sportscore.com" + (rawUrl.startsWith("/") ? rawUrl : "/" + rawUrl);
              let response;
              for (let attempt = 1; attempt <= 2; attempt++) {
                const endpoint = "match_page";
                collectorMetrics.request_count++;
                countMetric(endpoint, "requests");
                response = undefined;
                try {
                  response = await fetch(pageUrl, {
                    headers: {
                      "User-Agent": "Mozilla/5.0 (compatible; LIVE-EDGE-AI-PRO/1.0)",
                      "Accept": "text/html",
                      "Cache-Control": "no-cache"
                    },
                    signal: AbortSignal.timeout(15000)
                  });
                  if (response.ok) {
                    collectorMetrics.success_count++;
                    countMetric(endpoint, "successes");
                    break;
                  }
                  collectorMetrics.failure_count++;
                  countMetric(endpoint, "failures");
                  if (response.status === 429) collectorMetrics.http_429_count++;
                  if (response.status >= 500) collectorMetrics.http_5xx_count++;
                  const status = response.status;
                  if (attempt === 2 || (status !== 429 && status < 500)) {
                    throw new Error("Match page HTTP " + status);
                  }
                  const retryAfter = Number(response.headers.get("retry-after"));
                  const waitMs = Number.isFinite(retryAfter) && retryAfter > 0
                    ? Math.min(retryAfter * 1000, 20000)
                    : (status === 429 ? 10000 : 5000);
                  collectorMetrics.retry_count++;
                  console.log("Match page HTTP " + status + "; opakujem pokus po " + Math.round(waitMs / 1000) + " s.");
                  await sleep(waitMs);
                } catch (error) {
                  if (!response) {
                    collectorMetrics.failure_count++;
                    collectorMetrics.network_error_count++;
                    countMetric(endpoint, "failures");
                  }
                  if (attempt === 2 || String(error.message).includes("HTTP 4")) throw error;
                  collectorMetrics.retry_count++;
                  console.log("Chyba stránky zápasu; opakujem pokus:", error.message);
                  await sleep(5000);
                }
              }
              if (!response?.ok) throw new Error("Match page sa nepodarilo načítať.");
              const html = await response.text();
              const home = [];
              const away = [];
              const markers = formatOf(match) === "halves"
                ? ["1st Half Points", "First Half Points", "H1 Points", "2nd Half Points", "Second Half Points", "H2 Points"]
                : ["Q1 Points", "Q2 Points", "Q3 Points", "Q4 Points"];
              for (let q = 0; q < markers.length; q++) {
                const marker = markers[q];
                const at = html.toLowerCase().indexOf(marker.toLowerCase());
                if (at < 0) continue;
                const block = html.slice(at, at + 1400);
                const homeMatch = block.match(/class=["']home-val["'][^>]*>\s*(\d+)/i);
                const awayMatch = block.match(/class=["']away-val["'][^>]*>\s*(\d+)/i);
                if (homeMatch && awayMatch) {
                  const periodIndex = formatOf(match) === "halves" ? (q < 3 ? 0 : 1) : q;
                  home[periodIndex] = Number(homeMatch[1]);
                  away[periodIndex] = Number(awayMatch[1]);
                }
              }
              if (!home.some(Number.isFinite) && !away.some(Number.isFinite)) return null;
              return {
                home: home.map(v => Number.isFinite(v) ? v : null),
                away: away.map(v => Number.isFinite(v) ? v : null)
              };
            }

            async function enrichQuarterScores(list) {
              const output = list.slice();
              // Sequential requests with spacing reduce HTTP 429 rate limits from SportScore.
              for (let index = 0; index < output.length; index++) {
                const match = output[index];
                if (index > 0) await sleep(1200);
                try {
                  const quarters = await getQuarterScores(match);
                  if (quarters) {
                    output[index] = {
                      ...match,
                      period_scores: quarters,
                      quarter_scores_source: "SportScore match page",
                      quarter_scores_checked_at: new Date().toISOString()
                    };
                    console.log("QUARTER SCORES OK:", match.home || match.home_name, "-", match.away || match.away_name, JSON.stringify(quarters));
                  } else {
                    output[index] = { ...match, quarter_scores_checked_at: new Date().toISOString() };
                    console.log("QUARTER SCORES not present:", match.url || match.id);
                  }
                } catch (error) {
                  // Do not stamp failed requests as checked: they remain eligible for a later retry.
                  console.log("QUARTER SCORES failed:", match.url || match.id, error.message);
                }
              }
              return output;
            }

            const enrichedLiveMatches = await enrichQuarterScores(liveMatches);
            const liveById = new Map(enrichedLiveMatches.map(m => [String(m.id || m.slug || m.url || ""), m]));
            const enrichedMatches = matches.map(m => liveById.get(String(m.id || m.slug || m.url || "")) || m);
            console.log("LIVE zápasy s dostupným rozpisom štvrtín:", enrichedLiveMatches.filter(m => m.period_scores).length, "/", enrichedLiveMatches.length);
            const now = new Date().toISOString();

            // Finished games are collected separately so they remain available after leaving LIVE.
            let finishedMatches = [];
            try {
              const finishedUrl = "https://sportscore.com/api/v1/fixtures/?sport=basketball&date=" + todayUTC + "&status=finished&limit=200";
              const finishedPayload = await getJSON(finishedUrl);
              if (finishedPayload && Array.isArray(finishedPayload.matches)) {
                finishedMatches = finishedPayload.matches;
                console.log("Ukončené zápasy načítané:", finishedMatches.length);
              }
            } catch (archiveError) {
              console.log("Upozornenie: archívne výsledky sa nepodarilo načítať:", archiveError.message);
            }

            let archive = [];
            try {
              const oldArchive = JSON.parse(fs.readFileSync(ARCHIVE, "utf8"));
              if (Array.isArray(oldArchive.matches)) archive = oldArchive.matches;
            } catch (_) {}
            const archiveById = new Map(archive.map(m => [String(m.id || m.slug || m.url || ""), m]));
            // Enrich a small batch of finished games missing quarter data on each run.
            // Failed/empty pages are retried after six hours to avoid hammering the provider.
            const hasCompleteQuarterScores = (scores, match) => {
              if (!scores?.home || !scores?.away) return false;
              return Array.from({ length: periodCount(match) }, (_, q) => q).every(q => {
                const h = Number(scores.home[q]), a = Number(scores.away[q]);
                return scores.home[q] !== null && scores.home[q] !== undefined &&
                  scores.away[q] !== null && scores.away[q] !== undefined &&
                  Number.isFinite(h) && Number.isFinite(a) && h + a > 0;
              });
            };
            const finishedNeedingQuarters = finishedMatches.filter(match => {
              const id = String(match.id || match.slug || match.url || "");
              const existing = archiveById.get(id) || {};
              // Keep partial records and retry them after six hours until Q1-Q4 are complete.
              if (hasCompleteQuarterScores(existing.period_scores, match)) return false;
              const checked = Date.parse(existing.quarter_scores_checked_at || "");
              return !Number.isFinite(checked) || Date.now() - checked > 6 * 60 * 60 * 1000;
            }).slice(0, 8);
            const enrichedFinishedBatch = await enrichQuarterScores(finishedNeedingQuarters);
            const enrichedFinishedById = new Map(enrichedFinishedBatch.map(m => [String(m.id || m.slug || m.url || ""), m]));
            for (const match of finishedMatches) {
              const id = String(match.id || match.slug || match.url || "");
              if (!id) continue;
              const existing = archiveById.get(id) || {};
              const enriched = enrichedFinishedById.get(id);
              let mergedPeriodScores = existing.period_scores || match.period_scores || null;
              if (enriched?.period_scores) {
                const oldScores = existing.period_scores || {};
                const newScores = enriched.period_scores;
                const home = [], away = [];
                for (let q = 0; q < 4; q++) {
                  const oldH = Number(oldScores.home?.[q]), oldA = Number(oldScores.away?.[q]);
                  const oldValid = oldScores.home?.[q] !== null && oldScores.home?.[q] !== undefined &&
                    oldScores.away?.[q] !== null && oldScores.away?.[q] !== undefined &&
                    Number.isFinite(oldH) && Number.isFinite(oldA) && oldH + oldA > 0;
                  const newH = Number(newScores.home?.[q]), newA = Number(newScores.away?.[q]);
                  const newValid = newScores.home?.[q] !== null && newScores.home?.[q] !== undefined &&
                    newScores.away?.[q] !== null && newScores.away?.[q] !== undefined &&
                    Number.isFinite(newH) && Number.isFinite(newA) && newH + newA > 0;
                  home[q] = oldValid ? oldH : newValid ? newH : null;
                  away[q] = oldValid ? oldA : newValid ? newA : null;
                }
                mergedPeriodScores = { home, away };
              }
              archiveById.set(id, {
                ...existing,
                ...match,
                ...(mergedPeriodScores ? { period_scores: mergedPeriodScores } : {}),
                ...(enriched ? {
                  ...(enriched.period_scores ? { quarter_scores_source: enriched.quarter_scores_source } : {}),
                  quarter_scores_checked_at: enriched.quarter_scores_checked_at
                } : {}),
                status: "finished",
                archived_at: existing.archived_at || now
              });
            }
            archive = [...archiveById.values()]
              .sort((a, b) => String(b.archived_at || b.time || "").localeCompare(String(a.archived_at || a.time || "")))
              .slice(0, 1000);
            fs.writeFileSync(ARCHIVE, JSON.stringify({
              sport: "basketball",
              updated_at: now,
              count: archive.length,
              matches: archive
            }, null, 2) + "\n");
            collectorMetrics.finished_at = new Date().toISOString();
            collectorMetrics.duration_ms =
              Date.parse(collectorMetrics.finished_at) - Date.parse(collectorMetrics.started_at);
            console.log("BASKETBALL COLLECTOR METRICS:", JSON.stringify(collectorMetrics));
            const metricsPath = "data/basketball-collector-metrics.jsonl";
            const metricsHistory = fs.existsSync(metricsPath)
              ? fs.readFileSync(metricsPath, "utf8").split("\n").filter(Boolean)
              : [];
            metricsHistory.push(JSON.stringify({
              sport: "basketball",
              ...collectorMetrics
            }));
            fs.writeFileSync(metricsPath, metricsHistory.slice(-1000).join("\n") + "\n");

            const output = {
              schema_version: 1,
              collector_metrics: collectorMetrics,
              sport: "basketball",
              source,
              collected_at: now,
              collection_started_at: started,
              data_status: "complete",
              collection_complete: true,
              fixture_count: matches.length,
              live_count: liveMatches.length,
              matches: enrichedMatches,
              live_matches: enrichedLiveMatches
            };

            fs.writeFileSync(CURRENT, JSON.stringify(output, null, 2) + "\n");

            const line = JSON.stringify({
              collected_at: now,
              fixture_count: matches.length,
              live_count: liveMatches.length,
              match_ids: liveMatches.map(m => String(m.id || m.slug || m.url || "")).filter(Boolean)
            });
            fs.appendFileSync(HISTORY, line + "\n");

            const lines = fs.readFileSync(HISTORY, "utf8").trim().split("\n").filter(Boolean);
            fs.writeFileSync(HISTORY, lines.slice(-2016).join("\n") + "\n");

            console.log("Zápasy v odpovedi API:", matches.length);
            console.log("Rozpoznané LIVE zápasy:", liveMatches.length);
            console.log("Kľúče prvého záznamu:", matches[0] ? Object.keys(matches[0]).join(", ") : "žiadne");
            console.log("Basketbalové dáta uložené:", CURRENT);
          }

          main().catch(error => {
            console.error("BASKETBALL COLLECTOR ERROR:", error);
            process.exit(1);
          });
          NODE

      - name: Build and evaluate format-aware basketball predictions
        run: |
          node <<'NODE'
          const fs = require("fs");
          const CURRENT = "data/basketball-current.json";
          const ARCHIVE = "data/basketball-archive.json";
          const PREDICTIONS = "data/basketball-predictions.json";
          const read = (path, fallback) => { try { return JSON.parse(fs.readFileSync(path, "utf8")); } catch (_) { return fallback; } };
          const current = read(CURRENT, {});
          const archive = read(ARCHIVE, { matches: [] });
          const history = read(PREDICTIONS, { sport: "basketball", predictions: [] });
          // Keep all existing v3 predictions and all half-model v4 records.
          const predictions = (Array.isArray(history.predictions) ? history.predictions : [])
            .filter(p => (p.model_version === 3 && p.training_scope === "league") || p.model_version === 4 || p.model_version === 5);
          const keyOf = m => String(m.id || m.slug || m.url || [m.home, m.away, m.time].join("|"));
          const leagueOf = m => String(m.competition?.name || m.league?.name || m.competition || m.league || "Liga neznáma").trim();
          const formatOf = m => {
            const league = leagueOf(m).toLowerCase();
            const teams = [m.home || m.home_name || "", m.away || m.away_name || ""].join(" ").toLowerCase();
            const ncaa = /ncaa|national collegiate athletic association/.test(league);
            const women = /women|woman|ladies|lady|female|wbb/.test(league) || /women|lady|ladies/.test(teams);
            return ncaa && !women ? "halves" : "quarters";
          };
          const periodCount = m => formatOf(m) === "halves" ? 2 : 4;
          const qValue = (m, side, q) => {
            const v = m?.period_scores?.[side]?.[q - 1];
            return v === null || v === undefined || v === "" ? null : Number.isFinite(Number(v)) ? Number(v) : null;
          };
          const qTotal = (m, q) => {
            const h = qValue(m, "home", q), a = qValue(m, "away", q);
            return h === null || a === null ? null : h + a;
          };
          const complete = (m, q) => { const total = qTotal(m, q); return total !== null && total > 0; };
          const periodOf = m => {
            const s = String(m.status_text || m.period?.name || m.period || m.status || "").toLowerCase();
            const match = s.match(/(?:^|\b)([1-4])(?:st|nd|rd|th)?\s*(?:quarter|period|q)\b|\b(?:quarter|period|q)\s*([1-4])(?:\b|$)/);
            if (match) return Number(match[1] || match[2]);
            if (/half.?time|halftime|break/.test(s)) return formatOf(m) === "halves" ? 2 : 3;
            if (/finished|ended|full.?time/.test(s)) return formatOf(m) === "halves" ? 3 : 5;
            return 0;
          };
          const isHalftime = m => /half.?time|halftime|break/.test(
            String(m.status_text || m.period?.name || m.period || m.status || "").toLowerCase()
          );
          const archiveMatches = Array.isArray(archive.matches) ? archive.matches : [];
          const allNow = [...(Array.isArray(current.live_matches) ? current.live_matches : []), ...archiveMatches];
          const lookup = new Map(allNow.map(m => [keyOf(m), m]));
          let settled = 0;
          for (const p of predictions) {
            if (p.actual_total !== null && p.actual_total !== undefined) continue;
            const m = lookup.get(p.match_key);
            if (!m) continue;
            const halfModel = p.model_version === 4;
            if (halfModel !== (formatOf(m) === "halves")) continue;
            const target = halfModel ? Number(p.target_half) : Number(p.target_quarter);
            if (periodOf(m) > target && complete(m, target)) {
              p.actual_total = qTotal(m, target);
              p.absolute_error = Math.abs(p.predicted_total - p.actual_total);
              p.settled_at = new Date().toISOString();
              settled++;
            }
          }
          const quarterTraining = archiveMatches.filter(m => formatOf(m) === "quarters" &&
            [1,2,3,4].every(q => complete(m,q)));
          const halfTraining = archiveMatches.filter(m => formatOf(m) === "halves" &&
            [1,2].every(q => complete(m,q)));
          const live = Array.isArray(current.live_matches) ? current.live_matches : [];
          let created = 0;
          // Existing v3 quarter model remains unchanged for leagues that use four quarters.
          for (const m of live) {
            if (formatOf(m) !== "quarters") continue;
            const period = periodOf(m);
            if (period < 2 || period > 4) continue;
            const target = period;
            if (![...Array(target - 1)].every((_,i) => complete(m,i+1))) continue;
            const matchKey = keyOf(m);
            if (predictions.some(p => p.match_key === matchKey && p.model_version === 3 && p.target_quarter === target)) continue;
            const league = leagueOf(m);
            const selected = quarterTraining.filter(x => leagueOf(x) === league && complete(x,target));
            if (selected.length < 10) continue;
            const historicalAverage = selected.reduce((sum,x) => sum + qTotal(x,target),0) / selected.length;
            const previous = Array.from({length:target-1},(_,i)=>qTotal(m,i+1));
            const previousAverage = previous.reduce((sum,v)=>sum+v,0) / previous.length;
            const predicted = Math.round(previousAverage * 0.65 + historicalAverage * 0.35);
            predictions.push({
              id: matchKey + "::Q" + target, model_version: 3, match_key: matchKey,
              home: m.home || m.home_name || "Domáci", away: m.away || m.away_name || "Hostia",
              league, target_quarter: target, predicted_total: predicted,
              range_low: Math.max(0,predicted-5), range_high: predicted+5,
              historical_average: Number(historicalAverage.toFixed(2)),
              previous_quarters_average: Number(previousAverage.toFixed(2)),
              training_sample: selected.length, training_scope: "league", previous_quarters: previous,
              observed_at: new Date().toISOString(), data_delay_note: "Zber môže byť oneskorený približne 5 minút.",
              actual_total: null, absolute_error: null
            });
            created++;
          }
          // Experimental v5 challenger: 80% same-league historical quarter + 20% current-game pace.
          // Use only completed games that started before this LIVE match and were archived before prediction time.
          const predictionTime = Date.now();
          for (const m of live) {
            if (formatOf(m) !== "quarters") continue;
            const period = periodOf(m);
            if (period < 2 || period > 4) continue;
            const target = period;
            if (![...Array(target - 1)].every((_,i) => complete(m,i+1))) continue;
            const matchKey = keyOf(m);
            if (predictions.some(p => p.match_key === matchKey && p.model_version === 5 && p.target_quarter === target)) continue;
            const league = leagueOf(m);
            const liveStart = Date.parse(m.time || m.start_time || m.startTime || "");
            if (!Number.isFinite(liveStart)) continue;
            const selected = quarterTraining.filter(x => {
              const historicalStart = Date.parse(x.time || x.start_time || x.startTime || "");
              const archivedAt = Date.parse(x.archived_at || "");
              return leagueOf(x) === league && complete(x,target) &&
                Number.isFinite(historicalStart) && historicalStart < liveStart &&
                Number.isFinite(archivedAt) && archivedAt <= predictionTime;
            });
            if (selected.length < 10) {
              console.log("V5 SKIPPED: as-of same-league sample below 10", league, selected.length);
              continue;
            }
            const historicalAverage = selected.reduce((sum,x)=>sum+qTotal(x,target),0) / selected.length;
            const previous = Array.from({length:target-1},(_,i)=>qTotal(m,i+1));
            const previousAverage = previous.reduce((sum,v)=>sum+v,0) / previous.length;
            const predicted = Math.round(previousAverage * 0.20 + historicalAverage * 0.80);
            predictions.push({
              id: matchKey + "::Q" + target + "::V5", model_version: 5, match_key: matchKey,
              home: m.home || m.home_name || "Domáci", away: m.away || m.away_name || "Hostia",
              league, target_quarter: target, predicted_total: predicted,
              range_low: Math.max(0,predicted-5), range_high: predicted+5,
              historical_average: Number(historicalAverage.toFixed(2)),
              previous_quarters_average: Number(previousAverage.toFixed(2)),
              training_sample: selected.length, training_scope: "league-as-of",
              historical_cutoff: new Date(predictionTime).toISOString(),
              previous_quarters: previous, observed_at: new Date(predictionTime).toISOString(),
              model_note: "V5 challenger: 80% historický priemer rovnakej ligy + 20% tempo zápasu; iba skoršie a už archivované zápasy.",
              actual_total: null, absolute_error: null
            });
            created++;
            console.log("V5 CHALLENGER:", m.home, "-", m.away, "Q"+target, predicted, "sample", selected.length);
          }
          // New v4 model for men's NCAA: forecast the second half from the completed first half
          // plus the historical second-half average from the same competition only.
          for (const m of live) {
            if (formatOf(m) !== "halves" || !isHalftime(m) || periodOf(m) !== 2 || !complete(m,1)) continue;
            const matchKey = keyOf(m);
            if (predictions.some(p => p.match_key === matchKey && p.model_version === 4 && p.target_half === 2)) continue;
            const league = leagueOf(m);
            const selected = halfTraining.filter(x => leagueOf(x) === league && complete(x,2));
            if (selected.length < 10) {
              console.log("HALF PREDICTION SKIPPED: NCAA vzorka pod 10 zápasov", league, selected.length);
              continue;
            }
            const historicalAverage = selected.reduce((sum,x) => sum + qTotal(x,2),0) / selected.length;
            const previousAverage = qTotal(m,1);
            const predicted = Math.round(previousAverage * 0.65 + historicalAverage * 0.35);
            predictions.push({
              id: matchKey + "::H2", model_version: 4, match_key: matchKey,
              home: m.home || m.home_name || "Domáci", away: m.away || m.away_name || "Hostia",
              league, target_half: 2, predicted_total: predicted,
              range_low: Math.max(0,predicted-5), range_high: predicted+5,
              historical_average: Number(historicalAverage.toFixed(2)),
              previous_halves_average: Number(previousAverage.toFixed(2)),
              training_sample: selected.length, training_scope: "league-halves",
              previous_halves: [previousAverage], observed_at: new Date().toISOString(),
              data_delay_note: "NCAA mužov: predikcia druhého polčasu po dokončení prvého; zber môže meškať približne 5 minút.",
              actual_total: null, absolute_error: null
            });
            created++;
            console.log("NEXT HALF PREDICTION:", m.home, "-", m.away, "H2", predicted, "sample", selected.length);
          }
          const trimmed = predictions.sort((a,b)=>String(b.observed_at).localeCompare(String(a.observed_at))).slice(0,1000);
          fs.writeFileSync(PREDICTIONS, JSON.stringify({
            sport: "basketball", updated_at: new Date().toISOString(),
            model: "v3: 4 štvrtiny (65/35); v4: mužské NCAA, 2 polčasy; v5: experimentálny challenger pre 4 štvrtiny (80% historická liga + 20% tempo zápasu), iba skoršie zápasy archivované pred predikciou.",
            complete_training_games: quarterTraining.length,
            complete_half_training_games: halfTraining.length,
            settled_this_run: settled, created_this_run: created, predictions: trimmed
          }, null, 2) + "\n");
          console.log("PREDICTIONS: vytvorené", created, "vyhodnotené", settled,
            "tréning Q zápasy", quarterTraining.length, "tréning NCAA polčasy", halfTraining.length,
            "celkom", trimmed.length);
          NODE

      - name: Commit basketball data
        run: |
          if git diff --quiet -- data/basketball-current.json data/basketball-history.jsonl data/basketball-archive.json data/basketball-predictions.json data/basketball-collector-metrics.jsonl; then
            echo "Basketball data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/basketball-current.json data/basketball-history.jsonl data/basketball-archive.json data/basketball-predictions.json data/basketball-collector-metrics.jsonl
          git commit -m "Update LIVE basketball data"
          # Football and basketball collectors can commit near-simultaneously.
          # Rebase our basketball-only commit onto the latest main before pushing.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict, retry ${attempt}/3"
            sleep 2
          done
          echo "Unable to push basketball data after three retries."
          exit 1
