name: AI Edge LIVE trainer tests

on:
  push:
    paths:
      - "scripts/ai-edge-live-online-trainer.js"
      - "scripts/test-ai-edge-live-corners-under-trainer.js"
      - "scripts/ai-edge-live-cards-under-trainer.js"
      - "scripts/test-ai-edge-live-cards-under-trainer.js"
      - "scripts/ai-edge-live-corners-under-trainer.js"
      - "scripts/test-ai-edge-live-online-trainer.js"
      - "ai-edge-selector-ui.js"
      - "corners-under-dashboard.js"
      - "scripts/ai-edge-live-late-ft-trainer.js"
      - "scripts/test-ai-edge-live-late-ft-trainer.js"
      - "scripts/ai-edge-live-prediction-ledger.js"
      - "ai-edge-selector-ui.js"
      - "scripts/test-ai-edge-live-prediction-ledger.js"
      - "scripts/ai-edge-market-top-predictions.js"
      - "scripts/test-ai-edge-market-top-predictions.js"
      - "scripts/ai-edge-top-opportunity-ledger.js"
      - "scripts/flashscore-primary-adapter.js"
      - ".github/workflows/ai-edge-live-trainer-tests.yml"
  pull_request:
    paths:
      - "scripts/ai-edge-live-online-trainer.js"
      - "scripts/test-ai-edge-live-online-trainer.js"
      - "scripts/ai-edge-live-cards-under-trainer.js"
      - "scripts/test-ai-edge-live-cards-under-trainer.js"
      - "scripts/ai-edge-live-corners-under-trainer.js"
      - "scripts/test-ai-edge-live-corners-under-trainer.js"
      - "scripts/ai-edge-live-late-ft-trainer.js"
      - "scripts/test-ai-edge-live-late-ft-trainer.js"
      - "scripts/ai-edge-market-top-predictions.js"
      - "scripts/test-ai-edge-market-top-predictions.js"
      - "scripts/ai-edge-top-opportunity-ledger.js"
      - "scripts/flashscore-primary-adapter.js"
      - ".github/workflows/ai-edge-live-trainer-tests.yml"

permissions:
  contents: read

concurrency:
  group: ai-edge-live-trainer-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test forward-only LIVE trainer
        run: |
          node scripts/test-ai-edge-live-online-trainer.js
          node scripts/test-ai-edge-live-corners-under-trainer.js
          node scripts/test-ai-edge-live-cards-under-trainer.js
          node scripts/test-ai-edge-live-late-ft-trainer.js
          node scripts/test-ai-edge-live-prediction-ledger.js
          node scripts/test-ai-edge-top-opportunity-ledger.js
          node scripts/test-ai-edge-market-top-predictions.js
          node --check scripts/ai-edge-live-online-trainer.js
          node --check scripts/ai-edge-live-market-predictions.js
          node --check scripts/ai-edge-market-top-predictions.js
          node --check scripts/ai-edge-live-cards-under-trainer.js
          node --check scripts/ai-edge-top-opportunity-ledger.js
          node --check scripts/ai-edge-live-corners-under-trainer.js
          node --check ai-edge-selector-ui.js
          node --check corners-under-dashboard.js
