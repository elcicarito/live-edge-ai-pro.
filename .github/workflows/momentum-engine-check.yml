name: Momentum Engine Validation

on:
  push:
    paths:
      - 'momentum-engine.js'
      - 'scanner.js'
      - 'index.html'
      - 'scripts/test-momentum-engine.js'
      - 'scripts/flashscore-only-collector.js'
      - 'scripts/test-flashscore-only-collector.js'
      - 'scripts/flashscore-primary-adapter.js'
      - 'scripts/test-flashscore-primary-adapter.js'
      - '.github/workflows/momentum-engine-check.yml'
  pull_request:
    paths:
      - 'momentum-engine.js'
      - 'scanner.js'
      - 'index.html'
      - 'scripts/test-momentum-engine.js'
      - 'scripts/flashscore-primary-adapter.js'
      - 'scripts/test-flashscore-primary-adapter.js'
      - '.github/workflows/momentum-engine-check.yml'

permissions:
  contents: read

# Serialize repeated validation runs without cancelling an active run.
concurrency:
  group: momentum-engine-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check momentum-engine.js
          node --check scanner.js
          node --check scripts/flashscore-only-collector.js
          node --check scripts/flashscore-primary-adapter.js
      - name: Test momentum calculations
        run: node scripts/test-momentum-engine.js
      - name: Test Flashscore primary adapter metadata
        run: node scripts/test-flashscore-primary-adapter.js
      - name: Integration test Flashscore-only collector
        run: node scripts/test-flashscore-only-collector.js
